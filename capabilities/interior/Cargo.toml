[package]
name = "interior"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Raumplanung: misst Layouts gegen die Raeumungsregeln einer Wohnung und sucht Positionen, die sie erfuellen."
publish = false

[[bin]]
name = "interior"
path = "src/main.rs"

[lib]
name = "interior"
path = "src/lib.rs"

[dependencies]
# Pflicht, kein Komfort: doctors "Server bind policy" weist jede Capability zurueck, die sich
# einen eigenen Listener baut.
sjel-server = { path = "../../libs/sjel-server" }
# Loest SJEL_PERSONAL_ROOT auf. Jede Zahl, die diese Capability rechnet, liegt unter
# <overlay>/data/interior — hier liegt keine.
sjel-config = { path = "../../libs/sjel-config" }
# `/routes` neben `/health`, wie jede andere Capability mit HTTP-Oberflaeche.
route-manifest = { path = "../../libs/route-manifest" }
# Das Inventar sind Zeilen (PRD Q58/B25). Eine Datei fuer alle Capabilities, `interior_`
# als Praefix — libs/sjel-store/README.md hat das Warum.
sjel-store = { path = "../../libs/sjel-store" }
# Shared Ed25519 device verification for the authenticated sync ingress.
devices = { path = "../devices" }
# Die eine Art, eine Datei aus einer erklaerten Vault-Wurzel zu holen, plus die markierte
# Region. Null Abhaengigkeiten, und die Konflikterkennung liegt in der Datei selbst.
markdown-root = { path = "../../libs/markdown-root" }
# Der Tag, an dem ein Entwurf entsteht. Vier Capabilities hatten diese zwoelf Zeilen
# abgeschrieben, statt eine zu teilen — libs/civil-date/README begruendet, warum das
# Teilen keinen Datumsabhaengigkeit kostet, und genau darum geht es hier.
civil-date = { path = "../../libs/civil-date" }
rusqlite.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true
# Not `full`: these are the drivers this crate reaches for, verified with a lone
# `cargo check -p <crate> --all-targets`, which is the only build where a missing
# tokio feature is visible (a workspace build unifies them away).
# `fs` for api_media's `canonicalize`/`metadata`/`read`, which must not block the runtime.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "fs"] }
axum.workspace = true
# Not `thiserror.workspace = true`: the workspace entry is "1.0", which six members share,
# and this crate is the only one on 2.0. Inheriting would downgrade it; raising the table
# would bump the other six. Both are version changes, which belong on a Dependabot commit.
thiserror = "2.0"
# Der eigentliche Hebel der Suche: die Kandidaten sind voneinander unabhaengig.
rayon = "1"

[dev-dependencies]
# `ServiceExt::oneshot`, damit der Origin-Test den verdrahteten Router ohne Listener und
# ohne Port fahren kann. Dasselbe Muster nutzt capabilities/sjel-status bereits.
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true

[package]
name = "sjel-pseudonymize"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Reversible bidirectional session pseudonymization for cloud evaluators and agents."
publish = false

[lib]
name = "sjel_pseudonymize"
path = "src/lib.rs"

[dependencies]
aho-corasick.workspace = true
# The entity decoder only (`pattern::decode_basic_entities`). `libs/extraction` owns that
# table; default features off, so the `xberg` PDF rung is not linked into a consumer that
# only needs the decoder.
sjel-extraction = { path = "../extraction", default-features = false }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true

[lints]
workspace = true

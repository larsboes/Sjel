[package]
name = "sjel-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "One home for how a capability opens the shared SQLite file: pool per path, PRAGMAs on every connection, migration once per (file, table prefix)."
publish = false

[lib]
name = "sjel_store"
path = "src/lib.rs"

[dependencies]
# `bundled` compiles SQLite into the binary. See upstreams.toml [rusqlite] for
# why that rather than the system library: the deployment must not depend on
# whichever SQLite macOS or an Alpine image happens to ship.
rusqlite.workspace = true
# The generic pool. See upstreams.toml [r2d2] -- kept across the Postgres
# retirement (PRD Q45) because the pool shape and the calling convention are
# what 134 call sites were written against; only the manager changed.
r2d2 = "0.8"
r2d2_sqlite = "0.35"
# For `json_column` only. SQLite has no JSON type, so the columns Postgres held
# as jsonb or integer[] are TEXT here, and reading one back is a store concern
# rather than a per-capability one.
serde.workspace = true
serde_json.workspace = true

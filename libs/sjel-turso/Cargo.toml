[package]
name = "sjel-turso"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Turso / LibSQL storage engine for Sjel: async multi-writer concurrency, MVCC, and embedded replicas."
publish = false

[lib]
name = "sjel_turso"
path = "src/lib.rs"

[features]
default = []
# Embedded replicas. Turns on LibSQL's sync client, which pulls a remote primary's
# write-ahead log into the local file. It brings its own networking stack (hyper, tonic,
# rustls), so it is opt-in per consumer rather than paid for by every binary that links
# this crate: `sjel-turso = { workspace = true, features = ["replica"] }`.
#
# Verified with `cargo test -p sjel-turso --features replica`.
replica = ["libsql/sync", "libsql/tls"]

[dependencies]
libsql.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "macros", "time"] }

[lints]
workspace = true

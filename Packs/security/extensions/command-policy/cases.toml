# ---- write / edit tools: step 4, like a shell write ----
[[write]]
path = "src/main.rs"
class = "allow"
[[write]]
path = "/tmp/scratch.txt"
class = "allow"
[[write]]
path = "/etc/passwd"
class = "allow"

# knowledge-base — the vault, as a thing that gets backed up. See
# schemas/service.toml.example for the field reference.
#
# `kind = "data"`: no image, no command, nothing to start. Obsidian owns this directory and
# Axon never writes to it outside the declared projection regions
# (libs/markdown-root/src/projection.rs). Same shape as capabilities/store: a file tree still
# needs one owner for the one thing a file tree needs an owner for, which is backup.
#
# It exists because the mount was declared and never verified. The overlay's machine.toml has
# carried `[[state_mount]] tool = "knowledge-base"` with `sync = "git"` — "git is history +
# backup (bare repo on homepi)" — and `direction = "capture"`, "Axon config backs it up +
# monitors", since the registry was written. Measured 2026-08-29: the vault's git checkout has
# no remote and never had one, `tmutil` reports no Time Machine destination on the host at all,
# no LaunchAgent references the path, and sjel-status' backup registry held exactly `finance`
# and `store`. A restic repository on the target does hold a snapshot — from 2026-08-02, taken
# by a binary that is not installed on this machine. Twenty-seven days, unnoticed, because
# nothing was watching a mount that no manifest owned.
#
# A state_mount says where data lives. Only a manifest puts it in the registry that reports
# when a backup goes stale, and that difference is the whole reason for this file.
kind = "data"
name = "knowledge-base"

# The path root is NOT declared here, and that is deliberate. `backup_paths` entries are tar
# member names as well as sources, so tools/backup.sh runs them through `safe_relative()`, which
# refuses anything absolute. The vault also sits outside the overlay, under an iCloud container
# whose location is a fact about this machine rather than about Axon — the same reason
# [[state_mount]] lives in the overlay and not in axon.toml.
#
# So the member name is tracked here and the machine names only the root it hangs from:
#
#   [capability.knowledge-base]
#   backup_source_root = "~/Library/.../Documents"     # in the overlay's machine.toml
#
# Same per-machine override seam as `[capability.<name>] port`, and the same reason for it. The
# default root stays the overlay, so every other capability is unaffected. tools/restore.sh needs
# no knowledge of any of this: it compares the archive's path contract against this manifest and
# both say `Knowledge-Base`.
#
# "Knowledge-Base" is an Axon-wide name, not a machine one — the vault is cited by that name
# throughout the PRD and the agent bootstrap — so it belongs in the tracked file.
backup_paths = ["Knowledge-Base"]

# `.obsidian/plugin-backups/` is Obsidian's own copy of previously installed plugins, and on this
# vault it held 19 symlinks pointing out of the vault at a since-retired plugin monorepo, so every
# one of them dangles. Four kilobytes of dead links made the first 704 MB archive unrestorable,
# because tools/restore.sh refuses any archive carrying a link (a symlink inside an archive is how
# extraction escapes the directory the operator chose). tools/backup.sh now refuses to ship one
# too, so this exclusion is what keeps the vault backup possible rather than what hides a warning.
#
# Excluded rather than deleted: it is Obsidian's directory, not Axon's, and a backup tool that
# edits the thing it is backing up has the wrong relationship to it.
#
# The second entry is the same class of thing, found 2026-09-23 by rehearsing a restore of this
# capability's own archive: `revision-build/node_modules` is a symlink pointing into
# `~/.cache/codex-runtimes/`, left by a runtime that built inside the vault. It is the only link
# in the vault outside `.obsidian/plugin-backups/`, and one link is enough to make the whole 4.8 GB
# archive unrestorable. Nothing is lost by excluding it — it is a pointer to a cache, not content.
#
# The exclusion is narrow on purpose. It names the one path known to be a build artifact rather
# than every `node_modules`, because a blanket pattern would also stop carrying a real directory
# someone happened to name that, and a backup that silently drops content is worse than one that
# refuses. Any other link still refuses the run, which is the correct outcome now that
# verify_archive in tools/backup.sh actually detects them.
# A single-line array on purpose: tools/lib/toml.sh's `toml_array` greps one line, so a
# multi-line array parses as EMPTY and every exclusion silently disappears — measured
# 2026-09-23, when the two entries below were first written across three lines and the vault
# backup shipped all 20 symlinks instead. The fixed verify_archive refused it rather than
# shipping an unrestorable archive, which is how it was caught.
backup_exclude = [".obsidian/plugin-backups", "Projects/Bachelor-Thesis/Kolloquium/Assets/revision-build/node_modules"]

backup_target = "backup-target"

# 2, revised 2026-09-29. The original reasoning is kept below because it is what the number was
# chosen against; the measurement has since moved and the number had to move with it.
#
# What changed: the note below priced an archive at 794 MB (measured 2026-08-29). Measured
# 2026-09-29 with `ls -l` and `du`, an archive is 4,913,142,208 bytes = 4.8 GB, because the vault
# it tars is now 5.0 GB rather than ~800 MB. Seven generations is therefore 33.9 GB, not the
# ~5 GB this comment budgeted, and the target is iCloud Drive on a volume reporting 11 GB free
# (98% full). That is the same disk-pressure failure the original note was written to avoid,
# reached from the other direction — the reasoning held, the input moved.
#
# Why the lower retention costs least here: `.git` is inside the archive, so every generation
# carries the vault's complete history and not just its current state. "How far back can I go"
# is not answered by how many tarballs survive. Two generations, each with full git history, is
# the intended shape; seven was buying very little for 33.9 GB.
#
# Original note, kept for the parts that still hold — one archive is ~794 MB (measured
# 2026-08-29: 596 MB of it is Atlas attachments; the irreplaceable markdown is 14.2 MB across
# 2,168 notes), and fourteen generations would be ~10 GB on that disk.
backup_retain = "2"

# Daily, matching store. A note written and lost the same day is not re-derivable from anything;
# unlike a feed item there is no source to re-fetch it from. Same reasoning that set store's
# thresholds in PRD Q47: one missed run is "due", two is a problem, and a stale threshold has to
# be reachable by the cadence meant to meet it.
backup_advise_days = "1"
backup_stale_days  = "2"

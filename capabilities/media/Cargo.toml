[package]
name = "sjel-media"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Exact-byte media ingest gate and volume integrity ledger"
publish = false

[lib]
name = "media"
path = "src/lib.rs"

[[bin]]
name = "media"
path = "src/main.rs"

[dependencies]
axum.workspace = true
route-manifest = { path = "../../libs/route-manifest" }
sjel-config = { path = "../../libs/sjel-config" }
sjel-server = { path = "../../libs/sjel-server" }
sjel-store = { path = "../../libs/sjel-store" }
civil-date = { path = "../../libs/civil-date" }
rusqlite.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net"] }

[dev-dependencies]
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true

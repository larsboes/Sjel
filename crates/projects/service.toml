# Projects, tasks, project notes, and attachment backup contract.
kind               = "process"
name               = "projects"
command            = ["target/release/projects-server"]
build              = ["cargo", "build", "--locked", "--release", "--bin", "projects-server"]
port               = "8103"
health_path        = "/health"
ready_path         = "/ready"
proxy_api_only     = "true"
links_to           = ["inv"]
imports            = ["markdown", "attachments"]
exports            = ["markdown", "json"]
backup_paths       = ["data/projects"]
backup_target      = "backup-target"
backup_retain      = "7"
backup_advise_days = "7"
backup_stale_days  = "14"

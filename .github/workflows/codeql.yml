name: CodeQL

# Source-only analysis; shell, Svelte components and Swift are outside this matrix.
# Rust macro expansion limits dataflow coverage; a green scan is not complete coverage.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Refresh query coverage even when source files have not changed.
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  plan:
    name: select CodeQL languages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      codeql: ${{ steps.plan.outputs.codeql }}
      codeql_run: ${{ steps.plan.outputs.codeql_run }}
    steps:
      - name: Check out Sjel
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Plan and summarize
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun tools/ci-plan.ts --workflow codeql.yml --output "$RUNNER_TEMP/codeql-plan.json" --github-output "$GITHUB_OUTPUT"

  analyze:
    name: analyze (${{ matrix.language }})
    needs: plan
    # Evaluate before expanding a possibly empty matrix.
    if: needs.plan.outputs.codeql_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.codeql) }}

    steps:
      - name: Check out Sjel
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@18420e3271f74589575af831a523c833acda327f # codeql-bundle-v2.26.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@18420e3271f74589575af831a523c833acda327f # codeql-bundle-v2.26.2
        with:
          category: "/language:${{ matrix.language }}"

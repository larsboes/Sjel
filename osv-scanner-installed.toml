reason = "SUID/SGID bits preserved during ZIP extraction, a privilege-escalation path fixed in 9.0.0 (CVSS 7.3, AV:L/AC:L/PR:L/UI:R, C:H/I:H/A:H). Reach: the `tauri android` command-line-tools extraction above, and the archive would have to carry SUID/SGID entries, so the source (dl.google.com over TLS) must be hostile or MITM'd. tauri-bundler's own reader applies no Unix mode at all. Ends with the zip version."

[[IgnoredVulns]]

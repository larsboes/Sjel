[package]
name = "sjel-inference"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "One home for which model answers which job on this machine: backends declared once, roles that name backend + model + input prefixes, and a machine-level backend override. Capabilities ask for a role, never a backend."
publish = false

[lib]
name = "sjel_inference"
path = "src/lib.rs"

# This crate owns its HTTP and JSON dependencies directly.
[dependencies]
# Outbound HTTP goes through one factory: the user-agent, the timeout and the
# connection pool are decided there, not at each call site (libs/sjel-http).
sjel-http = { path = "../sjel-http" }
sjel-runtime = { path = "../runtime" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
reqwest = { workspace = true, features = ["json", "blocking"] }
toml.workspace = true
thiserror.workspace = true

[lints]
workspace = true

name: CI
run-name: CI ${{ (github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || inputs.full) && 'full' || 'affected' }}

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 3 * * *"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      full:
        description: Run full verification
        type: boolean
        default: true
  workflow_call:
    inputs:
      full:
        description: Run full verification before preparing artifacts
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  changes:
    name: which checks the change needs
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.plan.outputs.full }}
      quality: ${{ steps.plan.outputs.quality }}
      rust: ${{ steps.plan.outputs.rust }}
      bun: ${{ steps.plan.outputs.bun }}
      ui: ${{ steps.plan.outputs.ui }}
      gates: ${{ steps.plan.outputs.gates }}
      gpui: ${{ steps.plan.outputs.gpui }}
      gpui_matrix: ${{ steps.plan.outputs.gpui_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Plan verification
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          FULL: ${{ inputs.full }}
        run: |
          args=()
          if [ "$FULL" = true ]; then args+=(--full); fi
          bun tools/ci-plan.ts --workflow ci.yml "${args[@]}" \
            --output "$RUNNER_TEMP/sjel-ci-plan.json" --github-output "$GITHUB_OUTPUT"
      - name: Retain verification plan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-plan
          path: ${{ runner.temp }}/sjel-ci-plan.json
          retention-days: 14

  rust-quality:
    name: cargo fmt + clippy
    needs: changes
    if: needs.changes.outputs.quality == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Read verification plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --name verification-plan --dir "$RUNNER_TEMP"
      - run: bun tools/ci-run.ts rust-quality

  cargo-tests:
    name: cargo test (hermetic)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install ExifTool
        run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl
      - name: Read verification plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --name verification-plan --dir "$RUNNER_TEMP"
      - run: bun tools/ci-run.ts cargo-tests
      - name: Report Rust build storage
        if: always()
        run: du -sh target 2>/dev/null || true

  bun-tests:
    name: bun test
    needs: changes
    if: needs.changes.outputs.bun == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: sjel-cli-release
          save-if: false
      - name: Read verification plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --name verification-plan --dir "$RUNNER_TEMP"
      - run: bun tools/ci-run.ts bun-tests

  ui-check:
    name: bun run check (affected UI)
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: sjel-cli-release
          save-if: false
      - name: Minimal overlay for the config read
        run: |
          mkdir -p "$HOME/.sjel-overlay/config"
          printf 'os = "linux"\ncontainer_runtime = "docker"\ncapabilities = []\n' > "$HOME/.sjel-overlay/config/machine.toml"
      - name: Read verification plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --name verification-plan --dir "$RUNNER_TEMP"
      - run: bun tools/ci-run.ts ui-check

  repo-gates:
    name: repo gates (labels, tracked inputs)
    needs: changes
    if: needs.changes.outputs.gates == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: sjel-cli-release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Read verification plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --name verification-plan --dir "$RUNNER_TEMP"
      - run: bun tools/ci-run.ts gates

  gpui-targets:
    name: gpui cargo check (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.gpui == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.gpui_matrix) }}
    defaults:
      run:
        shell: bash
        working-directory: apps/gpui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/gpui
          key: ${{ matrix.name }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Linux libraries for GPUI build scripts
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y pkg-config clang libxkbcommon-dev
          libxkbcommon-x11-dev libwayland-dev libvulkan-dev libx11-xcb-dev libxcb1-dev
          libfontconfig-dev libfreetype-dev libssl-dev libasound2-dev
      - name: Add the target
        if: matrix.target != ''
        env:
          TARGET: ${{ matrix.target }}
        run: rustup target add "$TARGET"
      - name: Point the Android target at the runner's NDK
        if: matrix.target == 'aarch64-linux-android'
        run: |
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CC_aarch64_linux_android=$bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$bin/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
      - name: cargo check
        run: ${{ matrix.check }}

  verification:
    name: verification result
    if: always()
    needs: [changes, rust-quality, cargo-tests, bun-tests, ui-check, repo-gates, gpui-targets]
    runs-on: ubuntu-latest
    env:
      CHANGES: ${{ needs.changes.result }}
      RUST_QUALITY: ${{ needs.rust-quality.result }}
      RUST_QUALITY_SELECTED: ${{ needs.changes.outputs.quality }}
      CARGO_TESTS: ${{ needs.cargo-tests.result }}
      CARGO_TESTS_SELECTED: ${{ needs.changes.outputs.rust }}
      BUN_TESTS: ${{ needs.bun-tests.result }}
      BUN_TESTS_SELECTED: ${{ needs.changes.outputs.bun }}
      UI_CHECK: ${{ needs.ui-check.result }}
      UI_CHECK_SELECTED: ${{ needs.changes.outputs.ui }}
      REPO_GATES: ${{ needs.repo-gates.result }}
      REPO_GATES_SELECTED: ${{ needs.changes.outputs.gates }}
      GPUI: ${{ needs.gpui-targets.result }}
      GPUI_SELECTED: ${{ needs.changes.outputs.gpui }}
    steps:
      - name: Verify job results
        run: |
          if [ "$CHANGES" != success ]; then
            echo "Verification planning did not succeed: $CHANGES" >&2
            exit 1
          fi
          for job in RUST_QUALITY CARGO_TESTS BUN_TESTS UI_CHECK REPO_GATES GPUI; do
            selected="${job}_SELECTED"
            case "${!selected}:${!job}" in
              true:success|false:skipped) ;;
              *) echo "$job selection/result mismatch: ${!selected}:${!job}" >&2; exit 1 ;;
            esac
          done

  full-verification:
    name: full verification result
    needs: [changes, verification]
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Record full verification
        env:
          COMMIT: ${{ github.sha }}
        run: printf '%s\n' "$COMMIT" > "$RUNNER_TEMP/full-verification.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: full-verification
          path: ${{ runner.temp }}/full-verification.txt
          retention-days: 90

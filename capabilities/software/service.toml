# Installed software inventory, sizes, and last-used scan service.
kind           = "process"
name           = "software"
command        = ["target/release/software", "serve"]
build          = ["cargo", "build", "--locked", "--release", "--bin", "software"]
port           = "8106"
health_path    = "/health"
ready_path     = "/ready"
autostart      = "true"
proxy_api_only = "true"

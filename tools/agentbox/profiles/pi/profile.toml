# Agent profile: pi (https://github.com/earendil-works/pi), verdict in upstreams.toml.
# Public, tracked, instance-free — the box's shape. What varies per machine (model,
# endpoint, key, resource limits) lives in <overlay>/config/agentbox.toml instead.
#
# NO VERSION, and no checksum literal (Q77, 2026-09-02). `agentbox build` and
# `agentbox host-install` resolve the LATEST release from `release_latest_api` and take the
# checksum from THAT release's own published SHA256SUMS. Bumping the agent is re-running
# either command; there is nothing here to edit.
#
# Losing the literals loses nothing that was checked. A checksum copied into this file
# answered "are these the bytes somebody once read", and it was copied FROM the same
# SHA256SUMS the build now reads directly. What it actually bought was a version freeze, and
# the freeze is what the ruling removed. The archive is still verified twice: on the host
# before the build, and again inside it (Containerfile's `sha256sum -c`).

name    = "pi"

# The upstreams.toml section that owns the verdict for this agent. Declared rather than
# derived from `name`: the section is named for the package (pi-coding-agent), the profile
# for the command (pi), and guessing across that gap is how a check ends up asking GitHub
# about the wrong repository. `agentbox host-install` reads it to name the advisory list.
upstream = "pi-coding-agent"

# Where the version comes from. GitHub's /releases/latest is the most recently published
# NON-prerelease, which is the channel this deployment wants; `tag_name` is `v<version>`,
# and the launcher strips exactly one leading v.
release_latest_api = "https://api.github.com/repos/earendil-works/pi/releases/latest"

# {version}, {os} and {arch} are substituted by the launcher. arch comes from the
# host (arm64 | x64), so the same profile serves an Intel Mac unchanged. os is the
# TARGET's, not the host's: the box is a Linux container whatever it is built on,
# while a host install of the same release is darwin.
archive_url    = "https://github.com/earendil-works/pi/releases/download/v{version}/pi-{os}-{arch}.tar.gz"
archive_root   = "pi"     # top-level directory inside the tarball
bin_path       = "pi"     # the executable, relative to archive_root

# The release's own checksum manifest, `<sha256>  <asset-name>` per line. Verified against
# the asset basename taken from archive_url above, so the two cannot name different files.
checksums_url  = "https://github.com/earendil-works/pi/releases/download/v{version}/SHA256SUMS"

# Where the agent's config directory is mounted, and the env var that points it there.
config_dir     = "/home/agent/config"
config_dir_env = "PI_CODING_AGENT_DIR"

# Rendered from <name>.tmpl in this directory into the mounted config dir on every
# run, so Sjel stays the source of truth for the contract and the overlay only holds
# instance values plus the agent's own runtime artifacts (sessions, caches, trust
# decisions). An `extensions/` directory here, if present, is copied alongside them.
render = ["AGENTS.md", "models.json"]

# Startup network operations (model-catalog refresh, telemetry, update check) have
# nothing to reach in the default `--network none` box, and are calls nobody asked for
# in an --online one. Off by default, both ways.
env_offline   = "PI_OFFLINE=1"
env_telemetry = "PI_TELEMETRY=0"

# Appended to the agent's argv when the caller passes no model of their own.
# `local` is the provider id models.json.tmpl declares — it names the box's one
# endpoint, not the server behind it, so swapping one OpenAI-compatible server for
# another changes the overlay's base URL and nothing here.
model_args = "--provider local --model {model_id}"

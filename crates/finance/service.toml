# Reviewed imports, journal projections, and subscriptions.
kind           = "process"
name           = "finance"
command        = ["target/release/finance-server"]
build          = ["cargo", "build", "--locked", "--release", "--bin", "finance-server"]
port           = "8090"
health_path    = "/health"
ready_path     = "/ready"
autostart      = "false"
proxy_api_only = "true"
links_to       = ["trip:plan"]
imports        = ["csv", "hledger-journal"]
exports        = ["hledger-journal", "json"]

# Canonical plaintext journal, snapshots, and finance configuration.
backup_paths       = ["data/finance", "config/finance.json"]
backup_target      = "backup-target"
backup_retain      = "14"
backup_advise_days = "1"
backup_stale_days  = "2"

# Hours since the newest successful price fetch before tools/doctor advises or reports stale.
freshness_advise_hours = "48"
freshness_stale_hours  = "96"

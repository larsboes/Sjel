license = "MIT OR Apache-2.0"
summary = "Rust SHA-256 library the media ingest gate uses to detect exact duplicate files"
why = "SHA-256 for the media ingest gate and index, already a workspace dependency. Exact bytes decide duplicate admission, the digest is stored once and verified on import, and it adopts the hashing implementation rather than an upload service."

[exiftool]
url = "https://exiftool.org/"

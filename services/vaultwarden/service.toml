# Self-hosted Bitwarden-compatible password vault container.
name        = "vaultwarden"
image       = "vaultwarden/server"
tag         = "alpine"
ports       = ["127.0.0.1:8080:80"]
volumes     = ["data/vaultwarden/data:/data", "data/vaultwarden/tls:/tls"]
env_file    = "config/vaultwarden.env"
health_path = "/alive"
autostart   = "true"

# Cold SQLite backup contract (run manually with tools/backup.sh vaultwarden).
backup_paths       = ["data/vaultwarden/data", "data/vaultwarden/tls"]
backup_sqlite      = "data/vaultwarden/data/db.sqlite3"
backup_target      = "backup-target"
backup_retain      = "14"
backup_advise_days = "1"
backup_stale_days  = "7"

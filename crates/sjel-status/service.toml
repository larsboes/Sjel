# Host status, capability lifecycle, and same-origin API gateway.
kind        = "process"
name        = "sjel-status"
command     = ["target/release/sjel-status"]
build       = ["cargo", "build", "--locked", "--release", "--bin", "sjel-status"]
sign        = "dev.sjel.sjel-status"
port        = "8082"
health_path = "/health"
autostart   = "true"
# The storage report it runs reads guarded folders (Photos, Music); one grant covers them.
full_disk_access = "true"

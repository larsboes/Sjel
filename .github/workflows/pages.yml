name: Pages

# Publish the public site from tracked files (tools/build-site): the landing page, one reference
# page per unit and the self-model page. No capability runs here, and the payload gate at the end
# refuses a build that carries anything it should not.

on:
  push:
    branches: [main]
  # Build on a pull request too, and deploy nothing: a broken build fails on the branch. The
  # `deploy` job is gated on the event, so a fork PR cannot reach the Pages environment.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, and never cancel one mid-flight: a cancelled deploy can leave Pages
# serving a half-published state, which is worse than serving the previous page a minute longer.
# Pull-request builds get their own group per branch, so two of them do not serialise behind
# each other and neither queues in front of a real deployment.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build the page
    runs-on: ubuntu-latest

    steps:
      - name: Check out Sjel
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest   # patch first, as in ci.yml — CONTRIBUTING.md#patch-first

      # paths.sh resolves the overlay before anything else runs; with no sjel.local.toml it falls
      # back to sjel.toml's shipped default. Same minimal seed ci.yml uses.
      - name: Minimal overlay for path resolution
        run: |
          mkdir -p "$HOME/.axon-overlay/config"
          cat > "$HOME/.axon-overlay/config/machine.toml" <<'TOML'
          os = "linux"
          container_runtime = "docker"
          capabilities = []
          TOML

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The gate. A stale self.json means the page would describe a tree that no longer exists.
      # Deliberately before the build, so a stale input costs a fast failure rather than a
      # published lie.
      - name: self.json is current
        run: tools/self check

      - name: Assemble the site
        run: tools/build-site

      # build-site runs the gate itself; this makes the refusal a named, visible step.
      - name: Payload hygiene
        run: tools/check-site-payload.sh site

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: deploy to Pages
    needs: build
    # A pull request builds and is gated; it never publishes.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

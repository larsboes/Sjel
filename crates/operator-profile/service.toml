# Canonical operator profile stored in the shared database.
kind           = "process"
name           = "operator-profile"
command        = ["target/release/operator-profile-server"]
build          = ["cargo", "build", "--locked", "--release", "--bin", "operator-profile-server"]
port           = "8099"
health_path    = "/health"
ready_path     = "/ready"
proxy_api_only = "true"

# Device enrollment and revocation for one Sjel deployment.
kind                 = "process"
name                 = "devices"
command              = ["target/release/devices-server"]
build                = ["cargo", "build", "--locked", "--release", "--bin", "devices-server"]
port                 = "8098"
health_path          = "/health"
ready_path           = "/ready"
autostart            = "true"
proxy_api_only       = "true"
backup_target        = "backup-target"
backup_sqlite_online = "data/sjel/sjel.db"

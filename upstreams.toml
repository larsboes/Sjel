# --- agentbox: the sandboxed coding agent (capabilities/agentbox) -----------

[pi-coding-agent]
url = "https://github.com/earendil-works/pi"
verdict = "adopt"
license = "MIT"
why = "the coding agent capabilities/agentbox puts in a container -- a micro-VM until Q75 retired apple/container on 2026-09-02, and the [apple-container] row below carries what that cost. Adopted from the GitHub release TARBALL, not npm: releases ship a self-contained aarch64 ELF, so the image needs no Node and no npm and CONTRIBUTING.md#language-tooling is satisfied rather than excepted -- which the Medium writeup this was built from could not do, because it predates the rename (badlogic/pi-mono -> earendil-works/pi, package @mariozechner/pi-coding-agent -> @earendil-works/pi-coding-agent) and pins an npm install of a package that stopped at 0.73.1 while the project moved to 0.82.x. Upstream's own docs/security.md states pi has no built-in sandbox by design and that isolation must come from the OS or a virtualization boundary -- so this follows the tool's security model instead of bolting one on. See capabilities/agentbox/README.md for the three upstream-sanctioned patterns and why whole-process containment won here. Since Q77 (2026-09-02) `agentbox build` and `agentbox host-install` resolve GitHub's /releases/latest themselves and verify the tarball against THAT release's published SHA256SUMS, so no version or checksum literal exists anywhere for this entry -- and the host shim that refused `pi update` is deleted, because it existed to protect the literal"

[apple-container]
url = "https://github.com/apple/container"
verdict = "reject"
license = "Apache-2.0"
why = "RETIRED 2026-09-02 by Q75 -- <overlay>/config/machine.toml declares container_runtime = \"docker\", capabilities/agentbox invokes docker, and tools/service-runner.sh has no apple-container branch left, so nothing on any machine spawns `container`. It was adopted because agentbox depended on more than `run`, and BOTH halves of that dependency went with it. 'Each container is its own VM' became 'every container shares one Linux VM (OrbStack), separated from each other by namespaces and from macOS by that VM' -- weaker, and capabilities/agentbox/README.md now says the weaker thing where it used to say the stronger one. And `container network create --internal` gave a host-only network whose GATEWAY WAS THE MAC, which is what let a no-egress box still reach the model server; docker's `--internal` network reaches neither, and no docker flag sits between it and a bridge with full internet (measured 2026-09-02, docker 29.4.0 / OrbStack 2.2.3 -- the table is in that README). agentbox therefore ships two modes, `--network none` and the default bridge, and the closed one has no model. Retired for one runtime on this machine rather than two, on a machine where no enabled capability was kind = \"container\" at all. Not a clean exit: 1.3.1 (2026-08-29) shipped fixes for six Containerization advisories the installed 1.2.2 does not have, including path traversal in the local content store (GHSA-f689-h8m7-3jp2) and out-of-bundle file deletion via an unchecked id (GHSA-x7pf-2jmj-pgcq) -- so the machine was running an exposed version, and uninstalling is what closes it rather than upgrading. Re-adopting means a new audit at that date, not restoring this row"

[debian]
url = "https://github.com/debuerreotype/docker-debian-artifacts"
verdict = "adopt"
license = "various (Debian main; base image is DFSG-free)"
why = "base image for the agentbox image, on the rolling `trixie-slim` tag since Q77 (2026-09-02) rather than a dated one, so a rebuild takes Debian's current stable slim image and the base layer's CVE fixes with it. Debian rather than Alpine because the pi release binary is a dynamically-linked glibc ELF (`ELF 64-bit LSB executable, ARM aarch64, interpreter /lib/ld-linux-aarch64.so.1`) -- musl is not an option here. trixie (glibc 2.41) over bookworm because the binary is built on a newer toolchain than bookworm ships"

[deutsche-bahn-data]
url = "https://github.com/piebro/deutsche-bahn-data"
verdict = "adopt"
license = "CC-BY-4.0 (data, licensed by Deutsche Bahn; attribution required)"
why = "historical German rail punctuality, the empirical baseline capabilities/punctuality is built on. Collected 4x/day from DB's own Station Data + Timetables APIs and republished monthly as parquet, so it is DB's data under DB's licence rather than a scrape. Chosen over calling the Timetables API directly because that answers 'what is delayed right now' and cannot be asked about last March -- history is the whole point here. Two properties the README states and the ingest must respect: coverage changes on 2025-11-02 (before it, only the ~100 largest stations; after, all ~5300), so mixing the two eras makes station coverage a confounder; and collection is 98.92% complete with 196 named missing hours, so an absent train never means 'did not run'. The upstream schema changed in 2026-05 (train_name split into train_number + line_number) and again in 2026-08 (is_canceled became arrival_is_canceled/departure_is_canceled); the reader accepts both cancellation shapes. The ingest records each month's Hugging Face blob identity and merges only new months, rebuilding when a published month changes. capabilities/punctuality/src/dataset.rs lists every published `data-YYYY-MM.parquet` and takes the range from `FIRST_FULL_COVERAGE_MONTH` (2025-12, the first month after upstream widened collection) onwards. A published month is normally immutable, but the blob identity is retained because the 2026-05 reprocess proved that filenames alone are not a sufficient freshness signal"

[arrow-rs]
url = "https://github.com/apache/arrow-rs"
verdict = "adopt"
license = "Apache-2.0"
why = "the parquet reader capabilities/punctuality ingests with. Pure Rust, so it resolves through a normal crate.from_cargo block; the obvious alternative (DuckDB via duckdb-rs) would have pulled a bundled C++ embedded database into the dependency tree to run one GROUP BY, and its own CLI would have put the aggregation in SQL outside the type system. DuckDB stays a fine ad-hoc exploration tool, it is just not a dependency Sjel has to carry. See capabilities/punctuality/README.md"

[xberg]
url = "https://github.com/xberg-io/xberg"
verdict = "adopt"
license = "MIT"
why = "the document extraction layer capabilities/comms is meant to sit on (#77), audited 2026-07-31 and adopted in direction only -- the Cargo dependency is deliberately absent until cooldown clears. Benchmarked out-of-tree against the 15 stored article URLs with the same fetched bytes going to both sides: xberg returns more text than the built-in tag stripper on all 15, and rescues the cases the strip returns nothing usable for (a client-rendered arXiv HTML page 0 -> 129k chars, a GitHub tree view 15 -> 12k, blog.rust-lang.org 75 -> 40k). It is an extractor and NOT a readability cleaner, exactly as #77 suspected: the short-line share of its output runs 0.03-1.00 with a median near 0.36, so navigation and share widgets survive. That is acceptable here only because #86 landed first -- extraction produces raw, capabilities/comms/src/normalize.rs produces clean -- and the benchmark is what proved that split is required rather than merely tidy. Three findings shaped the adoption: 1.0.0's `pdf` feature did not resolve at all (its pdf_oxide 0.3.76 wanted fax ^0.3 while crates.io topped out at 0.2.7), which is why 1.0.5 was the first usable release; the crate is pure Rust as claimed, with no tesseract/openssl-sys/candle in the tree, although the Homebrew formula pulls tesseract and installs an EMPTY keg (two 0-byte files, no binary), so the CLI is not a usable install path; and the surface is large at 320 unique crates with html+pdf enabled versus 158 on default features. Its MSRV 1.91 sits under Cargo.toml's own rust-version floor, so the toolchain is clear. Six releases in five days plus a yanked 5.0.0-rc.32 predating 1.0.0 is why this row held a version until Q77 (2026-09-02); Cargo.toml now carries the requirement and Dependabot moves it daily, so a bad release from that cadence reaches the build within a day. CONSUMED 2026-08-04 for `pdf` only, behind the Extractor trait; HTML stays on the built-in extractor. That trait moved 2026-09-02 (PRD Q63 -> B30): the Cargo dependency now sits in libs/extraction, behind that crate's `xberg` feature, and capabilities/comms enables it. The feature exists because capabilities/transit consumes the same crate and must NOT link this one -- it drives the CLI as a subprocess precisely to keep the 320-crate surface measured above out of its build, so it takes libs/extraction with `default-features = false`. Measured on adoption against real arXiv papers rather than the synthetic fixture: 2608.02599 (2026, two-column) extracts correct text in the wrong reading order, columns interleaved line by line; 0704.0001 (2007, Type1 fonts) drops every `c` -- 'Abstrat', 'Mihigan', 'quantum hromo dynamis' -- at 11.7s against 0.3s for the same paper as HTML. So this is the last rung before storing an abstract, never a replacement for arxiv.org/html or ar5iv, and `producer` is stored per item so a scrambled body is distinguishable from a clean one downstream."

[ar5iv]
url = "https://ar5iv.labs.arxiv.org"
verdict = "adopt"
license = "renders arXiv submissions; each paper keeps the licence its authors chose, exactly as on arxiv.org"
why = "second HTML source for arXiv full text in capabilities/comms (#78), consulted only when arxiv.org/html answers 404. Measured 2026-08-04 across the 24 newest cs.AI/cs.LG/cs.CL papers: arxiv.org served HTML for 21, and ar5iv answered all three misses plus a 2007 paper, with real body text rather than a conversion stub. It is the older LaTeXML pipeline with much wider backfill, which is the shape of the gap. Adopted as a fetch target only: the response goes through the same extraction trait every other page does, so no provider markup or script is ever evaluated, and a failure costs an abstract rather than an error. It is a labs-grade host, which is why it is the fallback and never the first request. Together with arxiv.org it reduces the case for a PDF reader to papers with no LaTeX source at all -- scans and PDF-only submissions -- which is what xberg's pdf feature is for once its cooldown clears"


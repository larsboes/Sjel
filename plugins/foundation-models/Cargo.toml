[package]
name = "tauri-plugin-foundation-models"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
license = "AGPL-3.0-only"
links = "tauri-plugin-foundation-models"
description = "Optional on-device Apple Foundation Models backend for the Sjel iOS app."
publish = false

[lib]
name = "tauri_plugin_foundation_models"
crate-type = ["rlib", "cdylib", "staticlib"]

[build-dependencies]
tauri-plugin = { version = "2.6.3", features = ["build"] }

[dependencies]
tauri = { version = "2.11.3" }

[package]
name = "axon-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "What is filling this disk and what is safe to reclaim: the overlay's storage policy, the Cargo target dir against PRD 9's R6 ratio, and a repo-scoped prune."
publish = false

# axon-storage, not storage: tools/storage/storage is the launcher that execs this, and
# two things called `storage` on PATH is the collision the prefix avoids. Same reasoning
# as capabilities/host-net's host-net-cli.
[[bin]]
name = "axon-storage"
path = "src/main.rs"

[dependencies]
# The overlay's location, read from SJEL_PERSONAL_ROOT exactly as capabilities/host-net
# reads its own policy. Zero external dependencies of its own
# (libs/axon-config/Cargo.toml), so this stays a four-crate build.
axon-config = { path = "../../libs/axon-config" }

# --json, the policy file, and target/.rustc_info.json. All three were already resolved in
# the workspace lock before this crate existed (serde 1.0.229, serde_json 1.0.151, toml
# 0.8.23 via capabilities/host-net and capabilities/interior), so adding this tool resolves
# no new external crate.
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
toml.workspace = true

# No walkdir and no glob crate. The directory walk is one function over std::fs::read_dir
# with an inode set, and the policy's glob contract is a single `*` in one path segment.
# Both are smaller than the argument for adding a dependency to carry them.
#
# No clap, for the reason capabilities/host-net/Cargo.toml already states: four verbs and
# six flags is a match statement, and the workspace has no clap today.

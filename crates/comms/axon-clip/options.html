<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sjel Clip Options</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="options-page">
  <div class="header">
    <div class="title-group">
      <img src="icons/icon-48.png" alt="Sjel Clip">
      <h1>Sjel Clip Settings</h1>
    </div>
  </div>

  <form id="options-form">
    <div class="form-group">
      <label for="server-url">Comms Server Base URL</label>
      <input type="text" id="server-url" placeholder="http://127.0.0.1:8083" required>
      <div class="help-text">Base URL of your running comms-server (default: http://127.0.0.1:8083)</div>
    </div>

    <div class="form-group">
      <label for="api-secret">API Shared Secret</label>
      <input type="password" id="api-secret" placeholder="Enter bearer secret...">
      <div class="help-text">Matches the shared secret in your comms config (api_secret_file). Required for write access.</div>
    </div>

    <div class="form-group">
      <button type="submit" class="btn btn-primary" id="save-btn">Save Settings</button>
    </div>

    <div id="status" class="status-bar"></div>
  </form>

  <script src="options.js"></script>
</body>
</html>

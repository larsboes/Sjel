# Genau das ist der Punkt. Bis 2026-08-31 war das die ganze Antwort dieser Capability, und sie
# war falsch — nicht in der Rechnung, sondern in der Frage. `einbringung` stellt die zweite:
# kommt das Stueck ueberhaupt dorthin.

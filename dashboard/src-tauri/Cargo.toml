[workspace]

[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.0", features = [] }
tauri-plugin-log = "2"
tauri-plugin-roomplan = { path = "../../plugins/roomplan" }
tauri-plugin-device-identity = { path = "../../plugins/device-identity" }
tauri-plugin-foundation-models = { path = "../../plugins/foundation-models" }
tauri-plugin-local-network = { path = "../../plugins/local-network" }
# The native bridge to the Mac (src/mac_bridge.rs). Same requirement as the
# root workspace's `[workspace.dependencies]` reqwest; this crate is its own
# workspace, so it cannot inherit it. Default features bring rustls, which the
# https call to `<name>.ts.net` needs.
reqwest = "0.13"
getrandom = "0.3"
sha2 = "0.10"
# The phone's pinned-certificate client for the node's local-network listener (src/mac_bridge.rs,
# PinnedCertificate; PRD Q119). Already in the tree through reqwest; declared to name its types.
rustls = "0.23"
# The phone's local store (src/sync.rs): snapshot and outbox, PRD §10 A5 and the
# "Library research" table's A4 row. Same requirement as the root workspace's
# `[workspace.dependencies]` rusqlite; bundled, so iOS links its own SQLite.
rusqlite = { version = "0.40", features = ["bundled"] }
# Local notifications for a new Sparpreis low (PRD Q115 follow-up, 2026-09-25). Local
# only: no APNs, no push key. Pinned exactly, per upstreams.toml [tauri-plugin-notification].
tauri-plugin-notification = "=2.4.0"

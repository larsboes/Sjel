[package]
name = "sjel-gpui-ios"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-only"
description = "The iOS GPUI app: GPUI content inside a UIKit host (host/)"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
sjel-gpui-core.workspace = true
sjel-gpui-ui.workspace = true
gpui-kit.workspace = true
device-auth = { path = "../../../crates/device-auth" }
# `SJEL_DAY` names the calendar day a screenshot opens on (src/lib.rs, `launch_day`).
chrono.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["time"] }

[target.'cfg(target_os = "ios")'.dependencies]
# Fork at the gpui-pre snapshot gpui-kit pins (upstreams.toml, gpui-mobile). camera and video_player: the crate uses both modules without their feature gates.
gpui-mobile = { package = "gpui-pre-mobile", git = "https://github.com/larsboes/gpui-mobile", rev = "bbedd2d", default-features = false, features = ["camera", "video_player"] }

[lints]
workspace = true

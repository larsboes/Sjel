# projects: projects, tasks and project notes. The shared store is canonical; every write
# re-renders the record as markdown under <overlay>/data/projects/ (ISA.md F12, ISC-68).
# 8103: the live registry served 8082-8102 when this was written.
kind           = "process"
name           = "projects"
command        = ["target/release/projects-server"]
build          = ["cargo", "build", "--locked", "--release", "--bin", "projects-server"]
port           = "8103"
health_path    = "/health"
ready_path     = "/ready"
proxy_api_only = "true"
backup_paths   = ["data/projects"]

# Household inventory, state history, wish list, and link intake.
kind           = "process"
name           = "inventory"
command        = ["target/release/inventory", "serve"]
build          = ["cargo", "build", "--locked", "--release", "--bin", "inventory"]
port           = "8101"
health_path    = "/health"
autostart      = "true"
proxy_api_only = "true"

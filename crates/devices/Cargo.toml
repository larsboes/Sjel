[package]
name = "sjel-devices"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Sjel device registry: one-time pairing challenges, device public keys and revocation."
publish = false

[[bin]]
name = "devices-server"
path = "src/server.rs"

# The lib keeps its bare name: the package is `sjel-devices` (no registry collision), but the
# binary and every `devices::` path stay as they were.
[lib]
name = "devices"
path = "src/lib.rs"

[dependencies]
sjel-config = { path = "../sjel-config" }
sjel-server = { path = "../sjel-server" }
sjel-store = { path = "../sjel-store" }
route-manifest = { path = "../route-manifest" }
device-auth = { path = "../device-auth" }
axum.workspace = true
getrandom.workspace = true
rusqlite.workspace = true
schemars = "1.2.2"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
ring = "0.17"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true

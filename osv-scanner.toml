# Temporary informational-advisory exceptions. Both carry an expiry; known vulnerabilities
# remain blocking regardless. osv-scanner enforces these dates itself, and names an entry it
# no longer honours under `unused ignores` — which is why Sjel stopped carrying a clock of its
# own on 2026-09-02 (Q74).
#
# THIS FILE IS THE REPOSITORY SCAN'S, and CI reads it. That is why the rule above holds here
# unchanged: `tools/audit`'s second pass — over software installed outside this checkout, where
# a fix is often unreachable — has its own file, `osv-scanner-installed.toml`, which accepts
# KNOWN vulnerabilities with their reach and an end date. Widening this file to cover those
# would have widened CI too (decided 2026-10-04).
#
# Neither replacement is tracked in an issue. retired-tracker#182 used to hold both, and what
# it actually said was "review upstream-supported migration paths" with no consumer, no
# deadline of its own, and nothing to do until an ecosystem moved. The exposure, the reason
# it is accepted, and the date it stops being accepted all belong here, next to the entry
# they describe.
# SvelteKit, measured 2026-10-24. Both apps that depend on it are `@sveltejs/adapter-static`
# bundles with `fallback: index.html`, and the dashboard states `export const prerender = false`
# in `src/routes/+layout.ts`. Neither ships a server runtime: sjel-status serves the files, and
# soundscape's bundle is served by its capability's own binary. The fix is Kit 3.0.0, a major
# version, and the migration is SCOPED rather than unknown: probing it in a worktree on
# 2026-10-24, the three mechanical steps (kit config into the `sveltekit()` vite plugin,
# `tsconfig.json` extending `$app/tsconfig`, the now-implicit `$lib` alias declared by hand) left
# 27 type errors in 11 files on the dashboard, before soundscape and before the build. So these
# are dated, not dismissed, and the date is the revisit.
[[IgnoredVulns]]
id = "GHSA-27mw-82g8-phjj"
ignoreUntil = 2027-01-01
reason = "SvelteKit before 3.0.0, CVE-2026-114061, CVSS 2.3: a `setHeaders` cache-control value is inserted unescaped into a tag in a PRERENDERED page, so an attacker who can influence that value at prerender time can inject markup. Reach: nothing is prerendered here. `dashboard/src/routes/+layout.ts` sets `prerender = false`, both apps use adapter-static with an SPA fallback, and no route enumerates at build time -- there is no prerender pass for the value to land in. Ends when both apps run @sveltejs/kit >= 3.0.0."

[[IgnoredVulns]]
id = "GHSA-pfhg-q3qv-9q6r"
ignoreUntil = 2027-01-01
reason = "SvelteKit before 3.0.0, CVSS 4.7: URL redirection to an untrusted site through a server-side self-fetch fallback. Reach: needs a Kit server runtime to follow a redirect, and neither app has one -- adapter-static emits files, sjel-status hands them out, and the soundscape bundle is served by its capability. The dev server does run Kit's SSR path, so this is bounded to a development session on loopback. Ends when both apps run @sveltejs/kit >= 3.0.0."


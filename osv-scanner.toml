# dashboard/src-tauri}/Cargo.toml -i <crate> --target aarch64-apple-darwin` prints "nothing to
# print", and so does the same probe with `--target aarch64-apple-ios` (all twelve measured
# 2026-10-18). The lockfiles still list all three, which is what osv-scanner reads. They are
# informational — no CVSS, no affected function — and no fixed version exists, because RUSTSEC
# retired each crate as a standalone and folded it into zbus 6.0.0. The end of these is a zbus 6
# major bump on the Linux side, which is upstream's and not a patch here.
[[IgnoredVulns]]

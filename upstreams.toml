# --- document recognition, the Q63 extraction ladder ------------------------

[docling]
url = "https://github.com/docling-project/docling"
verdict = "reject"
license = "MIT"
why = "MEASURED and rejected 2026-08-31 as the recognition engine for the extraction ladder (PRD Q63, work sized as B30), on 1,281 real attachments from the Notability migration rather than on a fixture. Started by IBM Research Zurich, now hosted by the LF AI & Data Foundation. The reason to want it is the one thing Apple Vision cannot do -- read mathematical notation -- and on the same page it delivered where Vision returned nothing usable. THE YIELD IS WHAT KILLS IT. Formula enrichment emitted LaTeX on 58 of 1,065 sidecars, 5.4%, while Vision returned MORE text on 550 of 1,027 pairs, at ~24 s per file behind a 1.1 GB PyTorch environment needing its own interpreter (3.12; this host's 3.14 is too new for PyTorch). READ THE 5.4% PRECISELY: it bounds what Docling PRODUCED, not what the pages CONTAIN, because a formula it failed to read is indistinguishable here from a page carrying none, and the 216 attachments it had not yet reached sit outside the denominator. Two configuration findings are worth more than the verdict, because a re-attempt would otherwise rediscover them at the same price: do_table_structure plus an explicit ocr_options.lang cost ~10 MINUTES per image, and formula enrichment at 1600 px produced output identical to full resolution in half the time, so any future run downscales before converting. Its RapidOCR backend logged an empty text-detection result continuously on this corpus. Rejected as a DEPENDENCY and not as an idea: Q63 puts the heavy rung behind an `ocr` role in libs/inference, where a model of this kind is a config entry rather than 1.1 GB inside the tree."

[dolphin]
url = "https://github.com/bytedance/Dolphin"
verdict = "inspiration"
license = "MIT"
why = "candidate for the heavy rung of the Q63 ladder, held as DIRECTION ONLY and not measured here. ByteDance, ACL 2025, paper at arxiv.org/abs/2505.14059. Read from its own repository 2026-08-31: a vision-encoder-decoder -- Swin encoder, MBart decoder -- that analyses page layout first and then parses the located elements in parallel under task-specific prompts, with formulas named as a first-class element type. The reason it is listed where Docling is rejected: ONE model running two stages, against Docling's stack of separate layout, OCR and formula models, which is what produced the ~24 s/file that decided that entry. The original release is 0.3B; Dolphin-v2 is 3B and adds document-type awareness. PyTorch, with vLLM and TensorRT-LLM acceleration paths documented -- so this is a candidate for the `ocr` ROLE in libs/inference and never a Cargo dependency. TWO THINGS ARE UNVERIFIED AND BOTH DECIDE IT: the project claims handwriting nowhere in its own material, and no German measurement exists on this machine. B30 gates it on a frozen DE/EN corpus the way multilingual-e5-base-mlx and bge-reranker-v2-m3-mlx were gated. No engine enters this ladder on a README's claim. THAT CORPUS NOW EXISTS: libs/extraction/eval/, with Apple Vision's baseline recorded at 100.0% prose and 58.8% notation (2026-09-02). Only the NOTATION verdict line earns the `ocr` role in libs/inference; a prose pass earns nothing here, because rung 2 already does prose for free and with no model bytes. Handwriting remains unmeasured on both sides -- every fixture in that corpus is printed."

[ocrs]
url = "https://github.com/robertknight/ocrs"
verdict = "inspiration"
license = "Apache-2.0 OR MIT"
why = "the only genuinely pure-Rust OCR engine found for the Q63 ladder, held as direction only. Read from its own repository 2026-08-31: models are trained in PyTorch, exported to ONNX and executed by the author's RTen runtime, so no Python survives into a consuming binary -- which is the property that earned it an entry at all. TWO STATED LIMITS decide against it today, both from the project's own README rather than from a benchmark here: it supports the LATIN ALPHABET ONLY with more languages 'planned', and it describes itself as an EARLY PREVIEW. Latin covers German, so the language limit is not the blocker; the preview status is, measured against an alternative that costs zero model bytes and is already characterised in the [auge] entry as perfect on German with no language pack. Neither handwriting nor mathematical notation is mentioned by the project. THE CASE THAT WOULD REVIVE IT IS SPECIFIC: Apple Vision is macOS-only, so on the Linux runtime it does not exist, and this becomes the only local rung-2 candidate rather than the second-best one. THE GATE IT WOULD HAVE TO CLEAR NOW EXISTS AND IS RUNNABLE: libs/extraction/eval/, frozen DE/EN pages, fixed acceptance, two verdict lines reported apart. Apple Vision's baseline there is 100.0% prose and 58.8% notation (2026-09-02), so on macOS this entry stays superseded on prose; on Linux it would be measured against an empty rung rather than against that number."


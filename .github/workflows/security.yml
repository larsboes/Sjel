name: Security

# Dependency findings fail; image findings report without blocking merges.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  plan:
    name: select security scans
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      deps: ${{ steps.plan.outputs.deps }}
      images: ${{ steps.plan.outputs.images }}
    steps:
      - name: Check out Sjel
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Plan and summarize
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun tools/ci-plan.ts --workflow security.yml --output "$RUNNER_TEMP/security-plan.json" --github-output "$GITHUB_OUTPUT"

  deps:
    name: osv-scanner (every lockfile)
    needs: plan
    if: needs.plan.outputs.deps == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Sjel
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install osv-scanner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          gh release download --repo google/osv-scanner \
            --pattern 'osv-scanner_linux_amd64' --output "$RUNNER_TEMP/bin/osv-scanner"
          chmod +x "$RUNNER_TEMP/bin/osv-scanner"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/osv-scanner" --version
      - name: Scan
        run: |
          set -uo pipefail
          osv-scanner scan source -r --config osv-scanner.toml \
            --experimental-exclude target \
            --experimental-exclude node_modules \
            --experimental-exclude to-integrate .

  images:
    name: grype (every declared image)
    needs: plan
    if: needs.plan.outputs.images == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Sjel
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install grype
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          gh release download --repo anchore/grype \
            --pattern 'grype_*_linux_amd64.tar.gz' --output "$RUNNER_TEMP/grype.tgz"
          tar xzf "$RUNNER_TEMP/grype.tgz" -C "$RUNNER_TEMP/bin" grype
          chmod +x "$RUNNER_TEMP/bin/grype"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/grype" version
      - name: Scan
        # Findings and scanner outages are report-only; discovery failure is fatal below.
        continue-on-error: true
        run: |
          set -uo pipefail
          rc=0
          : > "$RUNNER_TEMP/scanned.txt"
          {
            echo "## Image CVE scan"
            echo
            echo "Report-only: these counts never hold a merge (Q77). The tag is a channel, so"
            echo "what was scanned is whatever the registry serves for it right now."
            echo
            echo "| Image | Critical | High | Result |"
            echo "|---|---:|---:|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for m in crates/*/service.toml services/*/service.toml capabilities/*/service.toml; do
            [ -f "$m" ] || continue
            image=$(sed -n 's/^image *= *"\([^"]*\)".*/\1/p' "$m" | head -1)
            [ -n "$image" ] || continue
            tag=$(sed -n 's/^tag *= *"\([^"]*\)".*/\1/p' "$m" | head -1)
            ref="$image:${tag:-latest}"
            # Record discovery before scanning so an outage is not a zero-image failure.
            printf '%s\n' "$ref" >> "$RUNNER_TEMP/scanned.txt"
            echo "::group::$ref"
            grc=0
            grype "registry:$ref" --fail-on high -o json > "$RUNNER_TEMP/grype.json" 2> "$RUNNER_TEMP/grype.err" || grc=$?
            # Exit 2 means findings; other failures are not a clean image verdict.
            case "$grc" in
              0|2)
                crit=$(jq '[.matches[] | select(.vulnerability.severity == "Critical")] | length' "$RUNNER_TEMP/grype.json" 2>/dev/null || echo '?')
                high=$(jq '[.matches[] | select(.vulnerability.severity == "High")] | length' "$RUNNER_TEMP/grype.json" 2>/dev/null || echo '?')
                if [ "$grc" -eq 0 ]; then
                  verdict="clean at or above high"
                else
                  verdict="findings at or above high"
                  rc=1
                fi
                jq -r '.matches[] | select(.vulnerability.severity == "Critical" or .vulnerability.severity == "High")
                       | "\(.vulnerability.severity)\t\(.vulnerability.id)\t\(.artifact.name) \(.artifact.version)"' \
                  "$RUNNER_TEMP/grype.json" | sort -u
                ;;
              *)
                crit="?"; high="?"
                verdict="COULD NOT SCAN (grype exit $grc)"
                rc=1
                cat "$RUNNER_TEMP/grype.err" >&2
                ;;
            esac
            printf '| `%s` | %s | %s | %s |\n' "$ref" "$crit" "$high" "$verdict" >> "$GITHUB_STEP_SUMMARY"
            echo "::endgroup::"
          done
          exit "$rc"
      - name: The scan covered something
        # Never report a successful job when discovery matched no image.
        run: |
          set -euo pipefail
          if [ ! -s "$RUNNER_TEMP/scanned.txt" ]; then
            echo "no capability declares an image, or the scan step died before finding one" >&2
            {
              echo ""
              echo "**No image was scanned — this run covered nothing.**"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "scanned $(wc -l < "$RUNNER_TEMP/scanned.txt" | tr -d ' ') image(s):"
          cat "$RUNNER_TEMP/scanned.txt"

[package]
name = "sjel-gpui-ios"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-only"
description = "The iOS GPUI app: GPUI content inside a UIKit host (host/)"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
sjel-gpui-core.workspace = true
# Screens drawn by NSH with UIKit views next to GPUI (docs/plans/gpui.md §11).
sjel-gpui-ui = { workspace = true, features = ["nsh"] }
gpui-kit.workspace = true
device-auth = { path = "../../../crates/device-auth" }
# `SJEL_DAY` names the calendar day a screenshot opens on (src/lib.rs, `launch_day`).
chrono.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["time"] }

[target.'cfg(target_os = "ios")'.dependencies]
# Fork at the gpui-pre snapshot gpui-kit pins (upstreams.toml, gpui-mobile). camera and video_player: the crate uses both modules without their feature gates.
gpui-mobile = { package = "gpui-pre-mobile", git = "https://github.com/larsboes/gpui-mobile", rev = "98f6466", default-features = false, features = ["camera", "video_player"] }

[target.'cfg(target_os = "ios")'.dependencies.nsh-platform-ios]
git = "https://github.com/longbridge/nsh"
rev = "1894697155"
default-features = false

[target.'cfg(target_os = "ios")'.dependencies.objc2]
version = "0.6.5"

[target.'cfg(target_os = "ios")'.dependencies.objc2-ui-kit]
version = "0.3.2"
default-features = false
features = ["UIView", "UIResponder", "objc2-core-foundation"]

[dependencies.nsh-base]
git = "https://github.com/longbridge/nsh"
rev = "1894697155"

[lints]
workspace = true

# Every external project Sjel touches: one row per dependency or influence, with its verdict.
# verdict = "adopt" | "contribute" | "overlay" | "fork" | "build" | "inspiration" | "quarry" | "reject" | "watch" | "evaluate" | "adapt"
#
#   verdict  Preference order is adopt > contribute > overlay > fork, and fork is a PR vehicle only.
#            watch and evaluate grant nothing and carry the condition that ends them.
#   url      where it comes from.
#   license  what it is licensed under.
#   summary  what the project is and what Sjel does with it, under 110 characters.
#   why      the verdict's reason, one or two sentences; longer analysis lives in research/.
#   revisit  the condition that reopens a watch or evaluate row.
#
# No row records a version: every dependency tracks its upstream release. A measurement belongs in
# `why` with the date it was taken, and a dependency verdict lives here and nowhere else.

[semver]
url = "https://github.com/dtolnay/semver"
verdict = "adopt"
license = "MIT OR Apache-2.0"
summary = "Cargo version requirement parsing for the read-only maintenance report"
why = "Already in the lockfile. Reuse Cargo-compatible version matching instead of implementing requirement syntax; JavaScript updates remain Bun's responsibility."

[cargo-deny]
url = "https://github.com/EmbarkStudios/cargo-deny"
verdict = "adopt"
license = "MIT OR Apache-2.0"
summary = "Optional license inventory in the maintenance report"
why = "Reuse the installed tool for current-host license evidence. This adds no automatic license allowlist and no duplicate advisory queue; OSV remains the vulnerability owner."

[cargo-machete]
url = "https://github.com/bnjbvr/cargo-machete"
verdict = "adopt"
license = "MIT"
summary = "Read-only unused Rust dependency detection for maintenance"
why = "Optional read-only maintenance analyzer, without --fix or --with-metadata. Its source-checked trial used two patched transitive lock entries; reported candidates were inspected on 2026-11-08, 28 declarations removed and isolated checks run. Missing installation reports incomplete coverage."

[cisco-skill-scanner]
url = "https://github.com/cisco-ai-defense/skill-scanner"
verdict = "watch"
license = "Apache-2.0"
summary = "Local skill detection candidate compared against Sjel intake fixtures"
why = "The 2026-11-08 pinned local-only trial held one of six malicious smoke cases, while Sjel's existing rules held all six; both passed four benign cases. Do not add it as a routine gate or replace intake; evidence and a reproducible network-disabled trial live in research/benchmarks/skill-intake."
revisit = "A local semantic-review configuration passes the existing admission cases and a separate corpus without increasing review burden; the dependency preflight must also pass."

[python-eval-image]
url = "https://github.com/docker-library/python"
verdict = "adopt"
license = "MIT (image recipes); various (bundled Python and Debian components)"
summary = "Official Python base for bounded public-fixture evaluation containers"
why = "The agent evaluator uses an existing image resolved to its immutable ID, without host mounts or networking. The skill-scanner trial builds reviewed source into a separate image, mounts only synthetic leaf fixtures read-only, and runs without network, host configuration or credentials."

[meta-harness]
url = "https://github.com/stanford-iris-lab/meta-harness"
verdict = "inspiration"
license = "MIT"
summary = "Harness-code optimization from recorded experiments; informs Sjel's proposed evaluation loop"
why = "Planning influence for the evaluation loop: retain candidate code, execution traces and scores for selective diagnosis, hold the base model fixed across harness comparisons, and keep final testing apart from candidate generation. Its own coding experiment searched and evaluated on the same tasks, so that result is not held-out evidence."

[schema-harness]
url = "https://github.com/guanning03/Schema"
verdict = "inspiration"
license = "MIT"
summary = "Executable hypotheses with history checks and verified execution; informs Sjel's task-loop proposal"
why = "Planning influence for the task loop: separate observations from editable hypotheses, test executable predictions against recorded experience, and interrupt a plan when a result contradicts its prediction. Its published evaluations are ARC-AGI-3, DiG-bench and MazeBench; transfer to research or writing is unproven."

[lifeos]
url = "https://github.com/danielmiessler/LifeOS"
verdict = "inspiration"
license = "MIT"
summary = "Personal-AI harness Sjel once extended through a synced overlay; retired after it was uninstalled"
why = "The harness Sjel extended through a reviewed delta in capabilities/lifeos/overlay/ rather than by forking; the harness was uninstalled on 2026-08-22 and the delta and sync tooling were deleted with it (PRD D6, 2026-08-25). What survived is the shape -- public core plus one private overlay -- and the skills adapted from it: council, red-team, root-cause, suggest-skills and trim, rewritten here with no re-sync path."

[unicode-normalization]
url = "https://github.com/unicode-rs/unicode-normalization"
verdict = "adopt"
license = "MIT OR Apache-2.0"
summary = "Unicode normalization for vault link resolution"
why = "Implements Unicode normalization with generated tables, and vault uses only the safe NFC iterator. Normalized path collisions are treated as ambiguous rather than resolved."

[rust-analyzer]
url = "https://github.com/rust-lang/rust-analyzer"
verdict = "inspiration"
license = "MIT OR Apache-2.0"
summary = "Language server whose architecture guide informs Sjel's entry-point and invariant documentation"
why = "Its architecture guide separates a high-level model from entry points, a code map and explicit invariants, which is the shape website/content/architecture/ uses beside the generated manifest inventory. Documentation structure only; no source or prose copied, no runtime dependency."

[tigerbeetle]
url = "https://github.com/tigerbeetle/tigerbeetle"
verdict = "inspiration"
license = "Apache-2.0"
summary = "Transactions database whose task-oriented documentation informs Sjel's technical reading paths"
why = "Its documentation separates Start, Concepts, Coding, Operating and Reference by reader task, which Sjel applies to the existing architecture, capability-author and operations routes rather than by adding five parallel document trees. Documentation structure only; no source copied, no database dependency."

[iai-personal-memory-engine]
url = "https://github.com/CodeAbra/iai-personal-memory-engine"
verdict = "inspiration"
license = "MIT"
summary = "Memory engine whose patterns define Sjel's memory contract; held as a swap candidate"
why = "Held as a swap candidate because its patterns -- engine versus always-readable store, fail-safe hooks, doctor, encryption at rest -- are what the memory contract is written from. It conflicts with LifeOS memory, which no longer runs here."

[mcp-audit]
url = "https://github.com/apisec-inc/mcp-audit"
verdict = "adopt"
license = "MIT"
summary = "Automated audit layer for secrets, config and source scans with SARIF output; Sjel adapts it"
why = "Automated audit layer: secret and config inventory, a prompt-in-shell-out source scan, SARIF output and failing exit codes. Adapted rather than rebuilt."

[local-llm]
url = "https://github.com/jamesob/local-llm"
verdict = "inspiration"
license = "n/a (docs)"
summary = "Local inference guide used as the style bar for capability READMEs and a source of operations ideas"
why = "The style bar for capability READMEs and an operations quarry for local inference: budget framing, mirrored model storage, read-only weight mounts, separated inference and agent sandboxes, power limiting and measured interconnect tuning. Its 2x3090 route is a CUDA lab, not this deployment's low-energy target."

[hledger]
url = "https://github.com/simonmichael/hledger"
verdict = "reject"
license = "GPL-3.0-or-later"
summary = "Plaintext double-entry accounting engine; Sjel keeps its journal format but no longer runs the tool"
why = "Runtime dependency retired 2026-08-28 (PRD Q50): capabilities/finance/src/journal.rs is the engine now and no code path spawns the executable. The format is not retired -- the canonical journal is still plaintext hledger syntax, schemas/finance-journal.example is still the published contract, and re-adopting the binary means a new audit at that date."

[paperless-ngx]
url = "https://github.com/paperless-ngx/paperless-ngx"
verdict = "inspiration"
license = "GPL-3.0"
summary = "Document management system with OCR and search; leading candidate for a future documents capability"
why = "Leading candidate for a future documents capability: watched-folder and scanner ingestion, OCR, full-text search, metadata workflows, permissions and an exporter-based restore path. Not adopted -- documents are stored in clear text, containers are the only supported route, and its exporter produces an exact database image, so adopting it on a rolling tag would be adopting it without a restore."

# --- document recognition, the Q63 extraction ladder ------------------------

[docling]
url = "https://github.com/docling-project/docling"
verdict = "reject"
license = "MIT"
summary = "Document parser that reads math notation; rejected because its yield was low and it ran too slowly"
why = "Measured and rejected 2026-08-31 on 1,281 real attachments: formula enrichment emitted LaTeX on 5.4% of sidecars at about 24 s per file behind a 1.1 GB PyTorch environment, while Apple Vision returned more text on 550 of 1,027 pairs. Rejected as a dependency and not as an idea -- a model of this kind belongs behind the `ocr` role in libs/inference, where it is a config entry rather than 1.1 GB inside the tree."

[lopdf]
url = "https://github.com/J-F-Liu/lopdf"
verdict = "adopt"
license = "MIT"
summary = "Rust PDF reader and writer used to materialize reviewed page ranges"
why = "Removes every page outside an operator-reviewed range, prunes unreachable objects and writes the selected pages as a standalone child PDF, leaving the parent unchanged and the child a separate content-addressed blob. It infers no boundaries and supplies no OCR; the direct use is limited to reviewed splitting, because xberg already brings it transitively."

[dolphin]
url = "https://github.com/bytedance/Dolphin"
verdict = "inspiration"
license = "MIT"
summary = "Single-model document layout and parsing model; held as a direction for heavy extraction, not measured"
why = "Direction only for the heavy rung of the Q63 ladder, not measured here: one vision-encoder-decoder analyses page layout and then parses the located elements under task-specific prompts, with formulas a first-class type -- against Docling's stack of separate layout, OCR and formula models. PyTorch, so a candidate for the `ocr` role and never a Cargo dependency; handwriting and German are unmeasured, and only a notation verdict on libs/extraction/eval earns it."

[ocrs]
url = "https://github.com/robertknight/ocrs"
verdict = "inspiration"
license = "Apache-2.0 OR MIT"
summary = "Pure-Rust OCR engine held as a direction only; its early-preview status rules it out for now"
why = "The only genuinely pure-Rust OCR engine found for the Q63 ladder -- PyTorch-trained models exported to ONNX and run by the author's RTen runtime, so no Python reaches a consuming binary -- held as direction only because it supports the Latin alphabet alone and describes itself as an early preview. It is the only local rung-2 candidate on Linux, where Apple Vision does not exist, and libs/extraction/eval is the gate it would have to clear."

[awesome-selfhosted]
url = "https://github.com/awesome-selfhosted/awesome-selfhosted"
verdict = "inspiration"
license = "CC-BY-SA-3.0"
summary = "Curated index of self-hosted software that Sjel mines for candidates, not an adoption list"
why = "A curated discovery index mined for candidates rather than an adoption catalogue: each shortlisted service still needs its own primary-source, licence, lifecycle, trust-boundary, backup and ownership verdict."

[colibri]
url = "https://github.com/JustVugg/colibri"
verdict = "inspiration"
license = "Apache-2.0"
summary = "Experimental engine that streams MoE experts from disk; a research lane, not a Sjel runtime"
why = "A research lane rather than a Sjel runtime: it streams routed MoE experts from a large NVMe container while dense weights stay resident, at 0.05-0.1 tok/s on low-end hardware. Model-specific formats make it evidence, not a reason to substitute SSD capacity for model memory."

[exo]
url = "https://github.com/exo-explore/exo"
verdict = "inspiration"
license = "Apache-2.0"
summary = "Distributed inference across Apple Silicon Macs; research evidence for the server plan, not adopted"
why = "Research evidence that a homogeneous Apple Silicon cluster can shard a model across separate memory pools over Thunderbolt RDMA, which corrects an earlier blanket dismissal of multi-Mac model fit. Not adopted runtime: cabling, stability, security and single-node fallback still need a measured verdict."

[mlx]
url = "https://github.com/ml-explore/mlx"
verdict = "inspiration"
license = "MIT"
summary = "Apple's ML framework whose Thunderbolt RDMA transport informs the server plan; no code used"
why = "Primary framework evidence behind exo's Apple Silicon distributed path: MLX distributed and the JACCL backend provide RDMA over Thunderbolt 5 on current macOS. Sjel consumes none of its source; the hardware comparison uses its documented transport capability and constraints."

[llama-cpp-rpc]
url = "https://github.com/ggml-org/llama.cpp"
verdict = "inspiration"
license = "MIT"
summary = "llama.cpp mode that splits a model across machines; treated as a lab benchmark, not production"
why = "A cross-platform comparison path for splitting model weights and KV cache across local Metal and remote CPU or CUDA backends. Upstream calls RPC a fragile, insecure proof of concept, so it is an isolated lab benchmark and not a production endpoint."

[mcpserver-audit]
url = "https://github.com/modelcontextprotocol-security/mcpserver-audit"
verdict = "inspiration"
license = "open methodology"
summary = "MCP server audit method with CWE checks and semgrep rules, used for manual and agent audit passes"
why = "AIVSS methodology, CWE check library and semgrep rulesets for the manual and agentic audit pass."


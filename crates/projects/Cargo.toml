[package]
name = "sjel-projects"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Projects, tasks and project notes in the shared store, rendered to markdown on every write."
publish = false

[lib]
name = "projects"
path = "src/lib.rs"

[[bin]]
name = "projects-server"
path = "src/server.rs"

[[bin]]
name = "projects"
path = "src/cli.rs"

[features]
default = ["libsql"]
libsql = ["dep:sjel-turso"]
turso-wal = ["dep:sjel-native-wal", "dep:turso"]

[dependencies]
axum.workspace = true
chrono.workspace = true
content-item = { path = "../content-item" }
markdown-root = { path = "../markdown-root" }
projects-api = { path = "../projects-api" }
route-manifest = { path = "../route-manifest" }
reqwest.workspace = true
schemars.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sjel-config = { path = "../sjel-config" }
sjel-http = { path = "../sjel-http" }
sjel-links = { path = "../links" }
sjel-server = { path = "../sjel-server" }
sjel-turso = { path = "../sjel-turso", optional = true }
sjel-native-wal = { path = "../sjel-native-wal", optional = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net"] }
turso = { version = "=0.8.4", default-features = false, optional = true }

[dev-dependencies]
# `ServiceExt::oneshot`, so the router test drives the wired handlers with no listener and no
# port. The same pattern crates/transit, sjel-status and operator-profile use.
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true

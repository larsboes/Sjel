# The demo manifest (#168). One file decides what the published demonstration contains.
#
# Axon's public page used to be tables generated from self.json: true, checkable, and
# no help at all to somebody asking what the thing looks like. This manifest drives the
# other half — a real dashboard bundle running on data that was never real.
#
# THE ONE INVARIANT: every value the demo shows was produced by tools/demo-seed writing
# through a capability's own public HTTP API, into a store that started empty. Nothing
# reads an overlay, a vault, a keychain or a live database. A capability that cannot be
# filled that way does not appear here — see `[absent]` at the bottom, which says which
# ones those are and why, because a demo that quietly omits half the system is a worse
# lie than one that shows nothing.
#
# Paths below are written as the BROWSER requests them, not as a capability serves them.
# tools/demo-record resolves each one through `tools/capability.sh registry`, applying the
# same `/<name>` prefix rule dashboard/vite.config.ts proxies by — so a port stays declared
# in exactly one service.toml and this file never learns a number.

[demo]
# Fixed, because a demo that differs between two builds cannot be reviewed by diffing it.
# Every generated name, amount and date descends from this string through tools/lib/demo-data.ts's
# PRNG. Change it and the whole corpus changes at once, which is the intended way to get a
# different-looking demo — not by editing generators.
seed = "axon-demo-v1"

# The demo's "today". Everything dated is generated relative to this, so a page showing
# "next week" keeps meaning it, and a rebuild two months from now produces the identical
# bytes. Deliberately NOT the build date: a fixture set that changes daily would make the
# hygiene diff below unreadable and turn every rebuild into a spurious change.
anchor = "2026-03-16"

# Stamped into the banner and the landing page. A reader who finds this page in a year
# should be able to tell that the dates are staged rather than stale.
label = "Demo data — generated, not real"

# Where tools/demo-origin listens: the synthetic remote Comms, Scouting and Transit fetch from.
#
# Those three were absent from the first wave for one shared reason — each one's job is to go
# and get something from somewhere else, and a demo has nowhere else. Rather than hand-write a
# fixture per capability, which would break the invariant above, the demo gives them a somewhere
# else and lets their real collectors, adapters and parsers read it.
#
# Loopback only, and demo-endpoints refuses anything that is not: an origin off this machine
# would make the published corpus depend on a host nobody here controls. 8099 sits clear of the
# 8082-8091 block the capabilities occupy. Written once, here — demo-up exports it to Transit
# and generates Scouting's source declaration from it.
origin = "http://127.0.0.1:8099"

[fixtures]
# Where tools/demo-record writes, and where the demo bundle's fetch shim reads. Untracked:
# fixtures are a build product of the seeder plus the capability servers, and committing
# them would let a stale copy get published behind a changed API without anything noticing.
dir = "demo/fixtures"

# ─── Seeded capabilities ──────────────────────────────────────────────────────
#
# `writes` names the generator in tools/lib/demo-data.ts that fills this capability.
# `paths` are recorded AFTER every seeder has run, so cross-capability references
# (a finance expense pointing at a trip) resolve.

# No task capability here since PRD Q48 (2026-08-27): the Action kind moved into the
# operator's Obsidian vault, and `vault` reads a directory rather than a store a seeder
# could POST into. Seeding a fictional vault would mean shipping fictional markdown notes
# with the demo, which is a corpus this manifest deliberately does not own — every seeder
# below writes through an API the dashboard also calls, and the vault has no write API by
# ruling. So the published demo's decision ladder shows no task band.

[capability.calendar]
writes = "calendar"
# The month/agenda views ask for an explicit window. Recorded around the anchor rather
# than "now", and the shim matches on the exact query string, so these are the windows
# the demo can show — the dashboard's own default range is derived from the anchor too.
paths = [
  "/calendar/api/entries?from=2026-02-01&to=2026-05-01",
  "/calendar/api/proposals?from=2026-02-01&to=2026-05-01",
  "/calendar/api/contexts?from=2026-02-01&to=2026-05-01",
  "/calendar/api/rhythms",
  "/calendar/api/windows?from=2026-03-16&to=2026-05-01",
  "/calendar/api/trip-drafts?from=2026-03-16&to=2026-05-01&max_gap_days=5",
  # Home's window: the anchor to four months after it (routes/+page.svelte, horizonEndKey).
  "/calendar/api/entries?from=2026-03-16&to=2026-07-16",
  "/calendar/api/contexts?from=2026-03-16&to=2026-07-16",
]

[capability.trips]
writes = "trips"
paths = [
  "/trips/api/plans",
  "/trips/api/retrospectives/pending",
  "/trips/api/retrospectives/summary",
]
# Plan search is a POST, and the demo refuses every non-GET with its own sentence, so no
# job can start and no job id can exist. The two GET paths are listed anyway so the shim
# recognises them as trips calls and answers 501 rather than letting them reach the host.
# Plan detail pages are per-id and the ids are generated, so they cannot be listed here.
# The recorder expands this against whatever /trips/api/plans returned: one fixture per
# plan, no id ever written down. Same mechanism serves any list→detail pair.
expand = [
  { from = "/trips/api/plans", id_field = "id", into = "/trips/api/plans/{id}" },
  # The cost roll-up is per plan too. With no finance route tagged to a trip in the
  # demo corpus, the recorded fixture shows the honest degrade -- named nulls and a
  # reason rather than a confident zero, which is the behaviour worth demonstrating.
  { from = "/trips/api/plans", id_field = "id", into = "/trips/api/plans/{id}/cost" },
  { from = "/trips/api/plans", id_field = "id", into = "/trips/api/plans/{id}/pack" },
]

[capability.entities]
writes = "entities"
# Seeded through POST /api/entities and /facts, the routes the People page calls. The names,
# relations and cities are invented (tools/lib/demo-data.ts, VOCABULARY.contacts).
# `?kind=person` first: demo-seed proves the store is empty by reading paths[0].
paths = [
  "/entities/api/entities?kind=person",
  "/entities/api/fields?kind=person",
  "/entities/api/located?day=2026-03-16",
]
expand = [
  { from = "/entities/api/entities?kind=person", list_field = "entities", id_field = "id", into = "/entities/api/entities/{id}" },
  { from = "/entities/api/entities?kind=person", list_field = "entities", id_field = "id", into = "/entities/api/entities/{id}/sources" },
]

[capability.finance]
writes = "finance"
# Seeded the way a person actually onboards: a synthetic bank CSV through
# /import/csv/preview → /import/csv → confirm-batch, then holdings and manual balances.
# That is why the demo's Import Review screen has something in it rather than being the
# one empty page in an otherwise full dashboard.
paths = [
  "/finance/api/dashboard",
  "/finance/api/subscriptions",
  "/finance/api/subscriptions/burn",
  "/finance/api/import/candidates",
  "/finance/api/import/csv/mappings",
  "/finance/api/import/investments/mappings",
  # With the query the client always sends: the shim keys on pathname PLUS search
  # (dashboard/src/lib/demo.ts:54) and the recorder keys on the literal string here
  # (tools/demo-record.ts:135), so the bare path answers 501 for every real request.
  # The calendar block above carries the same shape for the same reason.
  "/finance/api/portfolio?currency=EUR",
  "/finance/api/decisions?status=open",
  "/finance/api/prices/status",
]

[capability.comms]
writes = "comms"
# Seeded through POST /ingest — the same public write route the dashboard's "add this link"
# path uses. The seeder posts URLs; Comms fetches, extracts and normalises them itself, so
# what is recorded here is its extractor's output rather than a fixture's.
paths = [
  "/comms/feed",
  "/comms/feed/origins",
  "/comms/sources",
  "/comms/triage",
  # Home's own reads (routes/+page.svelte, lib/home/kinds): the shim matches the exact query.
  "/comms/triage?status=proposed",
  "/comms/feed?days=30",
  # mail-llm-rung: counts only, and empty until a pass has run. An empty state
  # is the honest demo of a rung that ships in shadow.
  "/comms/triage/classify/report",
]
expand = [{ from = "/comms/feed", id_field = "id", into = "/comms/feed/{id}" }]

[capability.scouting]
writes = "scouting"
# `/discover?adapter=demo-origin` names the source demo-up declares in the generated
# scouting.json. Scouting's own rss adapter fetches and parses the synthetic feed; nothing
# here writes an opportunity directly.
# `/scouting/opportunities` first, deliberately: demo-seed proves a store is empty by reading
# paths[0], and `/sources` answers with the declared source, which is never empty and would
# refuse every run.
paths = [
  "/scouting/opportunities",
  "/scouting/sources",
  # Home asks without dismissed entries (lib/home/kinds/opportunity.ts).
  "/scouting/opportunities?include_dismissed=false",
  "/discover?adapter=demo-origin&limit=20",
]

# ─── Recorded without seeding ─────────────────────────────────────────────────

[capability.transit]
# No `writes`, and that is the honest shape: a journey search is a query, not a store, so
# there is nothing to fill. Every answer here is Transit's own HAFAS parser reading the
# synthetic origin, which returns the same three journeys for the same query — one direct and
# two with a change, because a search that only ever returns direct trains demonstrates
# neither the transfer buffer nor anything built on it.
#
# `reliability` and `delay_risk_score` come back null: punctuality is not in this demo, and
# absence degrades rather than being invented. See [absent.punctuality].
#
# `/api` rather than `/transit/api`: transit's service.toml proxies /api through unstripped,
# which is how the dashboard's client has always called it.
paths = [
  "/api/suggest?q=Central",
  "/api/search?from=9900001&to=9900002&time=2026-03-16T09:00:00",
]

[capability.sjel-status]
# No `writes`: every answer here is derived from the manifests in this checkout plus the
# state of the machine recording it. On a clean CI runner that is honestly a clean CI
# runner — capabilities up because the job started them, one repo on main, no overlay.
# Nothing to invent, and inventing it would be the only way to get it wrong.
#
# `/api/sjel-status/upstreams` stood in this list until 2026-09-08 and had not been a route
# since 2026-08-28: PRD Q41 retired `tools/upstream-checker`, whose verdict was the endpoint's
# only content, and the handler went with it (`capabilities/sjel-status/src/status/health.rs`
# keeps the reasoning where the code was). The dashboard's types went at the same time
# (`dashboard/src/lib/api.ts`, `UpstreamEntry` / `UpstreamAudit`), so nothing has asked for it
# in eleven days — the manifest was the last thing that still named it, and the recorder would
# have taken sjel-status' proxy fallback and failed the Pages build on a 404 from transit.
# The verdict half is not lost: `self.json` carries `{name, verdict}` per upstreams.toml row
# and `/self` above serves it. `tools/demo-check-paths` is what refuses the next one.
paths = [
  "/sjel-status/api/sjel-status/health",
  "/sjel-status/api/sjel-status/capabilities",
  "/sjel-status/api/sjel-status/self",
  "/sjel-status/api/sjel-status/repos",
  "/sjel-status/api/sjel-status/backups",
]

# ─── Deliberately absent ──────────────────────────────────────────────────────
#
# Read by tools/demo-site to hide these from the demo's navigation and to print the reason
# on the demo landing card. A page that 404s teaches a visitor the software is broken; a
# page that is honestly missing teaches them where the edge is.
#
# Comms, Scouting and Transit left this section on 2026-08-20. All three were absent for the
# same reason — each fetches from somewhere else, and a demo has nowhere else — and all three
# are here now because `[demo] origin` gives them one.

[absent.places]
reason = """
places is absent because its two interesting surfaces cannot be seeded honestly. The map layers \
are joins over finance transactions, transit legs and the companion register, which is C2 and \
never leaves the host (places ISA PLC-8) -- seeding it would mean inventing people, and a made-up \
person in a made-up city is exactly the shape of the data the rule exists to protect. And the \
seasonality strip on the travel page reads climate normals folded from ten years of real daily \
observations per place, fetched once from Open-Meteo and cached permanently; a hand-written \
twelve-month grid would be a fixture wearing a measurement's clothes, which is the one thing this \
demo does not do.

The pages still work. The Travel page's "Companions" section renders this sentence in place of \
the waiting decisions, the strip and the map say what is missing instead of drawing an empty \
grid, and the map layers places would draw are simply not there. That is the designed behaviour \
-- absence degrades, it never fails. Without this block the fetch shim would find no owner for a \
/places/... path and fall through to a real network request from a static page, which is worse \
than a stated 503.\
"""

[absent.punctuality]
reason = """
punctuality has no write API to seed through. Its whole input is Deutsche Bahn's monthly \
open-data publication: 100+ MB of parquet per month, folded into cells by a batch job. \
Nothing in that can be produced by a POST, and a synthetic histogram would be a hand-written \
fixture wearing a measurement's clothes, which is the one thing this demo does not do.

Its absence is visible rather than hidden, and it is worth reading as part of the \
demonstration: Transit's `reliability` and `delay_risk_score` come back null here, because \
the capability that measures them is not running. That is the designed behaviour — absence \
degrades, it never fails — and the demo shows it rather than inventing a number.\
"""

# Added 2026-09-27. The dashboard called these seven and demo.toml named none of them, so the
# shim treated their paths as static assets and GitHub Pages answered with its own 404 page,
# which the People page printed whole. Each is absent for the reason below until a seeder exists.

[absent.devices]
reason = """
devices is absent because a device registry holds paired devices and their public keys, and a \
published page has no device to pair.
"""

[absent.traveler]
reason = """
traveler is absent because the traveler profile is one person's preferences and documents, and no \
synthetic profile has been written for it yet.
"""

[absent.interior]
reason = """
interior is absent because its rooms, scans and items describe one real flat, and no synthetic \
flat has been written for it yet.
"""

[absent.vault]
reason = """
vault is absent because it reads an Obsidian vault on the machine it runs on, and a published \
page has no vault.
"""

[absent.knowledge-graph]
reason = """
knowledge-graph is absent because it serves the code graph built on the machine it runs on, and \
that graph names that machine's paths.
"""

[absent.macmon]
reason = """
macmon is absent because it reports the live temperature and load of one Mac, and a recording of \
it would describe a machine that is not there.
"""

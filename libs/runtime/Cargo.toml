[package]
name = "sjel-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Per-device runtime admission: battery profiles and explicit workload exceptions."
publish = false

[dependencies]
sjel-config = { path = "../sjel-config" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# One derive needs it: `Update` is sjel-status's `POST /runtime` body, and a manifest schema has
# to be derived from the struct serde parses rather than hand-written beside it.
schemars = "1.2.2"

[lints]
workspace = true

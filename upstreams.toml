[presidio]
url = "https://github.com/microsoft/presidio"
verdict = "reject"
license = "MIT"
why = "measured 2026-08-30 as a replacement for capabilities/comms/src/cloud_derivative.rs::transform_text, on a frozen 24-fixture corpus of real mail (12 DE, 12 EN, 48 labels) with the labels written before either redactor ran. It lost on the metric that decides: recall 83.3% against the incumbent's 91.7%, and it wrote 153 redaction markers where the incumbent wrote 52 -- 3x the over-redaction, which is summary quality spent for no privacy gained. The split is entirely person names in English (53.8% vs 76.9%); German ties at 85.7%, which killed the hypothesis that German prose was the gap. Six of its eight misses are names `people_registry::is_known_person` knows and a general model cannot -- the second measurement agreeing with that file's own claim, after the 2-of-2,802 one. NOT measured: Presidio tuned, with the contact list as a deny-list recognizer and a DE account pattern; stock recognizers and stock de_core_news_lg/en_core_web_lg are what adopting it on day one would have given, and that is what was tested. Cost side, unchanged by tuning: a Python + spaCy runtime and ~1.1 GB of models in a Rust/Bun repo, plus the model version would have to become part of REDACTION_VERSION or a spaCy upgrade silently invalidates every preview_hash a human already approved. What held, and is worth more than the verdict: its 4 unique catches are a defect list for ours -- a name in English apposition ('X from Y', 'I am X') is invisible to a salutation-only gate, and a login handle identifies a person under no current rule. Both are cheaper to fix in transform_text than a second runtime is to carry; recorded as PRD D14. Record: <overlay>/config/comms-redaction-shadow.md. Uninstalled after measuring, per R4. D14 CLOSED the same day in deterministic-entity-redaction-v3: introduces_person also seeds on an English self-introduction (I'm / I am / this is / my name is, entity-decoded because stored mail carries the cue as I&#39;m), names_a_person_in_apposition seeds on 'X from Y', and a login handle behind a cue is a person. Measured on the same frozen corpus: recall 91.7% -> 100.0% (48/48, zero leaks), markers 52 -> 57, and across all 193 personal mails 318 -> 325. So the 4 labels Presidio bought with 3x over-redaction cost 2.2% here, which is what 'cheaper to fix in transform_text' was worth"

[auge]
url = "https://github.com/Arthur-Ficial/auge"
verdict = "reject"
license = "MIT"
why = "Considered as a third capabilities/transit DocumentBackend beside builtin and xberg, and MEASURED on 2026-08-29 the way xberg was measured on 2026-08-11: a rendered DB-style journey table, OCR'd, compared against what the seam needs. Rejected because it reads text lines, not layout. Apple Vision's VNRecognizeTextRequest returns text observations, so a table comes back COLUMN-MAJOR -- `Datum / 29.08. / Ab / 08:14 / 11:05 / Bahnhof / Koeln Hbf / Frankfurt(M) Hbf / An / ...` -- with the two legs interleaved and unrecoverable. That is the exact failure capabilities/transit/src/document.rs was written to escape, and worse than pdf_extract, which at least keeps one leg's fields adjacent. `--md` is an output format for auge's own results and reconstructs nothing. What DID hold: German is perfect (Koeln Hbf, Muenchen Hbf) with no language pack, so if this slot ever wants an OCR engine rather than a layout reader, this is the one -- and reconstructing rows from bounding boxes would be Sjel writing the layout logic, which is the code the apfel adoption just deleted elsewhere. Also note the trust delta: apfel is in homebrew-core, auge needs a personal tap. SECOND MEASUREMENT OF THE SAME ENGINE, 2026-08-31, on the Notability corpus and recorded here rather than in a new entry because it is the same VNRecognizeTextRequest: Apple Vision is EXCELLENT on printed German prose and USELESS on mathematical notation. It reads = as - (q- 10nC, d-2am) and cannot express a fraction at all, so a page of formulas comes back as plausible-looking wrong text rather than as a failure -- which is worse than an error and is why PRD Q63 gives the ladder a third rung instead of stopping here. It won on text volume against Docling on 550 of 1,027 pairs on that corpus, so the weakness is specific to notation and not general. This is the OCR slot the paragraph above anticipated, and Q63 is where it is being decided. DECIDED 2026-09-02 (PRD Q63 -> B30): THE ENGINE ENTERS AXON, THIS CLI DOES NOT. Rung 2 calls VNRecognizeTextRequest through Sjel's own 25-line tools/visocr, straight over the OS framework recorded at systems.toml [apple-vision] -- no personal tap, no third-party binary, and the bounding-box layout logic this entry rejected is still not written. Its first run against the frozen DE/EN corpus is libs/extraction/eval/results/2026-09-02-apple-vision-baseline.md: 100.0% prose recall over four German and English pages, 58.8% notation. NOTE the printed-page failure mode DIFFERS from the handwriting one recorded above and is worse to detect: on rendered notation it does not read = as -, it DELETES the displayed equation and returns the surrounding prose as though the page had none. That is why libs/extraction/src/math.rs carries a fifth signal for a relation left with no right-hand side."


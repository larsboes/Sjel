# Train-reliability aggregate queried synchronously during transit journey ranking.
kind        = "process"
name        = "punctuality"
command     = ["target/release/punctuality-server"]
build       = ["cargo", "build", "--locked", "--release", "-p", "sjel-punctuality", "--no-default-features", "--features", "turso-wal", "--bin", "punctuality-server"]
port        = "8085"
health_path = "/health"
autostart   = "true"

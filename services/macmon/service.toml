# Apple Silicon hardware metrics sampler (vladkens/macmon).
kind          = "process"
name          = "macmon"
command       = ["macmon", "serve", "--port", "${SJEL_PORT}", "--interval", "5000"]
port          = "9911"
health_path   = "/json"
routes_absent = "upstream binary (vladkens/macmon); serves /json only"
autostart     = "false"

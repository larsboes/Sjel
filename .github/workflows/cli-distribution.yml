name: CLI-only distribution

on:
  workflow_dispatch:
    inputs:
      version:
        description: Preview artifact version; this workflow does not tag or publish
        required: true
        default: v0.0.3
        type: string
  push:
    branches: [main]
    paths:
      - tools/distribution/**
      - .github/workflows/cli-distribution.yml
      - Cargo.toml
      - Cargo.lock
      - crates/**
  pull_request:
    paths:
      - tools/distribution/**
      - .github/workflows/cli-distribution.yml
      - Cargo.toml
      - Cargo.lock
      - crates/**

permissions:
  contents: read

jobs:
  cli:
    name: CLI install (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      RELEASE_VERSION: ${{ inputs.version || 'v0.0.3' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Validate preview version
        shell: bash
        run: '[[ "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - name: Test archive preparation and lifecycle without the source-build preload
        working-directory: tools/distribution
        run: bun test prepare.test.ts cli-install.test.ts publish-draft.test.ts
      - name: Build CLI-only archive
        run: >-
          bun tools/distribution/prepare.ts cli --version "$RELEASE_VERSION"
          --target-dir "$RUNNER_TEMP/sjel-cli-build" --out "$RUNNER_TEMP/sjel-cli-dist" --build
      - name: Prepare a compatible update fixture from the same binaries
        shell: bash
        run: |
          base=${RELEASE_VERSION#v}
          patch=${base##*.}
          next="v${base%.*}.$((10#$patch + 1))"
          bun tools/distribution/prepare.ts cli --version "$next" \
            --target-dir "$RUNNER_TEMP/sjel-cli-build" --out "$RUNNER_TEMP/sjel-cli-update" --prepare-dependencies
      - name: Rehearse POSIX bootstrap, update and rollback without developer tools
        shell: bash
        run: |
          archive=$(find "$RUNNER_TEMP/sjel-cli-dist" -maxdepth 1 -name 'sjel-cli-*.tar.gz' -print)
          digest=$(shasum -a 256 "$archive" | cut -d' ' -f1)
          update=$(find "$RUNNER_TEMP/sjel-cli-update" -maxdepth 1 -name 'sjel-cli-*.tar.gz' -print)
          update_digest=$(shasum -a 256 "$update" | cut -d' ' -f1)
          bash tools/distribution/cli-smoke.sh "$archive" "$digest" "$update" "$update_digest"
      - name: Retain tested CLI archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sjel-cli-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/sjel-cli-dist/*.sh
            ${{ runner.temp }}/sjel-cli-dist/*.tar.gz
            ${{ runner.temp }}/sjel-cli-dist/*.json
            ${{ runner.temp }}/sjel-cli-dist/*.txt
            ${{ runner.temp }}/sjel-cli-dist/SHA256SUMS
            ${{ runner.temp }}/sjel-cli-dist/CLI_VERSION
          if-no-files-found: error
          retention-days: 14

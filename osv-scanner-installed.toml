# ── rustls 0.23.40 and 0.23.45, four advisories all fixed in 0.23.46 ──────────────────
#
# All four arrive through the published lock of a crate `cargo install --locked` resolves,
# measured 2026-10-18 with `sjel update --json` against the crates.io releases:
#
#   * cargo-deny 0.20.2 carries 0.23.40, and 0.20.2 IS the latest release — no install moves it.
#   * xberg-cli 1.3.9 carries 0.23.45. The available 1.3.10 still pins 0.23.45 (read from its
#     published Cargo.lock), so installing it would not help either.
#   * tauri-cli 2.12.2 carries 0.23.45. The available 2.12.3 pins the FIXED 0.23.46, so
#     `cargo install tauri-cli --locked --force` ends that one instance on its own.
#
# The exposure is a TLS connection the tool itself makes — a registry, a CDN, a release download
# — so the remote end must be hostile or a MITM. Nothing in a crate name or an argument reaches
# these. Ends when a release publishes rustls >= 0.23.46 through its lock, which for cargo-deny
# and xberg-cli is upstream's to do and for tauri-cli is available today.

# ============================================================
# REGELN der Musterwohnung. Erfunden, aber vollstaendig: jede Regel, die `clearance.rs` lesen
# kann, steht hier einmal, damit ein fehlender Schluessel als Fehler auffaellt und nicht als
# uebersprungene Pruefung.
#
# `bett_zugang_zweite_seite = 40` — anders als die reale Wohnung, die dort 0 fuehrt. Der
# Unterschied ist Absicht: er beweist, dass die Zahl aus der Datei kommt und nicht aus dem Code.
# ============================================================

[laufwege]
haupt_soll = 90
haupt_min  = 75
neben_min  = 60

[abstaende]
bett_zugang_laengsseite  = 60
bett_zugang_zweite_seite = 40
schreibtisch_stuhlzone   = 100
esstisch_stuhl_ausziehen = 80
couchtisch_vor_sofa      = 40
schrank_tuer_oeffnen     = 90
couch_ausklapptiefe      = 75
vor_kuechenzeile         = 100

[lichtkorridor]
x = [0, 170]
y = [70, 350]
max_hoehe = 140

[[regeln]]
id = "R1"
schwere = "hart"
text = "Anlaufzone vor der gesamten Breite der Terrassentuer freihalten."

[[regeln]]
id = "R2"
schwere = "hart"
text = "Tuerschwenkzonen sind Sperrflaechen."

[[regeln]]
id = "R3"
schwere = "weich"
text = "Kein Moebel ueber der Grenzhoehe im Lichtkorridor."

[[regeln]]
id = "R4"
schwere = "weich"
text = "Bettkopfende nicht an die Verglasung."

[[regeln]]
id = "R7"
schwere = "hart"
text = "Kein Moebel darf die Anlaufzone der Kuechenzeile blockieren."

[[regeln]]
id = "R8"
schwere = "hart"
text = "Ausklappzone des Schlafsofas dauerhaft frei."

# --- die einzige Regel, die ein Datum kennt --------------------------------
#
# R9 ist OPTIONAL (`clearance::OPTIONALE_REGEL_IDS`): eine Wohnung, die keinen Standort, keine
# Nordrichtung und keine Glashoehen fuehrt, soll darueber nicht abbrechen, sondern schweigen.
# Diese hier fuehrt alle drei, also laeuft sie. Die reale Wohnung fuehrt R9 bewusst NICHT —
# ihre Verglasungen sind nicht in der Hoehe vermessen, und eine erfundene Fensterhoehe ergaebe
# einen Lichtfleck auf den Zentimeter genau, der auf nichts beruht.
#
# Die Schwelle steht auf 12 von 44 geprueften Stunden. Sie trennt: der Schreibtisch in `a-frei`
# bekommt 11 und schweigt, derselbe Schreibtisch in `i-blick-aufs-bett` bekommt 15 und meldet.
# Eine Schwelle, an der kein Layout auf der einen und keines auf der anderen Seite liegt,
# prueft nichts.
[[regeln]]
id = "R9"
schwere = "weich"
text = "Der Schreibtisch soll nicht den halben Tag in der direkten Sonne stehen."

[sonne]
max_stunden_am_schreibtisch = 12

# --- deklariert, aber von dieser Maschine NICHT geprueft -------------------
#
# Die reale Wohnung fuehrt zwei solche Regeln (R5, R6), und bis 2026-08-31 fielen sie stumm
# heraus: der Pruefer las `[[regeln]]` gar nicht, also sah ein Bericht ueber acht deklarierte
# Regeln aus wie einer ueber sechs gepruefte. Diese beiden stehen hier, damit
# `CheckResult::nicht_geprueft` einen Fall hat, den die Musterwohnung selbst erzeugt — eine
# Luecke, die nur die echte Wohnung kennt, ist eine Luecke, die kein Test bewacht.
[[regeln]]
id = "R5"
schwere = "weich"
text = "Schreibtisch nicht frontal zur Fensterwand — Blendung auf dem Bildschirm."

[[regeln]]
id = "R6"
schwere = "weich"
text = "Vom Eingang aus faellt der Blick nicht zuerst auf das Bett."

# Deklariert, und diese Maschine kennt sie nicht.
#
# R5 und R6 standen bis 2026-08-31 an dieser Stelle; seit sie implementiert sind, braucht der
# Fall einen eigenen Vertreter. Eine Wohnung darf eine Hausregel fuehren, die der Pruefer nicht
# umsetzt — sie faellt dann NICHT still heraus, sondern steht als ungeprueft im Bericht.
[[regeln]]
id = "R10"
schwere = "weich"
text = "Ein Teppich unter dem Esstisch, gross genug fuer die zurueckgeschobenen Stuehle."

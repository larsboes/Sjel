"$schema" = "schemas/schema.json"

[default]
description = "Expose the iOS Keychain-backed Sjel device identity."
permissions = ["allow-get-identity", "allow-signing", "allow-reset-identity"]

[[permission]]
identifier = "allow-get-identity"
description = "Read the device identity's public key. The private key remains in iOS Keychain."
commands.allow = ["getIdentity"]

[[permission]]
identifier = "allow-signing"
description = "Sign request bytes with the Keychain-backed device key."
commands.allow = ["sign"]

[[permission]]
identifier = "allow-reset-identity"
description = "Replace the Keychain-backed device identity after explicit re-pairing."
commands.allow = ["resetIdentity"]

# Twice-daily rail fare re-pricing for upcoming trip plans.
kind     = "process"
name     = "sparpreis-watch"
command  = ["target/release/sjel-cli", "sparpreis-watch"]
build    = ["cargo", "build", "--locked", "--release", "-p", "sjel-cli", "--bin", "sjel-cli"]
schedule = "12h"
requires = ["transit", "trips"]

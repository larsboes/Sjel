[package]
name = "sjel-summarize"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "One adaptive digest engine: the shape follows the source's length, 'more detailed' is a rung on that same ladder, and a Mermaid answer is validated before it is stored."
publish = false

[lib]
name = "sjel_summarize"
path = "src/lib.rs"

# This crate owns its HTTP and JSON dependencies directly.
[dependencies]
# Outbound HTTP goes through one factory: the user-agent, the timeout and the
# connection pool are decided there, not at each call site (libs/sjel-http).
sjel-http = { path = "../sjel-http" }
serde_json.workspace = true
reqwest = { workspace = true, features = ["json", "blocking"] }

[lints]
workspace = true

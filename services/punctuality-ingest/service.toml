# Scheduled daily ingest producer for the punctuality capability.
kind     = "process"
name     = "punctuality-ingest"
command  = ["target/release/punctuality-cli", "ingest"]
build    = ["cargo", "build", "--locked", "--release", "-p", "sjel-punctuality", "--no-default-features", "--features", "turso-wal", "--bin", "punctuality-cli"]
schedule = "24h"
requires = ["punctuality"]

# Axon Pack profiles — named use-cases that deploy a set of Packs together,
# optionally narrowed to a per-Pack skill subset so a profile does not drag a
# whole Pack into every session when the measurements say most of it is unused.
#
#   tools/harnesses use <name> [--harness <id>]   apply to every installed harness
#   tools/packs-claude use <name>                 apply to Claude Code
#   tools/packs-pi use <name>                     apply to pi (rewrites settings.json)
#   tools/packs-codex use <name>                  apply to Codex
#
# ── 2026-10-09: Codex's 21 deployed skills were removed, and this is why ─────────────
#
# Codex's destination is `$HOME/.agents/skills` (registry.rs, CODEX_SKILLS_DIR), which is
# ALSO one of pi's two automatic global discovery roots (pi.rs discovery_roots). Deploying a
# Pack to Codex therefore loaded every one of its skills into pi a second time: 21 Pack
# skills sat in both pi's settings.json registry and the Codex copy, and pi's loader keeps
# the first and warns `name "X" collision` for the loser (skills.js, addSkills). The registry
# entry won every time, so no content was ever wrong -- but a skill pi does NOT register
# silently fell back to Codex's stale copy, which is how `gpui` was being loaded after it
# was added to the coding Pack (2026-10-09, 949a9cb7) and before `tools/packs-pi deploy
# coding` registered it. Two channels for one skill is the defect; only one should exist.
#
# So: a Pack is deployed either materialized (Claude Code, whose ~/.claude/skills pi does
# not read) or through pi's registry, not both. Re-deploying to Codex reintroduces 21
# collisions and the stale-copy fallback above -- read this first.
#
# Codex itself stays installed and usable; it simply carries no Sjel skills now. Its
# superseded state is undone with `tools/packs-codex deploy <pack>...` per Pack.
#
# ── 2026-10-13: SUPERSEDED. Codex's root moved and it carries Packs again ────────────
#
# The paragraph above is why Codex was emptied, not a permanent rule. The defect was never
# Codex: it was that Codex's destination WAS a pi discovery root. Measured 2026-10-13: Codex
# reads `$CODEX_HOME/skills` (defaults to `~/.codex/skills`) -- its own binary says "Installs
# into $CODEX_HOME/skills/<skill-name>", that is where `.system/` and the skill-installer
# live, and `codex exec` in a neutral directory resolves skills no other root on this machine
# supplies. pi reads `~/.pi/agent/skills`, `~/.agents/skills` and project `.agents/skills`
# (pi.rs, discovery_roots) and does NOT read `~/.codex/skills`.
#
# So `registry.rs` now defaults the Codex destination to `$HOME/.codex/skills`. One channel,
# one reader, no collision, and Codex holds the same Pack set as Claude Code. `~/.agents/skills`
# keeps its other readers and its `npx skills --global` policy (tools/skills) unchanged.
#
# MIGRATING A MACHINE THAT HAD CODEX DEPLOYED: the ledger records the destination it belongs to
# and `read_state` refuses a mismatch ("state file belongs to X, not Y"), so the move is not
# silent and not automatic. In order: deploy the Packs to the new root (`tools/packs-codex
# deploy <pack>...`), confirm Codex loads them, and only then remove the old copies at
# `~/.agents/skills` -- they are also pi's, so removing first would strip pi. Where the old
# ledger holds no rows (as here), repointing its `destination` field is the whole migration.
# `codex.json` is backed up daily under `capabilities/packs`, so the pre-move file is
# recoverable.
#
# The old note's own warning is what still applies to an OVERRIDE: set CODEX_SKILLS_DIR back to
# `~/.agents/skills` by hand and the 21 collisions return. The guards that say so are keyed on
# the configured destination, not on a hardcoded path, so they stay true either way --
# `tools/harnesses <verb>`, `tools/packs-codex remove`, and the doctor's absent-harness check.
# A profile is a SELECTION, not a recommendation: activating it replaces what the
# harness loads with exactly this set. What is deployed, and what is not, is the
# operator's decision and it is written HERE — see `full` below, and see the note on
# the retired `# pi: REFUSED` line in Packs/home-automation/pack.toml for why it is
# not written in a Pack any more.
#
# PI IS PROFILE-DRIVEN (2026-09-11, Lars: "I want to be able to change through axon
# profiles what's deployed"; pi is used from the home folder, so the GLOBAL registry
# is the load set — no project scoping). The registry currently holds `full` minus
# home-automation; switching it is one command: tools/harnesses use <name> --harness pi.
#
# ── 2026-09-17: five Packs became three, and this file is what paid for it ──────────
#
# Packs were merged by CO-DEPLOYMENT, not by resemblance: a Pack is a deployment
# unit, so the test is whether this file already deployed them together. Merged:
#   writing        <- academic-writing, unslop
#   cognitive-load <- asd-ste100
#   harness        <- sjel
# Skills kept their names, so nothing changed about what loads — except where it
# did, and those two are why the subsets below exist rather than a bare pack list:
#   - `productive` held `sjel` but NOT `harness`. Listing the merged Pack would drag
#     suggest-skills, trim and harness-sync into every session, so it narrows to sjel.
#   - `coding` held writing + skill-creator + unslop + sjel and no academic-writing, so it
#     names its three writing skills and takes sjel from harness.
#
# FIVE PROFILES WERE DELETED as aliases: writing, knowledge, harness, security, travel
# each named exactly one Pack, so `use <pack>` already did the same thing and the
# profile was a second name for one selection. What remains is the three genuinely
# composite sets plus `full`.
#
# Usage evidence per Pack, measured 2026-09-11 over present-day transcripts
# ("\"command\":…<script>" tool calls across ~/.claude/projects; audit-era baselines
# from the 2026-08-22 skills audit named per Pack). A membership is a decision with
# a number behind it; where the number is 0 the Pack is in by role and says so.
# Counts keep the pack name they were measured under, since that is what the
# transcripts say; the pack a skill now lives in is named beside it.
#
# Note on `sync` vs profiles: after activating a profile, a manual `sync <pack>`
# deploys the WHOLE Pack again (the ledger does not remember the subset). Re-run
# `use <name>` to re-trim.

# ── Per-harness unit holds ──────────────────────────────────────────────────────────
#
# A unit a Pack carries that must NOT be deployed to one harness: `deploy` and `sync` skip
# it, printing why, and `tools/doctor` reads this table instead of warning that the unit is
# missing. It is also a violation doctor reports if the unit IS at that destination.
#
# It lives in this file, and not in a Pack manifest, for the reason
# Packs/home-automation/pack.toml records for its retired `# pi: REFUSED` line: a
# harness-specific rule does not belong in a manifest the schema keeps harness-neutral.
# This file is where operator decisions live.
#
# claude: `harness/agents/` is Explore.md, which overrides the agent that carries a model pin.
# It is deployed to pi only. pi's pin (`anthropic/claude-haiku-4-5`) reached no provider this
# machine can use, so the override fixes pi; Claude Code is Anthropic-native, the pin resolves
# there, and deploying this file would REMOVE a working Haiku tier from that harness. Measured
# 2026-10-09: `tools/packs-claude sync harness` deployed it, because sync takes every unit —
# this hold is what stops the next sync from repeating that. See
# Packs/harness/README.md, "agents/Explore.md".
#
# Extend it with what is missing, never with what is merely unused: a dormant Pack is excluded
# by a profile's `except`, which is a different decision.
#
# pi: `harness/pi-packages/accordion` was removed from pi's registry on 2026-10-09 (owner
# decision), together with the ponytail extension — that one is a personal `git:` install in
# ~/.pi/agent/settings.json and not a Pack unit, so `pi remove git:github.com/DietrichGebert/ponytail`
# is its whole trace and no hold can express it. Measured before and after on a real session:
# the system prompt fell 52,598 → 40,964 characters (−11,634, about 2.9k tokens a turn), of which
# 5,252 was ponytail mode's block and the rest eight skill entries (six ponytail, two accordion);
# TUI startup was 0.81s either way, so this is a per-turn cost and not a startup one. The hold is
# what stops `tools/packs-pi deploy|sync harness` and `tools/harnesses use <profile> --harness pi`
# from re-registering accordion, because both rediscover it from `pi-packages/` alone. The tree
# stays in the Pack: accordion is vendored and deliberately owned (upstreams.toml [accordion]),
# and a hold is a decision not to write a path, not a deletion.
#
# codex: `writing/skill-creator` is the one name Codex already has. Codex ships its own
# `skill-creator` at `$CODEX_HOME/skills/.system/skill-creator`, and it resolves BOTH
# `~/.codex/skills` and `~/.codex/skills/.system` as skill roots (measured 2026-10-13 with
# `codex exec`, which listed two skills named exactly `skill-creator`). Two different skills
# under one name is the same defect the pi/codex collision above was: one name, one channel.
# Codex's own copy cannot be removed — it is a system skill and an update restores it — so the
# hold is what gives that name one owner. Measured 2026-10-13: the collision existed only after
# Codex's destination moved to `~/.codex/skills` and the writing Pack was deployed there, and
# no other harness had it (claude's root and pi's two roots had no duplicate names).
#
# A hold does not delete what is already written (mutate.rs, sync_pack: "the hold means never
# write this, not delete what is there"), so clearing this one was `tools/packs-codex remove
# writing` followed by `deploy writing` — remove takes every recorded unit, deploy then skips
# this one and prints why.
#
# defuddle: held from every harness (2026-10-13, owner decision). The skill's own first
# instruction is "In pi, use the built-in `fetch_content` tool", and both other harnesses carry a
# native page fetch — so it is a second path to something already built in, and it says so
# itself. Held rather than deleted for the same reason as the 2026-10-13 trim in `full`: the Pack
# source stays, and `everything` or a direct deploy brings it back.
#
# THE KEY SHAPE DIFFERS BY CHANNEL, and this is the trap. A materialized channel matches a UNIT
# KEY (`knowledge/defuddle`), while pi's settings channels are registered by PATH and match a path
# from the Pack root (`knowledge/skills/defuddle`) — see pi_settings.rs, `held_for`. So the same
# decision is spelled two ways, and getting it wrong is silent: a hold that matches nothing looks
# exactly like one that works. Measured 2026-10-13: `knowledge/defuddle` held it from claude and
# codex and left pi still registering it, which only `tools/harnesses status` showed.
#
# writing/agents/: all eight files in that tree are academic-writing subagents, so this is the
# agents half of the same 2026-10-13 decision that narrowed academic-writing out of `full`. It
# has to be a hold rather than a profile narrowing, because the profile `skills` map names SKILLS
# and the agents channel ignores it by design — `activate_agents_for_profile` calls sync_pack,
# which takes every agent unit in the Pack. A hold is absolute, so unlike the skill, these agents
# are NOT restored by activating `everything`; restore them by removing this line. codex needs no
# entry: it has no agents channel at all (`tree_convention: None`).

[unit_hold]
claude = ["harness/agents/", "knowledge/defuddle", "writing/agents/"]
pi = [
    "harness/pi-packages/accordion",
    "knowledge/skills/defuddle",
    "writing/agents/",
]
codex = ["writing/skill-creator", "knowledge/defuddle"]

[[profile]]
name = "productive"
description = "Daily driver — coding, prose, decks, deliberation, orientation, focus"
packs = ["writing", "presentations", "deliberation", "cognitive-load", "harness"]
# harness narrowed: this profile wants sjel (repo orientation), not the three
# maintenance skills. See the 2026-09-17 note above.
# writing narrowed: academic-writing left the daily set on 2026-10-13 (see that note below).
skills = { "harness" = ["sjel"], "writing" = ["human-writing", "skill-creator", "unslop"] }
# writing: human-writing 15 runs (430 audit-era) + skill-creator 12 runs · academic-writing 7
#   runs (45 audit-era) + unslop 0 script runs (code-quality review pass by role). One Pack now;
#   all four skills load, which is the same set this profile already carried.
# presentations: 0 runs — new Pack (2026-09-11); in by role, deck work is adjacent to
#   academic-writing and a deck request would otherwise land in a profile that has neither
# deliberation: council/red-team drive subagents; role-keeper in the writing stack (0 runs)
# cognitive-load: attention-control + asd-ste100; small focus metacognition; role (0 runs)
# harness (sjel only): orientation for repo work; role (0 runs)

[[profile]]
name = "home"
# DORMANT as of 2026-09-11 (Lars): home-automation is not deployed to any harness right
# now; 3d-printing + cv remain live members. Activating this profile is the switch that
# brings the house stack back.
#
# This is also why home-automation is still its own Pack after the 2026-09-17 merge pass,
# and the reason is now a plain one: `full` excludes it by name, so a Pack holding both it
# and the deployed 3d-printing/cv would have to be excluded or deployed as a unit. Merging
# them would need per-skill exclusion, which is a feature, not a taxonomy.
description = "Home automation, network, devices, CV, 3D printing"
packs = ["home-automation", "3d-printing", "cv"]
skills = { "home-automation" = ["homectl", "ha-cli", "pihole", "fritz", "netmon", "ha-deploy"] }
# home-automation narrowed to the measured-by-use six (2026-09-11, runs):
#   homectl 13 · ha-cli 27 · pihole 63 · fritz 60 · netmon 12 · ha-deploy 7
# Excluded until used (≤1 session each): ha-inventory, wlanwatch, espctl,
# energy-dashboard, ha-dashboard, ha-dashgen. Re-run `use home` after a full sync.
# 3d-printing: printctl 6 runs (221 audit-era) · cv: cv build 2 runs (75 audit-era)

[[profile]]
name = "coding"
description = "Code quality and the tools that write it"
packs = ["writing", "harness"]
# Named skills rather than whole Packs: a coding session wants the code/UI tell scanner,
# the prose skill, and the skill author — not academic-writing, and not trim/harness-sync.
skills = { "writing" = ["unslop", "human-writing", "skill-creator"], "harness" = ["sjel"] }
# unslop: 0 script runs — code-quality review pass by role · sjel: orientation for repo work

# Codex is installed but carries no Sjel Pack (see the 2026-10-09 note above). Its
# `use` verb therefore still applies here as recorded: declined, on this host.

[[profile]]
name = "full"
description = "Everything except the Packs marked dormant below"
packs = ["*"]
# home-automation is dormant by decision (2026-09-11, Lars): not deployed to pi, and not to
# Claude Code either. That used to be enforced by a `# pi: REFUSED` line in its own
# pack.toml; retired 2026-09-17, because a harness-specific veto does not belong in a
# manifest the schema keeps harness-neutral, and because it made this very profile mean
# something other than what it says. Excluding it here is the same decision, recorded
# where the operator records decisions.
#
# `*` rather than an explicit list, deliberately: an explicit list would have to name
# ytalbum, which lives in the private overlay and does not exist on another machine, and
# it would silently stop deploying every Pack added later. `everything` below is the raw,
# unfiltered set for the case where the dormant Packs are wanted too.
#
except = [
    "home-automation",
    "3d-printing",
    "cv",
    "design",
    "travel",
    "ytalbum",
]
# The 2026-10-13 trim, and it is a DEPLOYMENT decision: every Pack named above stays in the
# repository, un-deployed, and `everything` puts all of them back in one command. `design` is
# ui-craftsmanship alone; it had the highest measured demand of anything removed here (116
# uses in a month), so its removal is a deliberate call and not a measurement's conclusion.
# Sources are recoverable by re-activating a profile; nothing was deleted.
skills = { "writing" = ["human-writing", "skill-creator", "unslop"] }

[[profile]]
name = "everything"
description = "All Packs, dormant ones included"
packs = ["*"]
# No `except`: this is the honest "everything", and it exists so `full` does not have to
# be read as one. Deploying this brings home-automation's ten HA skills back onto every
# harness that accepts them.

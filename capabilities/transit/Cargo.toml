[package]
name = "transit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "HAFAS journey search, split-ticket solver, rail-ticket confirmation extraction, and Trips/Postgres persistence."
publish = false

[lib]
name = "transit"
path = "src/lib.rs"

[[bin]]
name = "transit"
path = "src/main.rs"

# transit-server: async (tokio + axum), the one deliberate exception to
# hafas.rs's sync reqwest::blocking used everywhere else in this crate --
# HTTP serving needs an async runtime, the CLI binary and library do not.
# See dashboard/README.md for why
# this reopens the prior "no server, zero consumers" call (dashboard is
# now the named consumer) instead of just re-adding it unrecorded. No
# tract-onnx -- see hafas.rs's doc comment for why the ONNX delay-prediction
# machinery was deliberately not ported (no model artifact exists in Axon
# yet; it would be dead-weight code).
[[bin]]
name = "transit-server"
path = "src/server.rs"

[dependencies]
# Outbound HTTP goes through one factory: the user-agent, the timeout and the
# connection pool are decided there, not at each call site (libs/sjel-http).
sjel-http = { path = "../../libs/sjel-http" }
sjel-config = { path = "../../libs/sjel-config" }
# The shared shape of "what a reader got out of a file"
# (README.md#schemas-and-dependency-direction). This capability is the second
# consumer that earned the promotion; before it, `document.rs` carried its own
# `Document` struct saying the same thing under other names.
#
# `default-features = false` is deliberate and load-bearing: the default `xberg`
# feature links the crate, and the whole reason `document.rs` drives the xberg
# CLI as a subprocess is to keep a bundled Tesseract and an ONNX runtime out of
# this capability's build. Taking that dependency by promotion would reverse a
# decision made on purpose. See `src/document.rs`, "Shells out to the xberg CLI".
sjel-extraction = { path = "../../libs/extraction", default-features = false }
sjel-server = { path = "../../libs/sjel-server" }
sjel-store = { path = "../../libs/sjel-store" }
route-manifest = { path = "../../libs/route-manifest" }
# Leg times: bahn.de serves naive station-local strings; this turns them into
# UTC instants for the additive departure_utc/arrival_utc fields (PRD X1).
station-time = { path = "../../libs/station-time" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
reqwest = { workspace = true, features = ["json", "gzip", "blocking", "query", "form"] }
thiserror.workspace = true
regex = "1"
pdf-extract = "0.12"
mailparse = "0.16"
html2text = "0.6"
# The database, after PRD Q45 retired Postgres. Bundled so the deployment does
# not depend on whichever SQLite the host ships; upstreams.toml [rusqlite] has
# the measurement that settled it.
rusqlite.workspace = true
# Not `full`: these are the drivers this crate reaches for, verified with a lone
# `cargo check -p <crate> --all-targets`, which is the only build where a missing
# tokio feature is visible (a workspace build unifies them away).
# Two `#[tokio::main]` binaries and six `spawn_blocking` store reads, nothing else.
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
axum.workspace = true
tower-http = { workspace = true, features = ["cors"] }

[dev-dependencies]
# `ServiceExt::oneshot`, so the origin test drives the wired Router with no listener
# and no port. The same pattern capabilities/axon-status already uses.
tower = { workspace = true, features = ["util"] }

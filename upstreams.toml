license = "MIT"
summary = "SQLite fork with async I/O, concurrent writes (BEGIN CONCURRENT/MVCC), and embedded replicas"
why = "Evaluated 2026-10-21 against the live store (274 MB, 107 tables) as the engine for the multi-tenant store and the app's client: it connects in 1.25 ms, passes PRAGMA table discovery over all 107 tables, runs JSON1 json_each predicates with no translation and serves 10 concurrent readers in 43 ms, at byte-level SQLite compatibility. It replaces rusqlite's single-writer limitation, and local embedded mode needs no network, daemon or remote server."


name: Pages

# Publish tracked site inputs; the payload gate rejects private content.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Keep main deployments non-cancellable; obsolete pending runs can coalesce.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: select Pages build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      pages: ${{ steps.plan.outputs.pages }}
    steps:
      - name: Check out Sjel
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Plan and summarize
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun tools/ci-plan.ts --workflow pages.yml --output "$RUNNER_TEMP/pages-plan.json" --github-output "$GITHUB_OUTPUT"

  build:
    name: build the page
    needs: plan
    if: needs.plan.outputs.pages == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out Sjel
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      # Path resolution needs an overlay, not enabled capabilities.
      - name: Minimal overlay for path resolution
        run: |
          mkdir -p "$HOME/.sjel-overlay/config"
          cat > "$HOME/.sjel-overlay/config/machine.toml" <<'TOML'
          os = "linux"
          container_runtime = "docker"
          capabilities = []
          TOML

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Reject stale inputs before assembling the site.
      - name: self.json is current
        run: tools/self check

      - name: Assemble the site
        run: website/build

      # website/build runs the gate itself; this makes the refusal a named, visible step.
      - name: Payload hygiene
        run: tools/check-site-payload.sh site

      - name: Configure Pages
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: deploy to Pages
    needs: [plan, build]
    if: needs.plan.outputs.pages == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

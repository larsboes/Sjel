# Feed and mail triage service.
kind        = "process"
name        = "comms"
command     = ["target/release/comms-server"]
build       = ["cargo", "build", "--locked", "--release", "--bin", "comms-server"]
port        = "8083"
links_to    = ["ent"]
imports     = ["rss-atom", "imap-jmap", "youtube-transcript", "hackernews"]
exports     = ["json"]
health_path = "/health"
ready_path  = "/ready"
autostart   = "true"

# Hours since the newest feed arrival before tools/doctor advises or reports stale.
freshness_advise_hours = "12"
freshness_stale_hours  = "24"

# Google OAuth grant shared by Gmail and Calendar (Settings › Accounts).
[[credentials]]
id           = "google-comms"
type         = "google-oauth"
label        = "Google: Gmail and Calendar"
scopes       = ["gmail.modify", "calendar.events"]
env_fallback = "comms.env"
steps = [
  "Google Cloud console → Google Auth Platform → Audience: Publishing status must read In production. A Testing app's tokens expire after 7 days.",
  "Clients → your Desktop client → Download JSON. Google shows a new client's secret only once; if the download is gone, use Add secret.",
  "Drop the JSON file here and press Connect. Allow Gmail and Calendar in the browser (Advanced → Go to Sjel).",
]

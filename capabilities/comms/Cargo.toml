[package]
name = "sjel-comms"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Mail/media pipeline: reviewed Gmail triage plus share-link media ingest (metadata + transcript + summary), Postgres-backed."
publish = false

[lib]
name = "comms"
path = "src/lib.rs"

[[bin]]
name = "comms"
path = "src/main.rs"

# comms-server: async (tokio + axum) HTTP surface consumed by a dashboard
# panel. Mirrors capabilities/scouting's scout-server split -- the CLI (`comms`)
# carries no async runtime, only this bin does. See
# dashboard/README.md.
[[bin]]
name = "comms-server"
path = "src/server/main.rs"

[[bin]]
name = "comms-extraction-eval"
path = "src/extraction_eval_main.rs"

[[bin]]
name = "comms-redaction-eval"
path = "src/redaction_eval_main.rs"

# The frozen-corpus gate for the mail model rung. Makes zero model calls: it
# joins the corpus labels to the verdicts a shadow pass already stored, which is
# what makes the number reproducible.
[[bin]]
name = "comms-mail-model-eval"
path = "src/mail_model_eval_main.rs"

[[bin]]
name = "comms-digest-eval"
path = "src/digest_eval_main.rs"

[dependencies]
# Outbound HTTP goes through one factory: the user-agent, the timeout and the
# connection pool are decided there, not at each call site (libs/sjel-http).
sjel-http = { path = "../../libs/sjel-http" }
sjel-config = { path = "../../libs/sjel-config" }
# The readers this capability used to own, promoted at the second consumer
# (CONTRIBUTING.md#schemas-and-dependency-direction). Default features on: this is the
# consumer that wants the whole ladder, including the PDF rung, so the `xberg`
# dependency moved with the code rather than staying here.
sjel-extraction = { path = "../../libs/extraction" }
sjel-inference = { path = "../../libs/inference" }
sjel-runtime = { path = "../../libs/runtime" }
sjel-server = { path = "../../libs/sjel-server" }
sjel-store = { path = "../../libs/sjel-store" }
sjel-summarize = { path = "../../libs/summarize" }
sjel-pseudonymize = { path = "../../libs/pseudonymize" }
content-item = { path = "../../libs/content-item" }
# The shared machine->vault projection mechanism (PRD Q49). comms declares the
# shape of a saved link; libs/markdown-root does the writing, the containment and
# the ownership check.
markdown-root = { path = "../../libs/markdown-root" }
route-manifest = { path = "../../libs/route-manifest" }
# The `/api/links` body every capability answers alike (libs/links/ISA.md).
sjel-links = { path = "../../libs/links" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
reqwest = { workspace = true, features = ["json", "gzip", "blocking", "query", "form"] }
thiserror.workspace = true
# The database, after PRD Q45 retired Postgres. Bundled so the deployment does not
# depend on whichever SQLite the host ships; upstreams.toml [rusqlite] has the
# measurement that settled it. Blocking, matching reqwest's "blocking" feature --
# the `comms` CLI path carries no async runtime, only comms-server does. The pool
# stays (sjel-store owns it): 43 handlers here call `Store::open`.
rusqlite.workspace = true
# feed_items PK is the sha256 of the canonical URL (store::feed_id). sha2 is
# already in the root workspace's resolved Cargo.lock (transitive today), so this
# reuses a pinned dep rather than hand-rolling SHA-256.
sha2.workspace = true
# Gmail returns message bodies base64url-encoded, and the digest path is the
# first thing here that reads one. Already resolved in the root Cargo.lock
# (transitive today), so naming it reuses a pinned dep rather than hand-rolling
# a decoder -- the same reasoning as sha2 above.
base64 = "0.23"
# comms-server only:
# Not `full`: these are the drivers this crate reaches for, verified with a lone
# `cargo check -p <crate> --all-targets`, which is the only build where a missing
# tokio feature is visible (a workspace build unifies them away).
# `time` for the ingest tickers (`interval`, `interval_at`), `sync` for EXPORT_LOCK's
# `tokio::sync::Mutex`, `net` for the `TcpListener` the server tests bind.
# This list is what comms asks for, not what it resolves to: `sjel-extraction` above is
# taken with its default `xberg` rung on, and that rung declares `tokio = full` for a
# stated reason (libs/extraction/Cargo.toml). So comms still builds tokio with all 19
# features while the other twelve capabilities now land between 11 and 16. Trimming here
# is still worth writing down: it says what this crate would need on its own.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "sync", "net"] }
axum.workspace = true
tower-http = { workspace = true, features = ["cors"] }

[lints]
workspace = true

# bunfig.toml — Bun's config. One section so far, and one reason for it.
#
# Bazel dropped convenience symlinks at the workspace root (bazel-Sjel, bazel-bin, bazel-out,
# bazel-testlogs), and bazel-Sjel pointed at the execroot, which symlinked every source file
# straight back here. `bun test` follows them, so from a checkout that has ever run Bazel it
# discovered all 27 test files twice and reported 54. PRD Q44 retired Bazel on 2026-08-25;
# this stays because the symlinks it left on existing checkouts do not go away with it.
#
# Double-counting was the visible half. The damaging half was that loading a test module
# under two paths broke child-process spawning for the whole run: every execFileSync whose
# child wrote to stdout failed with status 1 and an empty stderr, while a child that wrote
# nothing still succeeded. tools/lib/demo-endpoints.test.ts calls `tools/capability.sh
# registry` at collection time, so it died there — and the run still printed "0 fail",
# because an unhandled error between tests is not a failed test. 385 tests passed where 391
# exist; the six that never ran were not named anywhere.
#
# CI never saw any of this. The bun-tests job runs on a fresh checkout, where no such
# symlinks exist to follow — which is exactly why this could sit in a working tree for as
# long as it did while main stayed green. It is a local-only fault, and a local gate that is
# red for a reason nobody can act on is a gate people stop reading.
#
# Anchored `bazel-*/**`, not `**/bazel-*/**`: the convenience symlinks live only at the
# workspace root, and .gitignore already anchors its own `/bazel-*` for the same reason —
# unanchored, that pattern swallowed real directories elsewhere in the tree.
#
# This deliberately does NOT list which directories hold tests. The one rootward `bun test`
# is the point (Sjel#116): a test file added anywhere is gated by existing, and the moment
# this file starts naming directories, a new test's coverage depends on someone remembering
# to come here.
#
# Third-party pi package tests use their own runners. Keep them outside Bun's discovery.
# Optional upstream packages are installed by Pi and are not tested in this checkout.
# ---- the [install] hold is deliberately NOT here ---------------------------------------------
#
# Bun reads bunfig.toml from the directory it is invoked in and does NOT walk up to a parent —
# measured on 1.4.2 on 2026-09-22, an install run from dashboard/ ignores this file entirely.
# This repository has no root package.json, so nothing installs from here, and an
# `[install] minimumReleaseAge` written into this file would be a control that reads as present
# and gates nothing: the shape CONTRIBUTING.md#patch-first describes as a hold guarding a door that was
# already open.
#
# The npm-only 24h hold (Q109) therefore lives in the two trees that actually resolve
# dependencies. dashboard/bunfig.toml carries the reasoning; capabilities/soundscape/ui/bunfig.toml
# points at it; tools/check-bun-install-policy.sh derives the set from the committed lockfiles
# rather than listing it, so a third tree cannot join without its own copy.

[test]
pathIgnorePatterns = ["bazel-*/*", "Packs/*/pi-packages/**", "capabilities/comms/clipper/**"]
# Builds sjel-cli once before collection; tools/lib/sjel-cli-preload.ts says why.
preload = ["./tools/lib/sjel-cli-preload.ts"]

[package]
name = "tauri-plugin-device-identity"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
license = "AGPL-3.0-only"
links = "tauri-plugin-device-identity"
description = "Native iOS Keychain-backed Ed25519 identity for Sjel device pairing."
publish = false

[lib]
name = "tauri_plugin_device_identity"
crate-type = ["rlib", "cdylib", "staticlib"]

[build-dependencies]
tauri-plugin = { version = "2.6.3", features = ["build"] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tauri = { version = "2.11.3" }

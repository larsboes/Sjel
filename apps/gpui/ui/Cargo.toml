[package]
name = "sjel-gpui-ui"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-only"
description = "Shared GPUI design system, tokens, and primitives for Sjel desktop and mobile"

[features]
native-maps = ["dep:maplibre_native", "dep:metal"]
# Screens drawn by NSH: UIKit views on the phone, GPUI Fast on the Mac (docs/plans/gpui.md §11).
nsh = ["dep:nsh-core", "dep:nsh-base"]

[dependencies]
sjel-gpui-core.workspace = true
gpui-kit.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
futures.workspace = true
tokio = { workspace = true, features = ["sync"] }
# The VT parser and grid model behind ui/src/terminal.rs. See its upstreams.toml row.
alacritty_terminal = "0.26"
image = { version = "=0.25.10", default-features = false, features = ["png"] }
mermaid-rs-renderer = { version = "=0.3.1", default-features = false }
zeroize.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std", "CFCGTypes", "CFData"] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["std", "CGAffineTransform", "CGBase", "CGBitmapContext", "CGColorSpace", "CGContext", "CGDataProvider", "CGGeometry", "CGImage", "CGPDFDocument", "CGPDFPage"] }

[target.'cfg(target_os = "macos")'.dependencies]
maplibre_native = { version = "=0.10.0", default-features = false, features = ["metal"], optional = true }
metal = { version = "=0.33.0", optional = true }

[[example]]
name = "native-map"
required-features = ["native-maps"]

[dependencies.nsh-core]
git = "https://github.com/longbridge/nsh"
rev = "1894697155"
optional = true

[dependencies.nsh-base]
git = "https://github.com/longbridge/nsh"
rev = "1894697155"
optional = true

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
nsh-engine = { git = "https://github.com/longbridge/nsh", rev = "1894697155", default-features = false }
nsh-testing = { git = "https://github.com/longbridge/nsh", rev = "1894697155", default-features = false }
# Keeps `Repo` off this machine's real sjel.db in the Projects window tests (core's Cargo.toml).
sjel-gpui-core = { workspace = true, features = ["test-support"] }

[lints]
workspace = true

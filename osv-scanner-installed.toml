# installed here that depends on zip:
#
#   * tauri-cli 2.12.2, src/mobile/android/mod.rs:561 — `zip::ZipArchive::new(Cursor::new(body))`
#     then `zip.extract(extract_path)`, where `body` is the HTTP response from CMDLINE_TOOLS_URL
#     (dl.google.com over TLS, read under a 200 MB limit). 2.12.3 still calls it. This is the one
#     caller in anything installed here that reaches the affected API, and it runs only from an
#     Android command, whose environment setup downloads the Android command-line tools.
#     dashboard/src-tauri/gen/ holds `apple` and `schemas` and no `android`, so nothing in this
#     repository has ever run it.
#   * tauri-bundler 2.10.2 (tauri-cli 2.12.2's pin): the only reader is `extract_zip` in
#     src/utils/http_utils.rs, which is `#[allow(dead_code)]` and hand-rolls the walk —
#     `by_index`, `enclosed_name()`, then `File::create` + `write_all`. It applies no Unix mode
#     and creates no symlink, so 0367 and 0369 have nothing to act on there, and calling
#     `enclosed_name()` first is the defence 0368 describes the absence of. Its other use of zip
#     is `ZipWriter`, writing the updater archive.
#   * xberg 1.3.9 and 1.3.10, src/extraction/docx/parser.rs:2227 — `ZipArchive::new` over a
#     `Cursor` on the caller's bytes, then `by_name` + `read_to_string` under
#     MAX_UNCOMPRESSED_FILE_SIZE. `extract()`, `ZipStreamReader`, `unix_mode` and `chmod` appear
#     nowhere in the crate, so transit handing the body of `POST /api/tickets/extract` to the
#     xberg CLI — an attacker's .docx is a zip — does not reach the affected API.
#
# Installing the available tauri-cli 2.12.3 drops the 2.4.2 instance but still ships 8.0.0, and
# xberg-cli 1.3.10 still ships 8.6.0, so no install clears these IDs. Ends when tauri-cli or
# xberg-cli publishes against zip >= 9.0.0.
[[IgnoredVulns]]
id = "RUSTSEC-2026-0367"
ignoreUntil = 2027-01-01
reason = "SUID/SGID bits preserved during ZIP extraction, a privilege-escalation path fixed in 9.0.0 (CVSS 7.3, AV:L/AC:L/PR:L/UI:R, C:H/I:H/A:H). Reach: the `tauri android` command-line-tools extraction above, and the archive would have to carry SUID/SGID entries, so the source (dl.google.com over TLS) must be hostile or MITM'd. tauri-bundler's own reader applies no Unix mode at all. Ends with the zip version."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0368"
ignoreUntil = 2027-01-01
reason = "`ZipArchive::extract` creates symbolic links whose targets are outside the destination directory, fixed in 9.0.0 (osv names no CVSS). Same reach as RUSTSEC-2026-0367, through the same `tauri android` call. The nearest other reader, tauri-bundler's dead `extract_zip`, calls `enclosed_name()` before writing and creates no symlink, so it is not an affected caller. Ends with the zip version."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0369"
ignoreUntil = 2027-01-01
reason = "`ZipStreamReader::extract` and `ZipArchive::extract` apply Unix permissions through symlinks without confining the target, fixed in 9.0.0 (CVSS 9.1, AV:N/AC:L/PR:N/UI:N, I:H/A:H). Same reach as RUSTSEC-2026-0368, and the highest score in this file: the rating assumes an unauthenticated network caller can supply the archive, which here means a hostile or compromised dl.google.com or a MITM on that download — not a caller of Sjel, since the only entry point is the `tauri android` toolchain fetch. Ends with the zip version, or by not using `tauri android` on this machine at all."


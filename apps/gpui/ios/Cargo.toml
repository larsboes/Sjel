[package]
name = "sjel-gpui-ios"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-only"
description = "Sjel phone application with NSH screens inside a UIKit host"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
sjel-gpui-core.workspace = true
# Native UIKit screens through NSH (docs/plans/gpui.md §11).
sjel-gpui-ui = { workspace = true, default-features = false, features = ["nsh"] }
device-auth = { path = "../../../crates/device-auth" }
# `SJEL_DAY` names the calendar day a screenshot opens on (src/lib.rs, `launch_day`).
chrono.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["time"] }

[target.'cfg(target_os = "ios")'.dependencies.nsh-platform-ios]
git = "https://github.com/longbridge/nsh"
rev = "1894697155"
default-features = false

[target.'cfg(target_os = "ios")'.dependencies.objc2]
version = "0.6.5"

[target.'cfg(target_os = "ios")'.dependencies.objc2-ui-kit]
version = "0.3.2"
default-features = false
features = ["UIView", "UIResponder", "objc2-core-foundation"]

[dependencies.nsh-base]
git = "https://github.com/longbridge/nsh"
rev = "1894697155"

[lints]
workspace = true

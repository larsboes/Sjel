# Backup contract for the Obsidian vault.
kind = "data"
name = "knowledge-base"

# Relative to [capability.knowledge-base] backup_source_root in the overlay's machine.toml.
backup_paths = ["Knowledge-Base"]

# Single-line array excluding plugin symlinks and build-cache symlinks.
backup_exclude = [".obsidian/plugin-backups", "Projects/Bachelor-Thesis/Kolloquium/Assets/revision-build/node_modules"]

backup_target      = "backup-target"
backup_retain      = "2"
backup_advise_days = "1"
backup_stale_days  = "2"

# Traveller profile: constraints, ranking weights, discount cards, and provenance.
kind           = "process"
name           = "traveler"
command        = ["target/release/traveler-server"]
build          = ["cargo", "build", "--locked", "--release", "--bin", "traveler-server"]
port           = "8096"
health_path    = "/health"
ready_path     = "/ready"
proxy_api_only = "true"
autostart      = "true"

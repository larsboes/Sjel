# dashboard — the spine's shell, so this manifest sits at the repo root rather than
# under capabilities/ and is always in the registry (README.md#three-architectural-nouns: the spine is
# what exists on a fresh machine after the minimal install). Shape:
# schemas/service.toml.example.
#
# `bun run dev` — but NOT supervised any more. See `autostart` below.
#
# The shell is served by sjel-status from the bundle `build` produces
# (`capabilities/sjel-status/src/proxy.rs`). What that took was not a swap: every API call in
# the SPA is a relative fetch, and the proxy that mapped `/comms/...` onto a port existed only
# in Vite's dev server — `vite.config.ts` builds it when `command === "serve"` and `preview`
# declares none, so the built bundle had never had a working API path in any mode.
#
# Measured 2026-08-29: supervising the dev server cost 95.5 MB across node, esbuild and bun,
# against 24.9 MB for all three Rust servers combined. sjel-status already had to stay up.
#
# This command stays because hot reload is worth having on the machine you edit on. It is now
# a thing you start when you want it, on this port, alongside the always-on shell on
# sjel-status'"'"' — two modes, one of them supervised.
kind        = "process"
name        = "dashboard"
command     = ["bun", "run", "dev"]
workdir     = "dashboard"
port        = "47117"
health_path = "/"
# false since 2026-08-29. The shell no longer needs a process of its own; this is the
# hot-reload mode, started by hand for an editing session:
#   tools/service-runner.sh start dashboard
autostart   = "false"

# The bundle sjel-status serves, and the command that makes it. Declared together on purpose:
# `build_output` alone is inert — tools/service-runner.sh's `maybe_build` returns early when no
# build is declared — so it would have been a field that documented an intention nothing acted on.
#
# `bun run build` type-checks before bundling (svelte-check, then vite build), which is why it is
# the whole command and not just `vite build`: a shell that compiles but does not type-check is a
# shell whose next change breaks it silently.
build        = ["bun", "run", "build"]
build_output = "dashboard/dist"

# The shell asks sjel-status what is enabled and what is up, and routes start requests
# through it. Declared for ordering and for the manifest-integrity gate.
requires = ["sjel-status"]

# macmon is deliberately NOT in `requires`, and no longer needs a `sidecars` exemption
# either — it is capabilities/macmon now, enabled per machine like anything else.
#
# Not `requires` because the Systems page degrades to "no metrics" without it rather than
# failing, and macmon reads Apple Silicon counters that do not exist on any other host. A
# hard edge would turn a degradable dependency into a startup failure everywhere the
# dashboard runs and macmon cannot — the same trade capabilities/punctuality/service.toml
# documents refusing on transit's behalf.
#
# The old `sidecars = ["macmon"]` line lived here so doctor's orphan check would skip a
# hand-written com.axon.macmon unit (Axon#65). It skipped the unit's CONTENT too: port and
# sampling interval sat in an untracked file, and a machine rebuild would have lost them
# with the gate still green. A manifest costs less than the exception did.

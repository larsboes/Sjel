[package]
name = "scouting"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Generic opportunity-discovery pipeline (events/scholarships/etc): scrape, embed, score against an interest profile, rank."
publish = false

[lib]
name = "scouting"
path = "src/lib.rs"

[[bin]]
name = "scout"
path = "src/main.rs"

# scout-server: async (tokio + axum), reopens the prior "no HTTP server,
# zero consumers" call now that dashboard is a named consumer — see
# dashboard/README.md.
[[bin]]
name = "scout-server"
path = "src/server.rs"

[dependencies]
# Outbound HTTP goes through one factory: the user-agent, the timeout and the
# connection pool are decided there, not at each call site (libs/sjel-http).
sjel-http = { path = "../../libs/sjel-http" }
sjel-config = { path = "../../libs/sjel-config" }
sjel-inference = { path = "../../libs/inference" }
sjel-server = { path = "../../libs/sjel-server" }
sjel-store = { path = "../../libs/sjel-store" }
# The data-class vocabulary and its fail-closed default. Named here rather than
# spelled out: a second crate deciding what `c1` means is what §6.1 forbids.
content-item = { path = "../../libs/content-item" }
markdown-root = { path = "../../libs/markdown-root" }
route-manifest = { path = "../../libs/route-manifest" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
reqwest = { workspace = true, features = ["json", "gzip", "blocking"] }
thiserror.workspace = true
# The database, after PRD Q45 retired Postgres. Bundled so the deployment does not
# depend on whichever SQLite the host ships; upstreams.toml [rusqlite] has the
# measurement that settled it. Blocking, matching reqwest's "blocking" feature
# above -- scout's CLI path carries no async runtime, only scout-server does.
rusqlite.workspace = true
# One-directional: scouting depends on transit, never the reverse (no cycle).
# adapters/transit_fare.rs implements SourceAdapter using transit::hafas +
# transit::store -- same "implement SourceAdapter, add one match-arm in
# main.rs" extension pattern every other adapter already follows (see
# README's "Extending it"), just sourced from a sibling capability's crate
# instead of a new HTTP client written inline.
transit = { version = "0.1.0", path = "../transit" }
# Not `full`: these are the drivers this crate reaches for, verified with a lone
# `cargo check -p <crate> --all-targets`, which is the only build where a missing
# tokio feature is visible (a workspace build unifies them away).
# Two `#[tokio::main]` binaries and seven `spawn_blocking` store reads, nothing else.
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
axum.workspace = true
tower-http = { workspace = true, features = ["cors"] }

[dev-dependencies]
# `ServiceExt::oneshot`, so the origin test drives the wired Router with no listener
# and no port. The same pattern capabilities/sjel-status already uses.
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true

[package]
name = "assistant"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Local-first assistant inference endpoint for the Sjel dashboard."
publish = false

[[bin]]
name = "assistant-server"
path = "src/main.rs"

[dependencies]
axum.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net"] }
sjel-config = { path = "../../libs/sjel-config" }
sjel-inference = { path = "../../libs/inference" }
sjel-server = { path = "../../libs/sjel-server" }
route-manifest = { path = "../../libs/route-manifest" }
schemars = "1.2.2"

[lints]
workspace = true

[package]
name = "sjel-gpui-core"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-only"
description = "What the Mac and iOS GPUI apps share: the data layer, destinations and the shell client"

[features]
# Marks a build whose tests must not reach this machine's real data. `Repo::local_db_path` answers
# `None` when it is on. It exists because `cfg(test)` marks only the crate that declares the test:
# the app's window tests would otherwise read this machine's `axon.db` through the shared `Repo`.
# The app enables it from its dev-dependencies.
test-support = []

[dependencies]
base64 = "0.22"
chrono.workspace = true
# The axon-device-auth/v1 protocol and the pinned TLS client for the LAN listener, shared with
# the devices capability.
device-auth = { path = "../../../crates/device-auth", features = ["pinned-tls"] }
futures.workspace = true
# rustls: the pinned client for the LAN listener (device.rs) needs a TLS backend. http2: that
# client offers h2 by ALPN (`device_auth::pinned_tls`), and the listener accepts it.
reqwest = { workspace = true, features = ["blocking", "rustls", "http2", "stream"] }
serde.workspace = true
serde_json.workspace = true
# The digest the Mac's mirror manifest names, checked before a fetched copy replaces the one on
# disk (src/mirror.rs). Already in the lock through `device-auth`.
sha2 = "0.11"
# The matrix behind the pairing code on the Mac's Setup page. Default features are off because
# both of them (`image`, `svg`) exist to write a file, and this page paints the modules itself.
qrcode = { version = "0.14", default-features = false }
# `rt-multi-thread`: a token read through `/usr/bin/security` blocks its worker, so a second
# worker keeps an unrelated request from waiting on it (src/shell.rs).
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "time", "net", "sync"] }
libsql.workspace = true
sjel-config = { path = "../../../crates/sjel-config" }
# `name_key`, the one rule for comparing a person's name with the register's rows
# (src/places.rs). Shared rather than copied: places, trips and comms all key their decisions by it.
sjel-links = { path = "../../../crates/links" }
sjel-clip-socket = { path = "../../../crates/clip-socket" }
sjel-credentials = { path = "../../../crates/sjel-credentials" }
agent-api = { path = "../../../crates/agent-api" }
assistant-api = { path = "../../../crates/assistant-api" }
calendar-api = { path = "../../../crates/calendar-api" }
documents-api = { path = "../../../crates/documents-api" }
devices-api = { path = "../../../crates/devices-api" }
distribution-api = { path = "../../../crates/distribution-api" }
feed-api = { path = "../../../crates/feed-api" }
entities-api = { path = "../../../crates/entities-api" }
finance-api = { path = "../../../crates/finance-api" }
import-api = { path = "../../../crates/import-api" }
interior-api = { path = "../../../crates/interior-api" }
inventory-api = { path = "../../../crates/inventory-api" }
media-api = { path = "../../../crates/media-api" }
operator-profile-api = { path = "../../../crates/operator-profile-api" }
places-api = { path = "../../../crates/places-api" }
projects-api = { path = "../../../crates/projects-api" }
punctuality-api = { path = "../../../crates/punctuality-api" }
scouting-api = { path = "../../../crates/scouting-api" }
setup-api = { path = "../../../crates/setup-api" }
software-api = { path = "../../../crates/software-api" }
soundscape-api = { path = "../../../crates/soundscape-api" }
status-api = { path = "../../../crates/status-api" }
traveler-api = { path = "../../../crates/traveler-api" }
trips-api = { path = "../../../crates/trips-api" }
transit-api = { path = "../../../crates/transit-api" }
web-links-api = { path = "../../../crates/web-links-api" }
zeroize.workspace = true


[lints]
workspace = true

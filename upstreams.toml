license = "Apache-2.0"
summary = "VT parser and grid model the app's terminal view draws from"
why = "The VT emulator and grid model the app's terminal view draws from -- `vte::ansi::Processor::advance` feeds bytes into a `Term` that holds the screen, where writing an emulator is years of escape sequences with a near-miss showing as a screen that is almost right. Cost measured before adopting: 0.26.0 resolves fifteen crates and links pty helpers the client never calls, and a program that asks for red still means red, so the ANSI 16 are fixed in ui/src/terminal.rs while the window's colours come from the app's palette."

[octet]
url = "https://github.com/skaft-software/octet"
verdict = "inspiration"
license = "MIT"
summary = "Native Rust terminal coding agent, candidate harness and idea source for the Sjel agent"
why = "Audited 2026-11-07 against v0.10.0, with the method in `Packs/security/skills/vendor-audit`. The strengths are real and measurable: 338 lock entries with zero git dependencies and zero `[patch]` sections, both `build.rs` inert, CI builds `--locked`, cosign-signs every artifact and verifies its own signatures before upload with the certificate identity pinned to the workflow commit, every `uses:` SHA-pinned, no `postinstall`, and no telemetry of any kind. The verdict is not adopt because of three findings: the effect broker -- canonical intent hashing, single-use grants, fail-closed without a human, model text never counted as consent -- ships off (`cli.rs` falls through to `EffectPolicy::UnsafeHost`, which `effect.rs` maps to allow), so plain `octet` prompts for nothing and leaves the file tools unconfined; the updater pipes a fetched shell script to `sh`, outside the Sigstore chain that protects the binary; and credentials are plaintext files rather than keychain items. Extensions have no isolation and the Pi adapter declares `filesystem = \"unrestricted\"` with `builtin_tool_overrides` including `bash`. A contained run the same day measured the boundary rather than the program: direct egress refused in 60 ms, the proxy admitting only the provider's hosts, and the profile refusing a real read of the gcloud application-default credentials."
revisit = "The runtime trial is complete; running Octet is declined under the audited defaults. Re-evaluate only after upstream changes address the effect-policy default, updater verification, credential storage and configuration blockers. Mine selected designs into existing crates/sjel-agent interfaces only for a concrete consumer; research/agent-upstream-integration.md owns that integration boundary. The contained trial refused its state-directory openat walk, and setup --manual-model failed catalog verification both inside and outside containment."

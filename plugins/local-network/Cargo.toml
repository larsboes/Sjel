[package]
name = "tauri-plugin-local-network"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
license = "AGPL-3.0-only"
links = "tauri-plugin-local-network"
description = "Bonjour discovery of an Sjel node on the local network, for the Sjel iOS app."
publish = false

[lib]
name = "tauri_plugin_local_network"
crate-type = ["rlib", "cdylib", "staticlib"]

[build-dependencies]
tauri-plugin = { version = "2.6.3", features = ["build"] }

[dependencies]
tauri = { version = "2.11.3" }

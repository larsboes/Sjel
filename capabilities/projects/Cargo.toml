[package]
name = "sjel-projects"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Projects, tasks and project notes in the shared store, rendered to markdown on every write."
publish = false

[lib]
name = "projects"
path = "src/lib.rs"

[[bin]]
name = "projects-server"
path = "src/server.rs"

[[bin]]
name = "projects"
path = "src/cli.rs"

[dependencies]
axum.workspace = true
chrono.workspace = true
content-item = { path = "../../libs/content-item" }
markdown-root = { path = "../../libs/markdown-root" }
route-manifest = { path = "../../libs/route-manifest" }
rusqlite.workspace = true
schemars = "1.2.2"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sjel-config = { path = "../../libs/sjel-config" }
sjel-server = { path = "../../libs/sjel-server" }
sjel-store = { path = "../../libs/sjel-store" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net"] }

[lints]
workspace = true

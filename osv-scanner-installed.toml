# ── Found 2026-10-23, and what each one's fix would take ──────────────────────────
#
# Two findings arrived with the day's report. One was moved and one cannot be:
# `@mariozechner/snap-happy` was reinstalled, which re-resolved ip-address 10.7.3 to 10.7.4 in
# its subtree; the copy below is npm's own, and npm 12.2.1 still bundles it.
#
# `ctutils` is the same shape as the certificate-trust entries above: xberg-cli 1.3.10 is the
# newest release on crates.io (checked 2026-10-23), and `cargo install --locked` reads the
# Cargo.lock published inside the crate, so nothing here can move a transitive version.
#
# Reach for both is a build or extraction tool on this machine, not a listener: neither npm's
# dependency resolution nor xberg's local extractor accepts a request from the network.
[[IgnoredVulns]]
id = "RUSTSEC-2026-0385"
ignoreUntil = 2027-01-01
reason = "ctutils 0.4.3 generates branches in its Choice mask const fns on widely used platforms, and its u128 comparisons branch on 32-bit targets, so a secret value can leak through a covert channel; fixed in 0.4.4. Reach: xberg-cli 1.3.10's published Cargo.lock, the newest release on crates.io, so `cargo install --locked` cannot move it. xberg is a local document extractor, so what is exposed is a comparison inside a build tool, and which comparisons reach the vulnerable const fns is not established here. Ends when xberg-cli republishes against ctutils >= 0.4.4."

[[IgnoredVulns]]
id = "GHSA-rxp7-6hxx-x8q5"
ignoreUntil = 2027-01-01
reason = "ip-address <= 10.7.3 strips zone identifiers with /%.*$/ before its 45-character limit, so a long run of `%` characters costs quadratic time (3.9 s of synchronous work for 100,000 of them) and blocks the event loop while rejecting the input. Reach: `npm@12.2.1` (the newest release) > make-fetch-happen > @npmcli/agent > socks-proxy-agent > socks > ip-address 10.7.2, inside npm's own bundled tree; nothing installs that copy separately. Ends when npm bundles ip-address >= 10.7.4, which is npm's call and not this machine's. The snap-happy subtree was re-resolved off 10.7.3 on 2026-10-23."


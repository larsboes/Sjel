# Exceptions for tools/audit's second osv-scanner pass over software installed outside this checkout.
# Each entry states the reach and when acceptance ends; delete entries listed under unused ignores.

# Bundled inside npm's own dependency tree.
[[IgnoredVulns]]
id = "GHSA-rfgv-xxqx-mfg5"
ignoreUntil = 2027-01-01
reason = "undici 6.28.0, fixed in 6.28.1: denial of service through an unrequested WebSocket subprotocol. Reach: `npm@11.20.0` > node-gyp > undici, Homebrew's bundled npm, which is the npm that runs. node-gyp imports `Agent`, `EnvHttpProxyAgent`, `RetryAgent` and `fetch` from undici and never `WebSocket`, which is the whole of this advisory. Ends when the node formula ships npm 12."

[[IgnoredVulns]]
id = "GHSA-3wwx-pv8p-q78v"
ignoreUntil = 2027-01-01
reason = "undici 6.28.0, fixed in 6.28.1: denial of service through an unhandled error in WebSocket permessage-deflate decompression. Same copy and same end as GHSA-rfgv-xxqx-mfg5, and the same narrowing applies: node-gyp opens no WebSocket, so the decompression path is never entered."

[[IgnoredVulns]]
id = "GHSA-r53p-7pc4-xj5r"
ignoreUntil = 2027-01-01
reason = "undici 6.28.0, fixed in 6.28.1: downstream response splitting through the retry interceptor. This is the one of the three that node-gyp could reach — `lib/download.js` imports `RetryAgent` — so the exposure is real but narrow: node-gyp downloads Node headers only when it builds a native addon, from nodejs.org over HTTPS, and response splitting needs a hostile or broken upstream on that path. Ends when the node formula ships npm 12."

[[IgnoredVulns]]
id = "GHSA-xjj6-f33q-929c"
ignoreUntil = 2027-01-01
reason = "undici 6.29.0, fixed in 6.29.1: `fetch()` aborts the Node.js process when a server answers with more than five content codings and closes before the body. Reach: `npm@11.20.0` (Homebrew's bundled npm) > node-gyp > undici 6.28.0, which the advisory's range below 6.29.1 also covers, npm's own dependency tree, so what is exposed is a registry or tarball host's response to npm itself — the one undici path this machine actually exercises, which is why it is dated rather than dismissed. Nothing here installs that copy separately; the only fix is a newer node-gyp, which is npm's call. Ends when npm ships undici >= 6.29.1."

[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
ignoreUntil = 2027-01-01
reason = "minimatch 10.2.5, fixed in 11.0.1: an attacker-controlled glob pattern grows quadratically during preprocessing. Reach: `npm@11.20.0` (Homebrew's bundled npm) > @npmcli/map-workspaces and @tufjs/models > minimatch. npm reads the patterns from this machine's own package.json files and from signed TUF metadata, so no untrusted pattern reaches it. npm@12.2.1, the newest release, still requires minimatch ^10.2.5. The repository's Bun lockfiles override to ^11.0.1 instead. Ends when npm ships minimatch 11."

[[IgnoredVulns]]
id = "GHSA-3g3m-2fjr-6pw4"
ignoreUntil = 2027-01-01
reason = "glob 13.0.6, fixed in 14.0.2: an aborted async walk keeps reading directories after it rejects. Reach: `npm@11.20.0` (Homebrew's bundled npm) > @npmcli/map-workspaces and node-gyp > glob. The cost is extra local filesystem reads after npm aborts a walk of this machine's own tree; no remote input starts or aborts the walk. npm@12.2.1 still requires glob ^13.0.6. Ends when npm ships glob 14."

[[IgnoredVulns]]
id = "GHSA-4qv8-2p9j-2685"
ignoreUntil = 2027-01-01
reason = "undici 6.29.0, fixed in 6.29.1: unbounded memory in the `EventSource` parser when a peer sends many tiny `data:` fields with no blank separator. Same reach and same end as GHSA-xjj6-f33q-929c, with one narrowing that matters: npm's registry traffic uses `fetch()`, not `EventSource`, so nothing npm does on this machine reaches the parser. Dated anyway because it rides the same pin, and the next npm move is what ends both."

[[IgnoredVulns]]
id = "GHSA-6j4f-fj2g-mc7p"
ignoreUntil = 2027-01-01
reason = "brace-expansion 5.0.9 denial of service via uncontrolled recursion in parseCommaParts (stack exhaustion), fixed in 5.0.10. Reach: `npm@12.2.0` > minimatch > brace-expansion. The pattern being expanded would have to come from something npm globs, so the exposure is a pathological path or glob reaching the npm CLI. Ends when npm ships brace-expansion >= 5.0.10, or when `tools/updates` re-resolves npm itself, whichever comes first."

[[IgnoredVulns]]

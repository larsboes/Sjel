# bunfig.toml for the soundscape UI, the one tree in this repository that resolves its own
# npm dependencies. Bun does not read a parent bunfig.toml, so the install settings live here.
#
# minimumReleaseAge holds a new npm release for 24 hours before `bun add` or a lockfile
# regeneration may resolve it. `bun install --frozen-lockfile` is not held.
# The Socket scanner checks each package for malware at install time. It is network-backed.
# tools/check-bun-install-policy.sh fails if this file or either block goes missing.
[install]
minimumReleaseAge = 86400

[install.security]
scanner = "@socketsecurity/bun-security-scanner"

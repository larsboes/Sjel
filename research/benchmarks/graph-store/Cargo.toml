[package]
name = "graph-store-spike"
version = "0.0.0"
edition = "2024"
publish = false

# Standalone: keeps grafeo out of the workspace lock until upstreams.toml adopts it.
[workspace]

[dependencies]
libsql = { version = "=0.10.0", default-features = false, features = ["core"] }
grafeo = { version = "=0.6.0", default-features = false, features = ["cypher", "grafeo-file"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros"] }

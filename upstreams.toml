license = "Apache-2.0"
summary = "Embedded Rust graph database (LPG/RDF, Cypher/GQL, HNSW); measured against SQL edge tables, no gap found"
why = "Measured 2026-10-24 on a 37,200-node repository graph against libSQL edge tables: both answered all 60 impact and connection questions exactly, an in-memory BFS over the same edges was 4x faster than Grafeo, bounded 3-hop queries were equal and reopen cost 81-96 ms against 0.5 ms (research/benchmarks/graph-store/). Rejected because a second database buys speed the code already has; revisit for graph algorithms, hybrid graph-plus-vector plans, or a graph too large for in-memory adjacency."


# projects: projects, tasks and project notes. The shared store is canonical; every write
# re-renders the record as markdown under <overlay>/data/projects/ (ISA.md F14).
# 8103: the live registry served 8082-8102 when this was written.
kind           = "process"
name           = "projects"
command        = ["target/release/projects-server"]
build          = ["cargo", "build", "--locked", "--release", "--bin", "projects-server"]
port           = "8103"
health_path    = "/health"
ready_path     = "/ready"
proxy_api_only = "true"
backup_paths   = ["data/projects"]

# The records are rows in the shared store, which capabilities/store backs up daily. This
# contract exists for the attachments: they are files, not rows, and nothing else copies
# them. 1.0 GB on 2026-10-19 and rarely changed, so 7 tarballs and a weekly cadence, not
# the default 14. Before this line, backup.sh refused the capability ("no backup_target").
backup_target      = "backup-target"
backup_retain      = "7"
backup_advise_days = "7"
backup_stale_days  = "14"

# Opportunity and trip-destination scouting service.
kind        = "process"
name        = "scouting"
command     = ["target/release/scout-server"]
build       = ["cargo", "build", "--locked", "--release", "--bin", "scout-server"]
port        = "8084"
health_path = "/health"
ready_path  = "/ready"
proxy_extra = ["/discover"]

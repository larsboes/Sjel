why = "the generic connection pool behind [r2d2_sqlite] below, and behind [r2d2_postgres] before it -- it outlived the database it was adopted for, which is the point of it being generic. Adopted for the second half of the Store::open problem recorded in libs/sjel-store/README.md: libs/sjel-store removed the migration from every open, but every open still built a fresh Postgres session. Measured against the live database rather than inferred: Client::connect runs 32-39 ms, a pooled open 0.20-0.30 ms. The issue estimated ~50 ms and was high -- the /feed endpoint improved ~21 ms end to end and the rest of its time turns out to scale with response size, not with connections. Chosen over deadpool/bb8 because those are async pools for tokio-postgres, and this repo's data layer is deliberately the SYNC postgres crate driven from spawn_blocking -- capabilities/comms/Cargo.toml states that choice and its reason (the CLI path carries no async runtime, only the server does). Swapping the pool would have meant swapping the client, making 134 call sites async across seven capabilities to solve a connection-reuse problem. Dependency tree is three crates (log, parking_lot, scheduled-thread-pool). Same author as the postgres client itself, which is why the two versions track each other"


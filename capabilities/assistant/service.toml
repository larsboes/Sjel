kind        = "process"
name        = "assistant"
command     = ["target/release/assistant-server"]
build       = ["cargo", "build", "--locked", "--release", "--bin", "assistant-server"]
port        = "8100"
health_path = "/health"
ready_path  = "/ready"
imports     = ["calendar", "projects", "sjel-status", "trips"]
exports     = ["assistant"]

# The dashboard shell proxies /assistant/* to this service. Cloud Ask accepts only an explicitly
# confirmed public prompt through a reviewed HTTPS role, with no history, tools, extensions,
# steering, or caller-supplied instructions; the agent enforces the daily request ledger.

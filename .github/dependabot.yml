# Dependabot — freshness pull requests, replacing renovate.json5 (Q74, 2026-09-02).
# Renovate needed a GitHub App that was never installed: measured 2026-09-02, the repository has
# zero Renovate pull requests and zero Renovate issues over its whole life. Dependabot needs no
# App.
#
# `cooldown:` is written out in EVERY block, and that is the ruling rather than noise. Dependabot
# applies a three-day cooldown to version updates even when `cooldown` is not configured —
# GitHub's own options reference states it — so omitting the key does not mean "no hold", it
# silently reinstates a hold nobody chose. Patch first (CONTRIBUTING.md#patch-first): a hold that needs
# a human to end it is a hold that ends late.
#
# THE VALUE IS NO LONGER THE SAME IN EVERY BLOCK, and that is the change of 2026-09-22 (Q109).
# `default-days: 0` remains the ruling for cargo and github-actions; it is `1` for the two `bun`
# blocks. The three-day default is not what this rules out — a LONG hold is — and the measured
# basis for the split is in dashboard/bunfig.toml, which is where the npm-only hold is configured
# for a human running `bun add`. One sentence of it matters here: a malicious npm publish is
# caught in hours (chalk/debug ~2.5h, Shai-Hulud ~12h, Mini Shai-Hulud / TanStack ~3h), so one
# day is the whole window, while a malicious Cargo crate or a compromised `actions/*` tag is
# close to unheard of and a hold there buys nothing.
#
# This block is the automated path, and it is the one that needed the hold: every pull request
# below is armed to merge itself (Q77), so without it a poisoned publish would reach `main` with
# no human anywhere in the loop. The bunfig hold is not a substitute and does not cover it —
# `bun install --frozen-lockfile` ignores `minimumReleaseAge` by design (measured 2026-09-22 on
# Bun 1.4.2), which is exactly what a Dependabot pull request installs.
#
# `default-days: 0` IS accepted, verified 2026-09-02 on this repository: the config validates and
# Dependabot opened pull requests under it. That was the one open question when this file landed
# — dependabot-core treats 0 as "no cooldown" (Package::ReleaseCooldownOptions defaults every
# window to 0, and Job::CooldownDefinition passes an explicit 0 straight through), while the
# community JSON schema at json.schemastore.org/dependabot-2.0.json declares `default-days`
# minimum 1, and GitHub's own validator is closed. The validator sided with dependabot-core, so
# the `default-days: 1` fallback is not needed. 2026-09-22: the `1` in the two `bun` blocks above
# is NOT that fallback coming back. It is the Q109 hold, chosen on its own reasoning, and the
# blocks that needed no hold still read 0.
#
# The pull requests these open MERGE THEMSELVES once the required checks pass:
# .github/workflows/dependabot-automerge.yml arms `gh pr merge --auto --squash` on each one
# (Q77). Opening them daily and leaving them for a human to notice would have re-created the
# hold this file exists to remove.
#
# Daily, not weekly, for the same reason. A week-long batch is a week of unapplied security
# fixes, and the grouping below is what keeps that from being one pull request per crate.
#
# This file opens VERSION pull requests only. SECURITY updates are a repository setting, not a
# file setting: `gh api --method PUT repos/larsboes/Sjel/automated-security-fixes`. That was run
# on 2026-09-02 and `security_and_analysis.dependabot_security_updates` now reads "enabled";
# this file alone would have left the reactive half switched off.
#
# `bun` is a first-class ecosystem, read from dependabot/dependabot-core upstream: a top-level
# bun/ directory, and bun/lib/dependabot/bun/package_manager.rb declaring ECOSYSTEM = "bun". It
# reads bun.lock directly, so the npm ecosystem is not needed. Both trees are verified present
# beside their package.json: dashboard/bun.lock and capabilities/soundscape/ui/bun.lock.
#
# capabilities/agentbox/Containerfile is deliberately NOT watched. Its only FROM is
# `FROM ${BASE_IMAGE}` over an ARG default, and whether Dependabot resolves that shape is
# unverified — an ecosystem block that may watch nothing is exactly the rot this change removes.
# That base image is a dated Debian snapshot tag, bumped by hand.
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 0
    open-pull-requests-limit: 5
    groups:
      cargo:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "bun"
    directory: "/dashboard"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 1          # 24h — the npm-only hold, Q109. Not 0, and not the 3-day default.
    open-pull-requests-limit: 3
    groups:
      dashboard:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # `typescript` is held on 6.x here, for the same reason it is in the soundscape block
    # below: svelte-check 4.7.6 declares `typescript: ^5.0.0 || ^6.0.0`, so 7 in the primary
    # slot fails `bun run check` -- the failure #204 was refused for, where svelte-check names
    # the two-version setup as its own fix. Since 2026-10-01 this tree runs that setup too:
    # `@typescript/native` (npm:typescript@^7.0.2) beside `typescript` ~6.0.0, driven by
    # `--tsgo` in the check script.
    #
    # This became correct on 2026-09-30 and was not before. The tree moved to 6.0.3 in
    # d25a7353, so its next major is a 7 rather than a 6; a blanket major ignore would have
    # blocked that legitimate 5.9 -> 6 step had it been here a day earlier. Only majors are
    # ignored: 6.x patches still arrive.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "bun"
    directory: "/capabilities/soundscape/ui"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 1          # 24h — the npm-only hold, Q109. See the header.
    open-pull-requests-limit: 3
    groups:
      soundscape-ui:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # `typescript` is held on 6.x in this tree, and it is the one dependency here whose major
    # must not arrive. This is not a pin and not a cooldown -- nothing here ever ends in a
    # human's hands. The tree runs TWO TypeScripts deliberately: `typescript` ~6.0.0 is the
    # one svelte-check and @sveltejs/kit resolve against, and `@typescript/native`
    # (npm:typescript@^7.0.2) is the 7.x binary that the check script's `--tsgo` flag drives.
    #
    # Both peer ranges exclude 7 from the primary slot, which is the whole measurement:
    # svelte-check 4.7.6 declares `typescript: ^5.0.0 || ^6.0.0`, @sveltejs/kit 2.70.3 declares
    # `^5.3.3 || ^6.0.0`, and svelte-check refuses to start with 7 there -- naming the
    # two-version setup as its own fix. Measured 2026-09-30 on #204, which moved the primary
    # to ~7.0.2: of the seven open dependabot pull requests that day it was the only one whose
    # failure was its own doing rather than a stale merge ref, failing `bun run check` with
    # "TypeScript 7 support currently requires both TypeScript 7 and TypeScript 6".
    #
    # Only majors are ignored, so 6.x patches still arrive and the 7.x alias is unaffected.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 0
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

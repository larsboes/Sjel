# Every host binary Axon assumes is already installed on the machine. No entry, no check.
#
# WHY THIS IS NOT upstreams.toml. upstreams.toml is "external CODE Axon builds or consumes,"
# with an audit verdict + license (CONTRIBUTING.md#dependency-verdicts-and-provenance). This file is a different concern: "what
# host tool must be on PATH for Axon's own scripts to run, and how do you install it." Most
# entries here (git, jq, uv, gh, restic, docker, cargo) are host infrastructure with no
# upstreams.toml entry at all — Axon doesn't build them, it just calls them. The few that are
# ALSO adopted code (bun, bitwarden-cli, apfel, macmon, the scanners) carry `upstream = <id>`
# pointing at their upstreams.toml section; the license/why live THERE, never restated here
# (CONTRIBUTING.md#schemas-and-dependency-direction "import, never redefine"; CONTRIBUTING.md#one-manifest-per-concern no duplication).
#
# Read by tools/toolchain-check (the only parser), surfaced by tools/install.sh (bootstrap)
# and tools/doctor (ongoing). Single-line TOML only (tools/lib/toml.sh contract, bash 3.2-safe).
#
# Fields, per [section] (the section name is the tool's id):
#   required = "yes" | "optional" | "runtime"
#       yes      — always required, a missing one is a doctor failure.
#       optional — feature/gate-scoped; absence is a warning, not a failure.
#       runtime  — a container runtime; the checker resolves this machine's chosen
#                  container_runtime and checks ONLY that one (the others are alternatives).
#   why          = one line: what Axon uses it for.
#   install_macos / install_linux = the copy-paste install hint for that OS.
#   bin          = the executable name IF it differs from the section name (e.g. bitwarden-cli → bw).
#   os           = "macos" | "linux" — scope the entry to one OS; the checker skips it elsewhere.
#   upstream     = the upstreams.toml section id, when this tool is also audited code.
#   min_version / version_cmd = optional FLOOR -- the oldest release Axon's use of the tool is
#                  known to work on, never a version to install. Nothing holds a host at it:
#                  capabilities/host-patch upgrades every package manager nightly (Q77), so a
#                  healthy machine sits above every floor here. Checked only when BOTH are
#                  present. version_cmd's output is scanned for the first dotted-number token,
#                  compared via version.sh.
#   needed_by    = WHERE this tool applies, as a bare single-line array. Absent = core: needed on
#                  every machine, always checked. Otherwise one or more of:
#                    "workflow:<name>"          only when that workflow is invoked
#                                               (backup, restore, audit, build)
#                    "capability-field:<field>" only when an ENABLED capability's service.toml
#                                               declares that field
#
# `required` and `needed_by` answer different questions and both are load-bearing. `required` is
# how hard a miss is; `needed_by` is whether it is a miss HERE at all. A runtime node without a
# SAST scanner is not a machine with a problem, and reporting it as one is how a check teaches
# people to skim past it.
#
# Scope is DERIVED, never a hand-maintained machine-role list. There is no "maintainer machine"
# concept in this file: there are workflows, and you ask about one when you are about to run it.
# That is why `capability-field` reads the enabled set rather than naming hosts, and why the audit
# scanners hang off `tools/audit` rather than off a box.
#
#   tools/toolchain-check                    # this machine: core + enabled capabilities + runtime
#   tools/toolchain-check --workflow backup  # ...plus what a backup needs, BEFORE it holds a service
#
# Out-of-scope entries report as `n/a` naming the scope that would pull them in, never as missing.

# ---- always required ------------------------------------------------------------------

[git]
required = "yes"
why = "version control; the spine of update.sh, repos.ts, and every repo operation"
install_macos = "preinstalled with Xcode CLT — or: brew install git"
install_linux = "apt-get install -y git"

[bash]
required = "yes"
why = "every tools/*.sh runs here; Axon targets bash 3.2 (CONTRIBUTING.md#portable-shell) so the stock macOS shell is enough"
install_macos = "preinstalled (3.2)"
install_linux = "preinstalled"

[jq]
required = "yes"
why = "JSON in shell — dashboards, service-runner, audit report parsing"
install_macos = "brew install jq"
install_linux = "apt-get install -y jq"

[bun]
required = "yes"
upstream = "bun"
min_version = "1.3.0" # UI Security Scanner API used by the tree-local bunfigs.
version_cmd = "bun --version"
why = "the TS runtime (CONTRIBUTING.md#language-tooling): doctor, packs-codex, dashboard, panel-server all run on it"
install_macos = "brew install oven-sh/bun/bun"
install_linux = "curl -fsSL https://bun.sh/install | bash"

[uv]
required = "yes"
why = "the Python runtime (CONTRIBUTING.md#language-tooling): printctl and any uv-run script assume it"
install_macos = "brew install uv"
install_linux = "curl -LsSf https://astral.sh/uv/install.sh | sh"

[gh]
required = "yes"
why = "GitHub CLI: repos.ts, systems.toml visibility checks, PR workflow"
install_macos = "brew install gh"
install_linux = "apt-get install -y gh   # or: https://cli.github.com"

[bitwarden-cli]
required = "yes"
bin = "bw"
upstream = "bitwarden-cli"
why = "the canonical secret store CLI (CONTRIBUTING.md#secrets): setup-secret.sh, bw-unlock, backup restore"
install_macos = "brew install bitwarden-cli"
install_linux = "npm i -g @bitwarden/cli   # or the latest GitHub release"

# ---- optional (feature/gate-scoped; absence warns, never fails) ------------------------

[restic]
required = "optional"
needed_by = ["workflow:backup"]
why = "encrypted 3-2-1 backups (CONTRIBUTING.md#backups-before-migrations); backup.sh needs it, nothing else does"
install_macos = "brew install restic"
install_linux = "apt-get install -y restic"

[sqlite3]
required = "optional"
needed_by = ["capability-field:backup_sqlite", "capability-field:backup_sqlite_online", "workflow:restore"]
why = "cold SQLite backup, the shared store's live `.backup` copy, and isolated restore integrity checks; required only for capabilities declaring one of those two fields"
install_macos = "preinstalled — or: brew install sqlite"
install_linux = "apt-get install -y sqlite3"

# [hledger] stood here until 2026-08-28, when PRD Q50 retired it. capabilities/finance
# reads the journal itself now (capabilities/finance/src/journal.rs), so no machine needs
# the executable to run Finance. The FILE FORMAT is unchanged and still hledger-compatible
# — a host that wants to open the journal in hledger still can, which is a choice the
# operator makes rather than a requirement this file can state. Deleted rather than kept:
# toolchain.toml declares what a machine must have, and a host tool nothing calls is a
# check that can only be noise. upstreams.toml [hledger] holds the dated verdict.

# [bazel] stood here until 2026-08-25, when PRD Q44 retired it. cargo below is the whole Rust
# build path now, so the entry was deleted rather than kept: toolchain.toml declares what a
# machine must have, and a host tool nothing calls is a check that can only be noise.

[apfel]
required = "optional"
os = "macos"
needed_by = ["capability:foundation-models"]
upstream = "apfel"
version_cmd = "apfel --version"
min_version = "1.9.1"
why = "capabilities/foundation-models runs `apfel --serve`. macOS 26+, Apple Silicon and Apple Intelligence enabled; on a host without them apfel starts and reports model_unavailable rather than refusing, so the capability's README says what that costs."
install_macos = "brew install apfel"

[macmon]
required = "optional"
os = "macos"
needed_by = ["capability:macmon"]
upstream = "macmon"
version_cmd = "macmon --version"
min_version = "0.7.0"
why = "capabilities/macmon execs it as `macmon serve` for the dashboard's Systems page; tools/sysmon power execs the same binary as a TUI. Absent for weeks while the capability was enabled, because a capability's own command was not a declared tool here and nothing else looked."
install_macos = "cargo install macmon --locked"   # latest; min_version above is a floor, not a target (Q77)

[yt-dlp]
required = "optional"
needed_by = ["capability:comms"]
version_cmd = "yt-dlp --version"
min_version = "2026.08.19"
why = "capabilities/comms/src/media.rs execs it for share-link metadata and subtitles, always with --skip-download. Undeclared until 2026-08-29, so a host without it degraded silently — the same gap the macmon entry above records. Scoped to comms alone on purpose: this file is public, and a capability that keeps itself out of the public repo does not get its name and its intent published here by its dependency. Such a capability declares its own tools in its own preflight."
install_macos = "brew install yt-dlp"
install_linux = "apt-get install -y yt-dlp   # or: uv tool install yt-dlp"

# [visocr] is deliberately NOT declared here yet, and the two entries above are why. macmon and
# yt-dlp are `capability:` entries because a capability execs those binaries; nothing in
# capabilities/ reaches rung 2 of the extraction ladder today. libs/extraction/src/vision.rs execs
# visocr and reports Unavailable when it is missing, naming tools/visocr/build.sh in the error, and
# the only caller that gets that far is the corpus gate an operator runs by hand
# (libs/extraction/eval/README.md). A `capability:comms` entry would put a standing
# "visocr absent (optional)" on every macOS host with comms enabled, telling an operator to install
# a binary no code path calls -- which is how a warning channel stops being read, the same reason
# [hledger] and [bazel] were deleted above rather than kept. It gets an entry on the day a
# capability execs it.

[ollama]
required = "optional"
needed_by = ["capability:comms", "capability:scouting"]
version_cmd = "ollama --version"
min_version = "0.33.0"
why = "serves the `embedding` and `summarization` inference roles: capabilities/comms/src/relevance.rs for Feed-TELOS ranking, capabilities/scouting/src/embed.rs for profile vectors, and the strong local digest rung an operator reaches by pressing Regenerate. Absent, both degrade rather than fail -- relevance drops to the deterministic `lexical` control -- which is why this is optional and also exactly why it must be declared: the same silence the macmon and yt-dlp entries above record. It is a systems.toml service ([ollama]), not adopted code, so no `upstream` id: Axon calls it and builds nothing from it."
install_macos = "brew install --cask ollama"
install_linux = "curl -fsSL https://ollama.com/install.sh | sh"

[tailscale]
required = "optional"
version_cmd = "tailscale version"
min_version = "1.98.9"
why = "capabilities/host-net execs `tailscale status --json`, `tailscale debug prefs` and `tailscale lock status` for its `tailnet` verb; a host without it degrades to a named error rather than an empty posture. Undeclared until 2026-09-02, which is the same silence the macmon and yt-dlp entries above record. It is a host daemon Axon calls and builds nothing from, so no `upstream` id, the reasoning [ollama] states. The floor is the release this entry was reviewed against, not the build host's incidental 1.102.3: the three subcommands are all long-standing, so the functional floor is far lower and unmeasured, and writing the build host's own version here would report every slightly older but working install as `outdated`. Below the reviewed release is the one statement this can make with a source."
# NO needed_by, and that is the decision rather than an omission. `capability:host-net` cannot
# fire: toolchain-check resolves a capability scope against machine.toml's `capabilities` array
# (tools/toolchain-check:133-137), and by convention every capability without a service.toml —
# host-audit, host-firewall, cv, host-net — is absent from that array, so the entry would report
# `n/a (capability:host-net)` on every run forever. That is exactly the silent gap this entry
# exists to close. `workflow:host-net` would be no better: nothing invokes toolchain-check with
# that workflow. Core scope with required = "optional" is the shape that actually runs: checked
# on every machine, absence is a warning with an install hint, never a failure.
install_macos = "brew install --cask tailscale"
install_linux = "curl -fsSL https://tailscale.com/install.sh | sh"

[libreoffice]
required = "optional"
bin = "soffice"
# NO needed_by, the [tailscale] decision above. toolchain-check resolves `workflow:<name>`,
# `capability:<id>` and `capability-field:<field>`; a *skill* is none of those, so any scope
# would print `n/a` on every run forever -- the silent gap this entry exists to close. Core
# scope with required = "optional" is the shape that runs: checked everywhere, a miss is a
# warning with an install hint, never a failure. The one consumer is the slide-deck Pack
# (Packs/presentations), whose `scripts/deck render` shells out to `soffice --headless
# --convert-to pdf` and has no fallback: an unrendered deck is an unverified deck.
why = "headless LibreOffice is the only renderer the slide-deck skill can use, and rendering is its verification step; `scripts/deck render` fails without it (Packs/presentations). Axon calls it and builds nothing from it, so no `upstream` id, the [ollama] rule. macOS note: the cask installs a .app and links a `soffice` shim into the Homebrew bin dir, which is what `shutil.which(\"soffice\")` finds; without that shim the binary sits at /Applications/LibreOffice.app/Contents/MacOS/soffice and render reports it as missing."
install_macos = "brew install --cask libreoffice"
install_linux = "apt-get install -y libreoffice"

[cargo]
required = "optional"
needed_by = ["workflow:build"]
why = "the Rust toolchain, and the build path for every Rust capability: each service.toml declares `build = [\"cargo\", \"build\", ...]` and tools/service-runner.sh runs it before starting the binary (CONTRIBUTING.md#cargo-and-bun-are-the-build-path)"
install_macos = "brew install rustup && rustup default stable   # or: brew install rust"
install_linux = "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh"

# ---- container runtimes (the checker validates only this machine's chosen one) ---------

# [apple-container] stood here until 2026-09-02, when Q75 retired it. This machine
# declares container_runtime = "docker" and capabilities/agentbox invokes docker, so no machine
# needs Apple's `container` executable to run Axon. Deleted rather than kept: toolchain.toml
# declares what a machine must have, and a host tool nothing calls is a check that can only be
# noise. upstreams.toml [apple-container] holds the dated verdict.
#
# WHICH DAEMON supplies the docker CLI is a machine fact, not a second entry here. OrbStack does
# on this Mac; Docker Desktop, colima or a Linux daemon do elsewhere. [docker] below is the whole
# assumption Axon makes, and it is the [ollama] rule above applied again: Axon calls it and
# builds nothing from it, so there is no upstreams.toml row either.

[docker]
required = "runtime"
why = "container runtime (machine.toml container_runtime = docker). Since 2026-09-02 it is the only one this machine declares, and capabilities/agentbox depends on the CLI by name. `bin` is deliberately absent: the section name is the command, whichever daemon answers it. NB on macOS the OrbStack CLI lives at ~/.orbstack/bin/docker, which a login shell has on PATH and a bare launchd or cron environment does not -- tools/service-runner.sh injects its dirname into generated units for exactly that reason, and a hand-written invocation has to do the same"
install_macos = "brew install --cask orbstack   # or --cask docker, or colima — Axon assumes the docker CLI, never one provider of it"
install_linux = "apt-get install -y docker.io   # or Docker Engine per docs.docker.com"

[podman]
required = "runtime"
why = "rootless container runtime alternative (machine.toml container_runtime = podman)"
install_macos = "brew install podman"
install_linux = "apt-get install -y podman"

# ---- audit scanners (absence warns). Two run in tools/audit since 2026-09-02 -----------

# [semgrep] stood here until 2026-09-02, when Q74 retired it. CodeQL already runs rust,
# javascript-typescript, python and actions with the security-extended suite
# (.github/workflows/codeql.yml), which is total overlap -- and semgrep's `--config auto`
# downloaded its rules at scan time, so the version recorded for it described nothing that ran.
#
# [trivy] stood here until the same date and ruling. .github/workflows/security.yml scans every
# declared image with `grype registry:`, which needs no container runtime, and tools/audit no
# longer scans images at all. The host-audit capability this entry's `why` promised was retired
# in the same change. upstreams.toml holds both dated verdicts.

[gitleaks]
required = "optional"
needed_by = ["workflow:audit"]
upstream = "gitleaks"
why = "secret scan over git history — tools/audit"
install_macos = "brew install gitleaks"
install_linux = "apt-get install -y gitleaks   # or the latest GitHub release"

[osv-scanner]
required = "optional"
needed_by = ["workflow:audit"]
bin = "osv-scanner"
upstream = "osv-scanner"
why = "dependency-CVE scan over every lockfile — tools/audit"
install_macos = "brew install osv-scanner"
install_linux = "go install github.com/google/osv-scanner/cmd/osv-scanner@latest"

[grype]
required = "optional"
needed_by = ["workflow:audit"]
upstream = "grype"
# Scoped to the audit workflow so a machine that runs the audit by hand is told it can also
# scan an image before declaring one. tools/audit does NOT call it: the automated image scan is
# .github/workflows/security.yml, which installs its own copy and runs whether or not this
# machine is awake. This row is the local copy, for triaging an image a service.toml is about
# to adopt, and its absence is a warning by design rather than a failure.
why = "container-image CVE scan by hand — `grype registry:<image>:<tag>`, no container runtime"
install_macos = "brew install grype"
install_linux = "apt-get install -y grype   # or the latest GitHub release"

[rsync]
required = "optional"
needed_by = ["workflow:backup", "workflow:restore"]
why = "the file-copy path for backup staging and restore placement; backup.sh refuses to start without it"
install_macos = "preinstalled — or: brew install rsync"
install_linux = "apt-get install -y rsync"

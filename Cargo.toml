[workspace]
members = [
    "crates/*",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
# Minimum supported Rust version; rust-toolchain.toml tracks stable.
rust-version = "1.96"
license = "AGPL-3.0-only"

[workspace.lints.rust]
unsafe_code = "deny"

# Shared dependency versions; member crates declare their own feature sets.
[workspace.dependencies]
aho-corasick = "1.1"
base64 = "0.23"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
getrandom = "0.4"
reqwest = "0.13"
rayon = "1"
proptest = "1"
regex = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
libsql = { version = "0.10.0", default-features = false, features = ["core"] }
serde = "1.0"
serde_json = "1.0"
schemars = "1.2.2"
sha2 = "0.11"
thiserror = "2"
tokio = "1"
toml = "1.1"
zeroize = "1.9"
tower = "0.5"
tower-http = "0.7"

# Workspace crates keep line tables only; dependencies carry no debug info.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

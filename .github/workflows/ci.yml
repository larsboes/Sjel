name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every job that needs Bun installs `latest` rather than a pinned literal. Patch first
# (CONTRIBUTING.md#patch-first): the runtime CI tests against should be the one a contributor's
# package manager just installed, and a version held in a workflow is a version nothing moves.
# It was three literals plus tools/check-bun-pin.sh keeping them equal until 2026-09-02; with
# no literal anywhere there is nothing left to diverge, so the class the gate caught (#40)
# is structurally impossible rather than merely checked. upstreams.toml [bun] records the
# version that entry's verdict was written against, which is a different fact from what CI
# runs today. The cost is real and taken with eyes open: a bad Bun release can turn this red
# for a reason unrelated to the code, which is the same trade .github/workflows/security.yml
# makes for its scanners.

jobs:
  # rust-toolchain.toml names the `stable` channel and these two components, so local
  # contributor commands and CI lint with the same release rustup last fetched (Q77).
  # It rolls rather than holding a literal, which is the same trade the Bun note above makes.
  # Clippy compiles tests and feature-gated paths; running them is cargo-tests' job.
  rust-quality:
    name: cargo fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - name: Check out Axon
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: cargo fmt --all --check
        run: cargo fmt --all --check
      - name: cargo clippy (strict workspace)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  cargo-tests:
    name: cargo test (hermetic)
    runs-on: ubuntu-latest

    steps:
      - name: Check out Axon
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Fetched artifacts: the crates.io registry and any git dependencies. Keyed
      # on the lockfile that determines them, so it is saved exactly when they change.
      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      # Compilation output. Keyed per-commit with a rolling restore-key:
      # actions/cache only writes on an exact-key miss, so a lockfile-based key
      # here would leave the cache frozen at the last dependency bump and never
      # pick up day-to-day compilation.
      - name: Cache cargo target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: cargo-target-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            cargo-target-${{ runner.os }}-

      # No skip, and no second job. The database suites are `db_tests::` since PRD
      # Q45 (2026-08-27) moved every store onto one SQLite file: each test opens a
      # temp file of its own, so the whole workspace is hermetic and this one run
      # covers it. The split existed because those suites needed a server — they
      # failed rather than skipped without one, which is what a `--skip` selector
      # and a `services: postgres` job were both paying for.
      - name: cargo test
        run: cargo test --workspace --locked

  # One rootward `bun test`, not a list of directories. The list said ./tools/ and
  # Packs/axon/evals/, which is how dashboard/vite/comms-proxy-auth.test.ts and
  # libs/overlay/overlay.test.ts came to run nowhere: both were written, committed, and
  # never once executed by CI. bun discovers *.test.ts itself and skips node_modules, so a
  # test file added anywhere is gated by existing (Axon#116). No install step: every one of
  # these imports bun:test, node builtins and local sources only, which is what keeps a
  # dependency-free runner honest.
  bun-tests:
    name: bun test
    runs-on: ubuntu-latest
    steps:
      - name: Check out Axon
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      # The dashboard's tests import its modules, and mac-bridge.ts imports @tauri-apps/api, so its
      # locked dependencies are installed first. --frozen-lockfile --ignore-scripts, as
      # tools/check-bun-install-policy.sh requires of every install here.
      # svelte-kit sync writes .svelte-kit/tsconfig.json, which is where the $lib alias the
      # dashboard's modules import through is declared.
      - name: install the dashboard's dependencies
        working-directory: dashboard
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bunx svelte-kit sync
      - name: bun test
        run: bun test

      # The vendored pi packages carry their own test runner, so they run under it rather
      # than under `bun test` (which bunfig.toml excludes for exactly this reason). Runnable
      # and green since 2026-09-17: 22 files, 459 tests. This is not ceremony — the accordion
      # vendoring patches extension/accordion.ts behaviourally (the folding default and the
      # compaction cancel), and this suite is the only thing that covers those two deltas.
      #
      # --frozen-lockfile --ignore-scripts are required by tools/check-bun-install-policy.sh,
      # which also asserts these exact flags appear here.
      - name: vendored package tests (vitest)
        working-directory: Packs/harness/pi-packages/accordion
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run test

      # Every tools/*.test.sh, discovered rather than listed — a hand-list is how a committed
      # test comes to run nowhere (the Axon#116 shape, again). They all drive real scripts
      # against throwaway roots under /tmp, and this job has bun on PATH for the ones
      # (service-runner, doctor-driving) that need it. Ran as Bazel sh_test targets until
      # PRD Q44 (2026-08-25) retired Bazel; this loop is their one home since.
      #
      # No exclusions. toolchain-scope.test.sh was excluded here from 2026-08-26 to 2026-09-07
      # as "only ever green inside the Bazel sandbox". It was not: the sandbox scrubbed the
      # SJEL_* environment, and the measurement that justified the exclusion was taken on a
      # machine whose shell exports it, so the suite read the operator's overlay instead of its
      # own fixtures. It now calls isolate_axon_env like the other scratch-root suites and
      # passes in both places (PRD defect D7).
      - name: shell tests
        run: |
          set -uo pipefail
          failed=""
          for t in tools/*.test.sh; do
            echo "::group::$t"
            bash "$t" || failed="$failed $t"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "shell tests FAILED:$failed" >&2
            exit 1
          fi

  # Svelte type checks, local-only until 2026-07 and dashboard-only until now: a type
  # regression could land on main unseen (Axon#41), and a capability that grows its own UI
  # was unchecked from the day it landed (Axon#139 — the knowledge-graph UI carried six
  # errors while this workflow reported green).
  #
  # The set is discovered, never listed: `tools/discover-ui-packages` reads committed
  # package metadata, so a capability that grows a UI tomorrow enters this job without
  # anyone editing this file. A hand-list of capability names would close today's instance
  # and reopen the class.
  ui-check:
    name: bun run check (every discovered UI)
    runs-on: ubuntu-latest
    steps:
      - name: Check out Axon
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      # vitePreprocess() resolves the package's Vite config to run the style preprocessors,
      # and the dashboard's derives its dev proxy table from `tools/capability.sh registry`,
      # which hard-fails without <overlay>/config/machine.toml. Every <style> block then
      # reports that failure, so the first run of this job came back with 31 errors in 31
      # files — one per file, none of them type errors.
      #
      # A runner IS a machine, and Axon's contract is that a machine has an overlay, so the
      # honest fix is to give it the minimal one rather than to make the config tolerate its
      # absence. No axon.local.toml is written: with none present, paths.sh falls back to
      # axon.toml's shipped default (~/.axon-overlay), which is what this creates.
      # `capabilities = []` is deliberate — the registry then returns just the spine, which
      # is all a type check needs. Shape: schemas/machine.toml.example.
      - name: Minimal overlay for the config read
        run: |
          mkdir -p "$HOME/.axon-overlay/config"
          cat > "$HOME/.axon-overlay/config/machine.toml" <<'TOML'
          os = "linux"
          container_runtime = "docker"
          capabilities = []
          TOML

      # Two calls on purpose: the first prints every package and its verdict into the log,
      # including the skipped ones, so "not checked" is visible rather than absent. The
      # second is the machine-readable set, and it emits nothing when the first found a
      # violation — a refused package must not leave a loop reporting success over reduced
      # coverage.
      - name: Discover checkable UI packages
        run: tools/discover-ui-packages

      # Every package runs even after one fails: stopping at the first would hide how much
      # of the repository is actually broken behind whichever directory sorted first.
      - name: bun run check
        run: |
          set -uo pipefail
          failed=""
          for dir in $(tools/discover-ui-packages --dirs); do
            echo "::group::$dir"
            # A committed lockfile proves what we resolve, not that its lifecycle hooks are safe.
            # UI checks do not need install scripts, so leave that attack surface closed in CI.
            ok=1
            (cd "$dir" && bun install --frozen-lockfile --ignore-scripts && bun run check) || ok=0

            # Scan the committed dependency tree as a separate step. A fatal Socket advisory
            # makes Bun return non-zero; the scanner is configured in the tree's bunfig and is a
            # real devDependency, so a missing scanner is also a hard install error. Free mode
            # needs no secret; SOCKET_API_KEY is optional and adds this organization's policy.
            # The scanner is network-backed, so its availability and any API-side policy remain
            # an explicit operational dependency rather than being mistaken for the lockfile.
            if [ "$ok" -eq 1 ]; then
              (cd "$dir" && bun pm scan) || ok=0
            fi

            if [ "$ok" -eq 1 ]; then
              echo "$dir: ok"
            else
              failed="$failed $dir"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "ui-check FAILED:$failed" >&2
            exit 1
          fi

  # Repo-level gates, run directly rather than through tools/doctor (Axon#41).
  #
  # Why the scripts and not `doctor`: most of doctor's checks are machine-level — overlay
  # reachability, machine.toml, declared state mounts, upstream network — and a fresh clone
  # has none of them. Invoking the gate scripts is the same source of truth without that
  # baggage; doctor delegates to these identical scripts locally, so there is still one
  # implementation per rule.
  #
  # tools/self check runs here now. It used to read `tools/capability.sh registry`, which merges
  # this machine's machine.toml overrides and hard-fails without one -- so its answer was
  # machine-specific by construction and it stayed a doctor-only check (Axon#7). It reads the
  # service.toml manifests directly since, which makes the committed artifact reproducible from a
  # fresh clone and this the right place for it. Bun is set up for that one step; the other two
  # gates are pure shell.
  repo-gates:
    name: repo gates (labels, tracked inputs)
    runs-on: ubuntu-latest
    steps:
      - name: Check out Axon
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generator inputs are tracked
        run: tools/check-generator-inputs-tracked.sh
      - name: ARCHITECTURE.md is fresh
        run: tools/check-architecture-fresh.sh
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Plugin marketplace is fresh
        run: tools/check-marketplace-fresh.sh
      - name: service.toml manifests are well-formed
        run: tools/check-service-tomls.sh
      - name: Manifest requires= references resolve
        run: tools/check-manifest-integrity.sh
      - name: No document cites its own path
        run: tools/check-doc-self-references.sh
      - name: Every authored SKILL.md passes the metadata validator
        run: tools/check-skill-metadata.sh
      - name: The metadata gate fails the bad cases and passes the real tree
        run: tools/check-skill-metadata.test.sh
      - name: The presentations palette contract holds
        run: tools/check-presentations-theme-contract.sh
      - name: The palette gate fails a divergent pair and passes the real pack
        run: tools/check-presentations-theme-contract.test.sh
      # The SUITES, not the runs. Executing an eval costs model calls and is nondeterministic,
      # so it can never be a gate — a gate that flakes teaches people to ignore gates. What is
      # checkable for free is that every suite is well-formed: canonical keys, unique ids,
      # assertions that can actually fail, fixtures that exist. See tools/skill-eval.ts.
      - name: Skill eval suites are well-formed
        run: tools/skill-eval check --all
      - name: Publication hygiene
        run: tools/check-publication-hygiene.sh
      - name: Bun dependency installs do not run lifecycle hooks
        run: tools/check-bun-install-policy.sh
      - name: No capability begins a deferred transaction
        run: tools/check-store-transactions.sh
      - name: Obsidian plugins are read-only, discovered and mobile-safe
        run: tools/check-obsidian-plugins.sh
      - name: self.json is current
        run: tools/self check
      # Runs here rather than as an sh_test: it drives the whole tools/doctor, and a Bazel
      # sandbox that under-declares doctor's inputs makes the persistence check return early
      # and the test pass over an empty report — green for the wrong reason.
      - name: doctor reports orphan units, and only orphan units
        run: tools/persistence-orphans.test.sh

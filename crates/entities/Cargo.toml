[package]
name = "sjel-entities"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Sjel's system of record for people, organisations, places and the operator: typed fields per kind, declared extension fields, dated location facts, and where every value came from (PRD Q117)."
publish = false

[lib]
name = "entities"
path = "src/lib.rs"

[[bin]]
name = "entities-server"
path = "src/server.rs"

[features]
default = ["sqlite"]
sqlite = ["dep:rusqlite", "dep:sjel-store"]
turso-wal = ["dep:futures-executor", "dep:tempfile", "dep:turso"]

[dependencies]
civil-date = { path = "../civil-date" }
entities-api = { path = "../entities-api" }
sjel-config = { path = "../sjel-config" }
sjel-credentials = { path = "../sjel-credentials" }
sjel-http = { path = "../sjel-http" }
# The wikilink parser the vault link checker uses, for counting Journal links (journal.rs).
markdown-root = { path = "../markdown-root" }
sjel-server = { path = "../sjel-server" }
sjel-store = { path = "../sjel-store", optional = true }
route-manifest = { path = "../route-manifest" }
# The name key and the resolve body, shared with trips and places (docs/capabilities/links.md D8).
sjel-links = { path = "../links" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
rusqlite = { workspace = true, optional = true }
futures-executor = { version = "0.3", optional = true }
tempfile = { version = "3", optional = true }
turso = { version = "=0.8.3", default-features = false, optional = true }
# Blocking, inside spawn_blocking, like crates/trips: the geocode call to places
# runs beside the store write it feeds.
reqwest = { workspace = true, features = ["blocking", "json", "form", "query"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net"] }
axum.workspace = true
schemars.workspace = true

[lints]
workspace = true

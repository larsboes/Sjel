[package]
name = "sjel-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The one way a capability server binds and authenticates: 127.0.0.1 unless a token is configured, the runner's port contract, the shared inbound gate, uniform startup logging and bind-failure behavior."
publish = false

[lib]
name = "sjel_server"
path = "src/lib.rs"

[dependencies]
sjel-config = { path = "../sjel-config" }
axum.workspace = true
# The gate's refusal bodies are JSON because every consumer already parses the
# capability's errors that way. No new build cost: axum's default features
# already resolve serde_json for `axum::Json`.
serde_json.workspace = true
tokio = { workspace = true, features = ["net"] }
# The LAN listener (src/lan.rs, PRD Q119): TLS with a self-signed certificate the phone pins.
# rustls and tokio-rustls are already in the tree through reqwest; aws-lc-rs is their default
# provider there too, so this adds no second crypto library. hyper-util serves a TLS stream,
# which axum::serve does not. sha2 is the pinned fingerprint.
rustls = "0.23"
tokio-rustls = "0.26"
rcgen = "0.14"
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "service"] }
sha2.workspace = true
# The agent view (ISA F9): the gate rewrites every agent response through this crate.
sjel-pseudonymize = { path = "../pseudonymize" }

# The gate is a middleware layer, so a handler called directly would skip the
# thing under test. Same reasoning, same client, as comms' server tests.
[dev-dependencies]
reqwest.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true

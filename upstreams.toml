license = "MIT"
summary = "Rust SQLite binding with bundled SQLite that is Sjel's database since Postgres was retired"
why = "The database since Postgres was retired (PRD Q45, 2026-08-27): 462 of 464 live columns are SQLite-native and the write rate is 0.30 commits/s, so single-writer WAL with a busy_timeout is ample. Taken with `bundled` so a deployment does not depend on the SQLite an OS image happens to ship, and its blocking API is the one the sync call sites are written against."


# Sjel Pack profiles: named use-cases that deploy a set of Packs, optionally narrowed to a per-Pack
# skill subset. The rules live in Packs/harness/README.md and docs/plans/packs.md.
#
#   tools/harnesses use <name> [--harness <id>]   every installed harness
#   tools/packs-claude|packs-pi|packs-codex use <name>   one harness
#
# A profile is a selection, not a recommendation: activating it replaces what the harness loads with
# exactly this set. Re-run `use <name>` after a manual `sync <pack>`, which deploys the whole Pack.

# Units kept off named harnesses. "*" is every harness and a per-harness line adds to it. A
# materialized channel matches `pack/unit`, pi matches the path from the Pack root.
[unit_hold]
"*" = ["knowledge/defuddle", "skills/", "anatomy/"]
claude = ["harness/agents/", "writing/agents/"]
pi = [
    "harness/pi-packages/accordion",
    "writing/agents/",
]
codex = ["writing/skill-creator"]

# Profile for `tools/harnesses apply`; "*" covers unnamed harnesses.
[harness_profile]
claude = "coding-harness"
codex = "coding-harness"
antigravity = "coding-harness"
opencode = "coding-harness"
copilot = "coding-harness"
pi = "full"

[[profile]]
name = "productive"
description = "Daily driver — coding, prose, decks, deliberation, orientation, focus"
packs = ["writing", "presentations", "deliberation", "cognitive-load", "harness"]
skills = { "harness" = ["sjel"], "writing" = ["human-writing", "skill-creator", "unslop"] }

[[profile]]
name = "home"
description = "Retired — the home stack lives with the household's deployment now"
packs = []

[[profile]]
name = "coding"
description = "Code quality and the tools that write it"
packs = ["writing", "harness"]
skills = { "writing" = ["unslop", "human-writing", "skill-creator"], "harness" = ["sjel"] }

[[profile]]
name = "lean"
description = "Small models: few skills, so each turn carries less to choose from"
packs = ["harness", "coding", "security", "cognitive-load", "deliberation", "knowledge"]
skills = { "harness" = ["sjel"], "coding" = ["prior-art", "effective-rust", "gpui"], "security" = [], "cognitive-load" = ["attention-control"], "deliberation" = ["root-cause"], "knowledge" = ["obsidian"] }

[[profile]]
name = "repository"
description = "Work on this repository from a cloud container: code, UI, orientation, focus, review"
packs = ["coding", "design", "cognitive-load", "deliberation", "harness", "writing"]
skills = { "harness" = ["sjel"], "writing" = ["human-writing", "skill-creator", "unslop"] }

[[profile]]
name = "coding-harness"
description = "Coding agents: repository work, decks and secret handling; no vault, no learning"
packs = ["coding", "design", "cognitive-load", "deliberation", "harness", "writing", "presentations", "security"]
skills = { "writing" = ["human-writing", "skill-creator", "unslop"] }

[[profile]]
name = "thesis"
description = "DSR thesis and paper work: draft, critique and cite-check academic prose"
packs = ["writing"]

[[profile]]
name = "linux-cli"
description = "Headless Linux: CLI agents only, no dashboard, native app or decks"
packs = ["*"]
except = ["coding", "deliberation", "design", "presentations", "skills", "anatomy"]
skills = { "writing" = ["human-writing", "skill-creator", "unslop"] }

[[profile]]
name = "full"
description = "All selected owned Packs"
packs = ["*"]
except = ["skills", "anatomy"]
skills = { "writing" = ["human-writing", "skill-creator", "unslop"] }

[[profile]]
name = "everything"
description = "All owned Packs, dormant ones included"
packs = ["*"]
except = ["skills", "anatomy"]

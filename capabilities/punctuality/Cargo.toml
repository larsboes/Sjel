[package]
name = "punctuality"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Empirical rail punctuality: aggregates published Deutsche Bahn stop history into per-station reliability statistics."
publish = false

[lib]
name = "punctuality"
path = "src/lib.rs"

# punctuality-cli, not punctuality: capabilities/punctuality/punctuality is the shell
# entry point this capability puts on PATH (CONTRIBUTING.md#placement-guide), and it is that
# script which execs this binary. Two things named `punctuality` on PATH is the collision
# the suffix avoids. Same reason capabilities/comms names its binary comms-cli.
[[bin]]
name = "punctuality-cli"
path = "src/main.rs"

# punctuality-server: the HTTP contract capabilities/transit reads this through, since a
# capability depends on another's surface and never its code (CONTRIBUTING.md#schemas-and-dependency-direction). The one
# place in this crate that needs an async runtime -- ingest and the CLI are batch jobs.
[[bin]]
name = "punctuality-server"
path = "src/server.rs"

[dependencies]
# Outbound HTTP goes through one factory: the user-agent, the timeout and the
# connection pool are decided there, not at each call site (libs/sjel-http).
sjel-http = { path = "../../libs/sjel-http" }
sjel-config = { path = "../../libs/sjel-config" }
sjel-server = { path = "../../libs/sjel-server" }
sjel-store = { path = "../../libs/sjel-store" }
route-manifest = { path = "../../libs/route-manifest" }
# arrow-rs (upstreams.toml [arrow-rs]) -- the parquet reader. Pure Rust, which is the
# reason it is here rather than an embedded database: see
# capabilities/punctuality/README.md.
parquet = "=59.3.0"
arrow = "=59.3.0"

# The database, after PRD Q45 retired Postgres. Bundled so the deployment does not
# depend on whichever SQLite the host ships; upstreams.toml [rusqlite] has the
# measurement that settled it. Blocking, which matches this crate: ingest is a batch
# job and the CLI is a batch job.
rusqlite.workspace = true
reqwest = { workspace = true, features = ["blocking", "json"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true

# punctuality-server only. Same versions capabilities/transit pins for transit-server.
# Not `full`: these are the drivers this crate reaches for, verified with a lone
# `cargo check -p <crate> --all-targets`, which is the only build where a missing
# tokio feature is visible (a workspace build unifies them away).
# `#[tokio::main]` and four `spawn_blocking` store reads, nothing else.
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
axum.workspace = true
tower-http = { workspace = true, features = ["cors"] }

[lints]
workspace = true

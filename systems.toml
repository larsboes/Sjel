# systems.toml — the map of systems Sjel connects to.
#
# One section per system: a service, tool, or project that has a ROLE in the
# setup — something a pack or capability references by id (its section name),
# or a separate repo Sjel integrates with. This is deliberately NOT:
#   * upstreams.toml — that is external CODE dependencies with an audit verdict.
#   * a bookmark dump — reading/inspiration links don't earn a section here.
#   * a graveyard — a system evaluated and declined gets no section, only the note below.
#
# Evaluated and declined as agent harnesses (2026-07-10): Cursor, Kiro (AWS), Google
# Antigravity, OpenAI Codex, and Docker's cagent. None is tracked here; all five were also
# purged from disk, including ~161MB of orphaned Library state and two root-owned dangling
# symlinks (/usr/local/bin/cursor, /usr/local/bin/kiro) left behind by hand-uninstalls. The
# three kept harnesses are the ones named below: Claude Code, pi-agent, opencode. Bringing any
# declined tool back is a normal verdict-gate decision (CONTRIBUTING.md#dependency-verdicts-and-provenance), never a bare
# `brew install` or a manual .app drop.
#
# Fields (single-line TOML only, see tools/lib/toml.sh):
#   url   = canonical URL (repo, dashboard, or LAN address). PUBLIC repos and
#           third-party services keep their URL inline; PRIVATE repos use
#           "overlay:systems.local.toml" and put the real URL in the overlay
#           (`<overlay>/config/systems.local.toml`). Private LAN IPs never
#           appear here either.
#   kind  = "project" | "service" | "tool" | "platform"
#   local = "yes" | "no"        # runs on my LAN / device vs. hosted elsewhere
#   why   = one line: what it's for and why it's in the setup
#
# One more key, and it lives ONLY in the overlay entry because it is a trust decision about
# a specific deployment (PRD Q39, 2026-08-25):
#
#   owner = "self"              # this host is hardware I own
#
# It is what lets `libs/inference` treat a tailnet peer exactly as it treats loopback: no data
# class is withheld from it, and it is not classified as a cloud provider needing a reviewed
# policy. `local = "yes"` is NOT that statement — it says something is on my LAN, which a
# borrowed or shared node also is. Nor is presence in systems.local.toml: [nvidia-nim] is in
# that file and is a cloud provider. The declaration is explicit, and it is an intersection —
# a backend in inference.json must also name the id in `provided_by`, so naming a host and
# trusting it are two separate acts. `tools/lib/external-ref.sh` resolves the pair.
#
# `tools/doctor --online` probes every http(s) `url` here for reachability and reports the system
# id, the outcome and the HTTP status. It never prints a URL, so a private endpoint resolved from
# the overlay stays private in a report you paste somewhere. Two keys steer it, and both live in
# the OVERLAY entry (`<overlay>/config/systems.local.toml`), never here, because whether and how
# hard to dial an endpoint is a deployment decision:
#
#   probe            = "no"     # do not dial this one at all
#   probe_timeout_ms = 12000    # this endpoint is legitimately slow (default 5000)
#
# Anything that is not an http(s) endpoint (ssh, url = "local", no url) is reported as skipped
# with the reason rather than passed over, so "nothing to probe" never reads as "probed fine".
#
# Referenced from: Packs/*/pack.toml `links = [...]`, capability READMEs.

# ---- reusable system roles and public projects ---------------------------

[axon]
url   = "local"
kind  = "project"
local = "yes"
why   = "The public core: reusable contracts, capabilities and deployment tooling; private state is injected from the selected overlay."

[home-automation]
url   = "overlay:systems.local.toml"
kind  = "project"
local = "yes"
why   = "Private home-automation deployment consumed through Sjel's public capability and Pack contracts; coordinates live in the selected overlay."

[backup-target]
url   = "overlay:systems.local.toml"
kind  = "service"
local = "yes"
why   = "Remote backup role, separate from each source host so one node failure cannot remove both live state and recovery data; coordinates live in the selected overlay."

[pi-agent]
url   = "https://github.com/earendil-works/pi"
kind  = "project"
local = "yes"
why   = "Minimal open-source coding agent, extendable from core. One of three swappable harness targets to port Packs/skills to — distinct from opencode below. Points at upstream, matching upstreams.toml's [pi-coding-agent] pin: the fork this entry once named was never created."

[opencode]
url   = "https://github.com/anomalyco/opencode"
kind  = "platform"
local = "yes"
why   = "Open-source coding agent CLI (MIT) — third swappable harness alongside Claude Code and pi. Packs/skills port target; intent is a fork for the port, PR'd upstream once mature, per the fork-is-a-PR-vehicle decision."

[knowledge-base]
url   = "overlay:systems.local.toml"
kind  = "project"
local = "yes"
why   = "Private knowledge store with its own sync lifecycle, connected through explicit capability contracts rather than treated as an Sjel-wide database."

[obsidian-local-rest-api]
url   = "https://github.com/coddingtonbear/obsidian-local-rest-api"
kind  = "service"
local = "yes"
why   = "Obsidian plugin (MIT) serving the open vault over loopback HTTP. The only route by which capabilities/vault writes into the vault: `vault fields --apply` reads a People note with GET and stores it with a raw-bytes PUT, never the frontmatter PATCH, which re-serialises the whole block. URL and key file come from the overlay's config/knowledge.toml."

[mach-mono]
url   = "https://github.com/larsboes/mach-mono"
kind  = "project"
local = "yes"
why   = "Swift monorepo of macOS/iOS quality-of-life utilities; plugin-first, extendable from core."

[lifeos]
url   = "https://github.com/danielmiessler/LifeOS"
kind  = "platform"
local = "yes"
why   = "Personalization + tooling layer under the agent runtime, and the ancestor of Sjel's public-core-plus-private-overlay shape. Axon held a reviewed delta against it until 2026-08-25 and holds none now — see upstreams.toml's [lifeos] entry, which owns the last consumed pin and the reason it stopped. Ideas flow from here into Sjel."

# ---- 3d-printing stack (referenced by Packs/3d-printing) -------------------

[moonraker]
url   = "https://moonraker.readthedocs.io/"
kind  = "service"
local = "yes"
why   = "Klipper's local REST API on the LAN — the actual integration surface printctl drives. Host in overlay config/printing.json."

[fluidd]
url   = "https://docs.fluidd.xyz/"
kind  = "service"
local = "yes"
why   = "Web UI on top of Moonraker. Same API; not a separate integration."

[orcaslicer]
url   = "https://github.com/SoftFever/OrcaSlicer"
kind  = "tool"
local = "yes"
why   = "Headless slicer printctl shells out to (STL/3MF -> gcode). User presets required (CLI rejects system presets)."

# ---- graphify semantic-extraction backends (tools/graphify.sh) ------------

[ollama]
url   = "https://ollama.com/"
kind  = "tool"
local = "yes"
why   = "Portable local-model runner. Holds the `embedding` and `summarization` inference roles on this deployment since 2026-08-30, oMLX having left the host. CONTEXT WINDOWS ARE NOT AUTOMATIC HERE and the failure is silent: it loads a model at 4096 tokens whatever the architecture declares (qwen3:4b declares 262144), its OpenAI-compatible /v1/chat/completions -- the endpoint libs/inference uses for an `api = \"ollama\"` backend -- takes no per-request num_ctx, and an over-window prompt is TRUNCATED FROM THE FRONT and answered 200 rather than refused. Measured 2026-08-30: a 7,399-token prompt came back reported as 2,050 with its opening gone. oMLX and apfel both refuse instead, so Sjel had been relying on the server to hold that line. A chat role on Ollama therefore names a model built with an explicit `PARAMETER num_ctx` covering `sjel_summarize::worst_case_prompt_tokens()` (6,400) -- here `axon-qwen3-4b:ctx8k`, derived FROM qwen3:4b at 8192. Embedding roles are unaffected: bge-m3 is called on /api/embed and its own max sequence bounds it."

[omlx]
url   = "https://github.com/jundot/omlx"
kind  = "tool"
local = "yes"
why   = "Apple-Silicon inference server behind an API-key-enforced OpenAI-compatible endpoint. It remains host-native because Metal/ANE are unavailable inside the Linux runtime; endpoint and model selection remain deployment facts."
[macmon]
url   = "https://github.com/vladkens/macmon"
kind  = "tool"
local = "yes"
why   = "Sudoless Apple Silicon performance monitor: CPU/GPU temp, power, memory, utilisation over HTTP/JSON for the dashboard Systems page."

[apple-natural-language]
url   = "https://developer.apple.com/documentation/naturallanguage"
kind  = "platform"
local = "yes"
why   = "OS-managed native embedding comparator for Comms, not the production relevance backend. Both revision-1 APIs are much lighter but failed the frozen DE/EN corpus: language-specific NLEmbedding scored 3/6 useful top-1, 0.500 pairwise and 0.699 mean nDCG at about 73 MiB runner RSS; mean-pooled shared Latin NLContextualEmbedding scored 4/6, 0.618 and 0.776 at about 85 MiB. Keep the harnesses for future macOS model revisions; E5-base through oMLX remains selected."

[apple-vision]
url   = "https://developer.apple.com/documentation/vision/vnrecognizetextrequest"
kind  = "platform"
local = "yes"
why   = "the OS framework rung 2 of the extraction ladder stands on (PRD Q63 -> B30), reached through Sjel's own tools/visocr (built by tools/visocr/build.sh; no toolchain.toml entry until a capability execs it). Measured against the frozen DE/EN corpus on 2026-09-02: 100.0% prose recall across four German and English pages at 0.14 s per page with zero model bytes, and 58.8% notation recall, because it does not corrupt a printed formula -- it deletes it and returns the surrounding prose as though the page had none. That split is why the ladder has a third rung; the record is libs/extraction/eval/results/2026-09-02-apple-vision-baseline.md. macOS-only, so on a Linux host this rung is absent and says so rather than being compiled away."

[opencode-zen-go]
url   = "https://opencode.ai/zen/go/v1"
kind  = "service"
local = "no"
why   = "OpenAI-compatible hosted inference, the paid fallback behind nvidia-nim for tools/graphify.sh semantic extraction. NOT free despite the tier name: models.dev lists 24 models on it and zero at zero cost, cheapest gpt-5.6-luna at $0.10/M in and $0.60/M out, which is roughly eight cents for a full extraction over this repo. What it buys over the free tier is context -- several models carry 1M-token windows, so the chunk budget stops being a constraint at all. Endpoint id and model list resolved from models.dev, the same registry opencode itself reads; the account is the existing opencode-go auth. Key via Vaultwarden and tools/materialize-inference-key, never inline."

[gemini]
url   = "https://generativelanguage.googleapis.com/"
kind  = "service"
local = "no"
why   = "Free-tier hosted inference (OpenAI-compatible /v1beta/openai/chat/completions, bearer key) behind the comms `cloud_gemini_content_analysis` role. FREE-TIER CEILING IS 20 REQUESTS PER DAY, per project per model, for gemini-3.6-flash -- not an estimate: the provider names it in its own 429 body as quotaId GenerateRequestsPerDayPerProjectPerModel-FreeTier, quotaValue 20, read on 2026-08-30. The role had declared 1000, so Sjel kept dispatching 50x past the point the provider stopped serving; `max_requests_per_day` is a LOCAL guard and is worth nothing set above the real limit. Second caveat, measured the same day: gemini-3.6-flash reasons before answering and truncates every digest at finish_reason=length, 33 failures to 0 successes, because `chat_template_kwargs` can only emit the key vLLM and NIM read and this endpoint wants top-level `reasoning_effort` -- see libs/inference/src/lib.rs. The role now sets `request_overrides = {reasoning_effort: none}` through the general field added the same day, and that value is UNVERIFIED: the 20/day quota was already spent by the 33 truncated attempts, so the first real test of it is the next drain after the quota resets. If it does not clear the truncation, the alternatives are a larger reply budget for this role or leaving it as the last failover rung it now is. Key provisioned via Vaultwarden and tools/materialize-inference-key, never by an agent."

[groq]
url   = "https://api.groq.com/openai/v1"
kind  = "service"
local = "no"
why   = "Free-tier hosted inference (OpenAI-compatible /v1/chat/completions, bearer key, no card) held as the SECOND public-tier role behind Cloudflare -- redundancy rather than throughput. The public digest lane had exactly one provider until 2026-08-30, which is how one rate-limited role parked 39 digests. Models carry a 131,072-token context, so unlike Cerebras' 8192-capped free tier this clears the byte-based input bound comms actually sends -- 176 of 177 staged documents exceed 8192. NOTE the model id: both community directories list `llama-3.3-70b-versatile` here and this account's catalogue does not serve it at all, which `model-check` caught on the first probe after the key landed. The role runs `qwen/qwen3.8-27b`, chosen off the live catalogue rather than a list, and chosen for its BUDGET: Groq publishes 30 RPM / 1000 RPD / 8K TPM / 2M TPD for it against 200K TPD for openai/gpt-oss-120b, and at roughly 5400 tokens per digest a 200K token ceiling would bind at about 37 requests -- below the 50 this role declares, which would put the guard above the real limit again. 2M TPD leaves the request cap as the binding one, which is the only way max_requests_per_day means anything. The 8K TPM is the live constraint to watch: it allows about one digest a minute, so a burst falls over to the next rung rather than being served here. LIMITS ARE PER MODEL AND PER ORGANISATION and the published examples are requests-per-day plus a tokens-per-day that usually binds first (openai/gpt-oss-120b: 30 RPM, 1000 RPD, 200K TPD). The role's declared ceiling is deliberately far below that pending a measurement on this account: two community directories both list 14400 RPD for this provider, Groq's own docs say 1000 per model, and a number copied from a directory is how max_requests_per_day became fiction for two other roles the same day. `bun tools/model-check.ts --probe` reads the real ceiling out of the first refusal. Key provisioned manually via Vaultwarden and tools/materialize-inference-key, never by an agent."

[cohere]
url   = "https://api.cohere.ai/compatibility/v1"
kind  = "service"
local = "no"
why   = "Free trial-key inference behind an OPENAI-COMPATIBLE endpoint -- `https://api.cohere.ai/compatibility/v1`, Cohere's own Compatibility API, which takes the standard chat/completions shape including max_tokens. Held as a third public-tier role behind Cloudflare and Groq. CORRECTION, recorded because the first pass got it wrong: this provider was initially rejected here as needing a new `Api` variant, on the strength of a community directory listing its native `api.cohere.com/v2` schema. That was the directory's URL, not the provider's only one, and the compatibility layer is a config entry rather than a code change. THE REAL CONSTRAINT IS THE PERIOD, not the shape: trial keys allow 20 req/min and 1000 API calls per MONTH, and `max_requests_per_day` can only express a UTC day. 30/day is the daily figure that keeps a full month inside that budget (30x31 = 930), so the role declares 30 and the monthly ceiling is respected by construction rather than by a counter Sjel does not have. Key provisioned manually via Vaultwarden and tools/materialize-inference-key, never by an agent."

[cloudflare-workers-ai]
url   = "https://developers.cloudflare.com/workers-ai/"
kind  = "service"
local = "no"
why   = "Free-tier hosted inference (OpenAI-compatible /v1/chat/completions) behind the comms `cloud_cloudflare_content_analysis` role, and the provider that wrote most of this machine's cloud digests. MEASURED 2026-08-30: 81 digests of @cf/meta/llama-3.3-70b-instruct-fp8-fast succeeded, then every later call that day returned 429 -- so the role's declared 200 sent 119 requests past the real ceiling before failover existed to absorb them. Set to 80 on that observation. The unit was confirmed the same day, by the provider, in its own 429 body: `you have used up your daily free allocation of 10,000 neurons`. So the free tier is 10,000 Neurons/day and 81 digests of this model spent them -- about 123 neurons each -- which is why a request count here is an approximation that moves with model size and has to be re-measured when the model changes. `bun tools/model-check.ts --probe` reads that sentence back out of the refusal."

[nvidia-nim]
url   = "https://build.nvidia.com/"
kind  = "service"
local = "no"
why   = "Free-tier hosted inference (OpenAI-compatible /v1/chat/completions, nvapi- key, 1000 credits, 40 req/min, no card) -- optional cloud fallback for tools/graphify.sh (GRAPHIFY_BACKEND=nvidia) when local model quality isn't enough. Dev/research/eval ToS only, not a production SLA. API key provisioned manually via Vaultwarden, never by an agent -- see tools/graphify.sh."

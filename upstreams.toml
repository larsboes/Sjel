why = "Retired 2026-08-27 (PRD Q45): one shared SQLite file replaces it and no capability opens a Postgres connection now. The cross-schema join thesis survived -- which is why the replacement is one file rather than one per capability -- but a container, managed volume, password, watchdog and dump contract for 0.30 commits/s did not."

[r2d2]
url = "https://github.com/sfackler/r2d2"
verdict = "adopt"
license = "MIT OR Apache-2.0"
summary = "Generic Rust connection pool behind Sjel's store, adopted after pooled opens proved far faster"
why = "The generic connection pool behind the store, kept because a pooled checkout costs 0.20-0.30 ms against 32-39 ms to open a session. Chosen over deadpool and bb8, which are async pools for an async client: this data layer is deliberately synchronous and driven from spawn_blocking, so swapping the pool would have made 134 call sites async to solve a connection-reuse problem."

[r2d2_postgres]

[package]
name = "sjel-links"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Typed ids, the back-reference contract, and the people-by-name contract between capabilities."
publish = false

[lib]
name = "sjel_links"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true, features = ["derive"] }
# Request schemas for `/routes`, as every capability derives them (libs/route-manifest).
schemars = "1.2.2"
sha2.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true

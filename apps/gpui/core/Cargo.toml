[package]
name = "sjel-gpui-core"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-only"
description = "What the Mac and iOS GPUI apps share: the data layer, destinations and the shell client"

[features]
# Marks a build whose tests must not reach this machine's real data. `Repo::local_db_path` answers
# `None` when it is on. It exists because `cfg(test)` marks only the crate that declares the test:
# the app's window tests would otherwise read this machine's `axon.db` through the shared `Repo`.
# The app enables it from its dev-dependencies.
test-support = []

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# The axon-device-auth/v1 protocol and the pinned TLS client for the LAN listener, shared with
# the devices capability and the Tauri phone app.
device-auth = { path = "../../../libs/device-auth", features = ["pinned-tls"] }
futures = "0.3"
# rustls: the pinned client for the LAN listener (device.rs) needs a TLS backend. http2: that
# client offers h2 by ALPN (`device_auth::pinned_tls`), and the listener accepts it.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls", "http2", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The digest the Mac's mirror manifest names, checked before a fetched copy replaces the one on
# disk (src/mirror.rs). Already in the lock through `device-auth`.
sha2 = "0.11"
# The matrix behind the pairing code on the Mac's Setup page. Default features are off because
# both of them (`image`, `svg`) exist to write a file, and this page paints the modules itself.
qrcode = { version = "0.14", default-features = false }
# `rt-multi-thread`: a token read through `/usr/bin/security` blocks its worker, so a second
# worker keeps an unrelated request from waiting on it (src/shell.rs).
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "net", "sync"] }
libsql = { version = "0.10.0", default-features = false, features = ["core"] }
sjel-config = { path = "../../../libs/sjel-config" }
# `name_key`, the one rule for comparing a person's name with the register's rows
# (src/places.rs). Shared rather than copied: places, trips and comms all key their decisions by it.
sjel-links = { path = "../../../libs/links" }
sjel-credentials = { path = "../../../libs/sjel-credentials" }
zeroize = "=1.9.1"


[lints.rust]
unsafe_code = "deny"

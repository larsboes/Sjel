# Shape of $SJEL_PERSONAL_ROOT/data/cv/master_cv.yaml, consumed by templates/cv.typ.
# This file is documentation + a fillable skeleton — copy it into the overlay and replace
# every placeholder. Real content never lands in Axon.
#
# Conventions:
#   - Any free-text field is bilingual: {en: "...", de: "..."}.
#   - `profiles: [...]` tags an item as belonging to those build profiles only.
#     Omit `profiles` entirely (or leave it empty) to include the item in every profile.
#   - `profiles` lives on: experience entries, individual bullets, skill categories.
#     Text variants (title/summary) key off `default` plus one override key per profile —
#     `cv build --profile swe` uses `swe` if present, else `default`.
#   - The profile vocabulary below (swe/quant/consulting/general/cheftreff/sdw/hackathon)
#     is a starting point carried over from the old LaTeX targets — add/drop freely, it's
#     just data read at build time, nothing else references this list.

# Optional. Restricts which languages a profile builds for; any profile not listed here builds
# in every language. Only `cv build --all` consults it — an explicit
# `cv build --profile x --lang de` still builds what you asked for. Added 2026-08-16, when the
# full matrix was producing variants that existed only because it multiplied them out.
profile_langs:
  # hackathon: [en]

name: "Firstname Lastname"

contact:
  email: "you@example.com"
  phone: "+00 000 0000000"       # optional
  location: "City, Country"
  linkedin: "linkedin.com/in/yourhandle"
  github: "github.com/yourhandle"

title:
  default: {en: "Default Job Title", de: "Standard-Berufsbezeichnung"}
  swe: {en: "Software Engineer", de: "Software-Entwickler"}

summary:
  default: {en: "One or two sentences describing you, used when no profile-specific summary exists.", de: "..."}
  swe: {en: "A summary variant tuned for SWE applications.", de: "..."}

experience:
  - company: "Employer Name"
    location: "City, Country"
    date: "Mon. YYYY - Present"
    # profiles: [swe, general]   # omit to include this experience entry in every build
    bullets:
      - text: {en: "Achievement or responsibility, specific and metric-driven where possible.", de: "..."}
        # profiles: [swe]        # omit to include this bullet whenever the entry above is included

education:
  - institution: "University Name"
    degree: {en: "Degree Name", de: "..."}
    date: "Mon. YYYY - Mon. YYYY"
    location: "City, Country"     # optional
    details:
      - {en: "Relevant coursework, thesis title, honors, etc.", de: "..."}

skills:
  - category: {en: "Languages & Frameworks", de: "Sprachen & Frameworks"}
    # profiles: [swe]            # omit to include this category in every build
    items: ["Item A", "Item B"]
  # `items` may instead be a {en: [...], de: [...]} map, for the rare category where every item
  # differs by language. Tool and product names don't translate, so a plain list is the norm;
  # spoken languages are the exception that needs this.
  - category: {en: "Spoken Languages", de: "Sprachkenntnisse"}
    items:
      en: ["First language (native)", "Second language (B2)"]
      de: ["Erstsprache (Muttersprache)", "Zweitsprache (B2)"]

# Anything the four sections above cannot express. Optional — omit the key entirely and
# nothing renders. Added 2026-08-05, when a CV master turned out to carry Hackathons &
# Events, Soft Skills, Community & Engagement and Interests with nowhere to put them.
#
# Deliberately ONE generic shape rather than four named sections. A named section means a
# template edit every time a fifth appears; this way a new section is data. Each entry
# renders whichever of `entries` / `bullets` / `prose` it carries, in that order, and may
# carry more than one. `profiles:` filters the section itself and each entry/bullet inside
# it, same rule as everywhere else.
sections:
  - title: {en: "Hackathons & Events", de: "Hackathons & Events"}
    # profiles: [swe, hackathon]     # omit to include in every build
    intro: {en: "Optional lead-in sentence.", de: "..."}
    entries:                          # label/meta/detail rows — an event, a talk, an award
      - label: "Event or award name"  # or {en, de} where the name itself differs
        meta: "Mon. YYYY · City"      # optional right-aligned line; also accepts {en, de},
                                      # which is what "since Jun 2025" / "seit Juni 2025" needs
        detail: {en: "What it was and what came of it.", de: "..."}
        # profiles: [hackathon]
    # Height note: an entry costs two lines (label/meta row, then detail). A bullet costs one.
    # Four entries added to a one-page CV pushed it to two; the same four as bullets, with the
    # date folded into the text, fit. Reach for `entries` when the meta column earns its line.
  - title: {en: "Soft Skills", de: "Soziale Kompetenzen"}
    bullets:
      # `label` renders bold, `text` follows it. Keep markup OUT of both: these are
      # interpolated into Typst as plain strings, so "*bold*" prints its asterisks.
      - label: {en: "Named skill", de: "Benannte Fähigkeit"}
        text: {en: "the evidence for it.", de: "..."}
  - title: {en: "Interests", de: "Interessen"}
    prose: {en: "A sentence or two; no list structure needed.", de: "..."}

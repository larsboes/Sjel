# soundscape — host process, not a container. Shape: schemas/service.toml.example.
#
# autostart = false: nothing depends on this being up, and a soundscape that starts
# itself on boot is a machine that makes noise decisions nobody asked for. The
# app's Capabilities page starts it through sjel-status when it is wanted.
kind        = "process"
name        = "soundscape"
command     = ["target/release/soundscape"]
build       = ["cargo", "build", "--locked", "--release", "--bin", "soundscape"]
port        = "8088"
health_path = "/health"
autostart   = "false"

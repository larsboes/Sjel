# places — canonical place registry, geocode cache, and the map layer endpoints.
kind        = "process"
name        = "places"
command     = ["target/release/places-server"]
build       = ["cargo", "build", "--locked", "--release", "--bin", "places-server"]
port        = "8093"
# Venue and city links reference finance transactions by fingerprint, and person-place names
# decided as people reference entities; `GET /api/links?to=…` answers both, and undecided names
# are listed at `/api/people/open` (libs/links/ISA.md D1, D11). src/links.rs holds the same list.
links_to = ["fin:tx", "ent"]
health_path = "/health"
ready_path  = "/ready"

# No `requires`: the registry, cache, links and register live in the shared SQLite
# file this process opens itself, so there is no database service to start first
# (PRD Q45).

description = "Guard secrets and credentials from agent visibility, and supply them where the agent legitimately needs one. Pi agent extensions that block reading .env, .secrets, and Bitwarden items at the tool-call boundary while allowing commands that use those secrets, and that give providers their API keys from the login keychain instead of the environment. Ships a Claude Code secrets-guard skill for the same doctrine."
skills      = ["secrets-guard"]

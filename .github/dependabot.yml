# Dependabot — freshness pull requests, replacing renovate.json5 (Q74, 2026-09-02).
# Renovate needed a GitHub App that was never installed: measured 2026-09-02, the repository has
# zero Renovate pull requests and zero Renovate issues over its whole life. Dependabot needs no
# App.
#
# `cooldown:` is written out in EVERY block, and that is the ruling rather than noise. Dependabot
# applies a three-day cooldown to version updates even when `cooldown` is not configured —
# GitHub's own options reference states it — so omitting the key does not mean "no hold", it
# silently reinstates a hold nobody chose. Patch first (CONTRIBUTING.md#patch-first): a hold that needs
# a human to end it is a hold that ends late.
#
# `default-days: 0` is the ruling for cargo and github-actions: a malicious Cargo crate or a
# compromised `actions/*` tag is close to unheard of, and a hold there buys nothing.
# No npm tree is watched here. The one left, the web clipper, is updated by hand under the
# 24-hour hold in its own bunfig.toml.

# The pull requests these open MERGE THEMSELVES once the required checks pass:
# .github/workflows/dependabot-automerge.yml arms `gh pr merge --auto --squash` on each one
# (Q77). Opening them daily and leaving them for a human to notice would have re-created the
# hold this file exists to remove.
#
# Daily, not weekly, for the same reason. A week-long batch is a week of unapplied security
# fixes, and the grouping below is what keeps that from being one pull request per crate.
#
# This file opens VERSION pull requests only. SECURITY updates are a repository setting, not a
# file setting: `gh api --method PUT repos/larsboes/Sjel/automated-security-fixes`. That was run
# on 2026-09-02 and `security_and_analysis.dependabot_security_updates` now reads "enabled";
# this file alone would have left the reactive half switched off.
#
# capabilities/agentbox/Containerfile is deliberately NOT watched. Its only FROM is
# `FROM ${BASE_IMAGE}` over an ARG default, and whether Dependabot resolves that shape is
# unverified — an ecosystem block that may watch nothing is exactly the rot this change removes.
# That base image is a dated Debian snapshot tag, bumped by hand.
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 0
    open-pull-requests-limit: 5
    groups:
      cargo:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 0
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

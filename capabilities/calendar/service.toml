# Calendar layer: availability windows, scoped rhythms, and events.
kind           = "process"
name           = "calendar"
command        = ["target/release/calendar-server"]
build          = ["cargo", "build", "--locked", "--release", "--bin", "calendar-server"]
port           = "8087"
health_path    = "/health"
ready_path     = "/ready"
autostart      = "true"
proxy_api_only = "true"
links_to       = ["trip:plan"]
imports        = ["ics", "google-calendar"]
exports        = ["ics", "json"]

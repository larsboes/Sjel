# Persistent trip plans, itineraries, and packing lists.
kind           = "process"
name           = "trips"
command        = ["target/release/trips-server"]
build          = ["cargo", "build", "--locked", "--release", "--bin", "trips-server"]
port           = "8086"
health_path    = "/health"
ready_path     = "/ready"
proxy_api_only = "true"
links_to       = ["ent"]
imports        = ["json"]
exports        = ["json", "ics-projection"]
requires       = ["inventory"]

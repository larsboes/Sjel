# ── A global npm package that is private ─────────────────────────────────────────
#
# simple-git 3.30.0 is pulled by a package installed outside any registry, so `npm update` cannot
# reach it (npm answers 404 for the name) and reinstalling is not possible from here. The fix
# DOES exist and the range allows it: that package declares `simple-git: ^3.28.0`, so rebuilding
# it against the current registry resolves 3.36.0 and these three entries end. That is why these
# carry the shortest date in this file: it is the one class here a person can close today.
[[IgnoredVulns]]
id = "GHSA-hffm-xvc3-vprc"
ignoreUntil = 2026-11-01
reason = "simple-git 3.30.0 remote code execution, fixed in 3.36.0. Reach: simple-git 3.30.0 is in the nested node_modules of a global package (version `0.0.27-PP`) that is not published to any registry, so no install command here can move it: `npm update -g` answers E404 for the name, and the tree has no global lockfile to re-resolve. The exposure is real and is command execution, bounded by what that tool is pointed at — it shells out to git, so untrusted input reaching it is the trigger. Ends when that package is rebuilt or reinstalled against `simple-git >= 3.36.0`, which its declared range already allows."

[[IgnoredVulns]]

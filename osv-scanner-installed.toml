reason = "Unmaintained paste proc-macro 1.0.15, build-time only. No affected functions, CVSS or fixed version. Reach, re-measured 2026-11-01: the published lock of `tauri-cli 2.12.4`, the installed build tool; xberg-cli is installed at 1.3.10 and no longer carries it. Same advisory as the entry in osv-scanner.toml, arriving through a build tool rather than this checkout. Ends when tauri-cli republishes against pastey."

[[IgnoredVulns]]

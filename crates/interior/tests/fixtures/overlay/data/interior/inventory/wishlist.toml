# ============================================================
# BEDARF der Musterwohnung. `[[slot]]` ist ein Beduerfnis mit Zielmassen, `[[produkt]]` ein
# konkretes Produkt. Beide landen im selben Katalog wie `owned.toml` und unterscheiden sich
# nur durch die `group`, die aus der Datei folgt und in keiner Datei steht.
# ============================================================


[package]
name = "sjel-calendar"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Sjel's calendar layer: availability windows, scoped rhythms, events."
publish = false

[lib]
name = "calendar"
path = "src/lib.rs"

[[bin]]
name = "calendar-server"
path = "src/server.rs"

[dependencies]
calendar-api = { path = "../calendar-api" }
schemars.workspace = true
# Howard Hinnant's civil-from-days pair, shared rather than copied. No
# dependencies of its own, which is why the four copies existed.
civil-date = { path = "../civil-date" }
# Outbound HTTP goes through one factory: the user-agent, the timeout and the
# connection pool are decided there, not at each call site (libs/sjel-http).
sjel-http = { path = "../sjel-http" }
sjel-config = { path = "../sjel-config" }
sjel-credentials = { path = "../sjel-credentials" }
sjel-server = { path = "../sjel-server" }
sjel-store = { path = "../sjel-store" }
content-item = { path = "../content-item" }
markdown-root = { path = "../markdown-root" }
route-manifest = { path = "../route-manifest" }
# Typed ids and the `/api/links` body every capability answers alike (website/content/capabilities/links.md).
sjel-links = { path = "../links" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# The database, after PRD Q45 retired Postgres. Bundled so the deployment does not
# depend on whichever SQLite the host ships; upstreams.toml [rusqlite] has the
# measurement that settled it.
rusqlite.workspace = true
# Not `full`: these are the drivers this crate reaches for, verified with a lone
# `cargo check -p <crate> --all-targets`, which is the only build where a missing
# tokio feature is visible (a workspace build unifies them away).
# `#[tokio::main]` and 34 `spawn_blocking` store reads, nothing else.
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
axum.workspace = true
tower-http = { workspace = true, features = ["cors"] }
reqwest = { workspace = true, features = ["json", "gzip", "blocking", "query", "form"] }

[dev-dependencies]
# `ServiceExt::oneshot`, so the origin test drives the wired Router with no listener
# and no port. The same pattern crates/sjel-status already uses.
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true

# The demo deployment (#168). A real overlay, describing a machine that does not exist.
#
# Every other overlay is private and lives outside this repository. This one is tracked, and
# that is the whole point: it is the configuration a published demonstration runs on, so it
# has to be reviewable by anyone reading the repo, and it must be impossible for it to name a
# real host, path, port binding or secret. There is nothing in here to keep private, because
# there is no machine on the other end of it.
#
# tools/demo-up points SJEL_OVERLAY_ROOT here, and tools/demo-seed refuses to write unless it
# resolves to exactly this directory — the guard that stops a seeding run from inventing rows
# in somebody's real ledger.

# The demo is recorded on a Linux CI runner. Nothing in the seeded set is platform-specific,
# and container_runtime goes unused: tools/demo-up sets SJEL_DB_PATH to a throwaway file under
# demo/state, so the whole stack shares one database that outlives nothing. A demonstration
# should not need a container runtime to build.
os = "linux"
container_runtime = "docker"

# The seeded set, and nothing else. Each of these can be filled entirely through its own HTTP
# write API — or, for the three added 2026-08-20, by reading the synthetic origin `[demo] origin`
# declares. A capability that can be filled neither way is listed under [absent] in
# demo/demo.toml with the reason, rather than being enabled here and quietly rendering empty.
#
# comms, scouting and transit each fetch from somewhere else for a living, which is why they
# were absent until an origin existed to fetch from. None of them gained a line of demo code:
# Comms is fed by posting URLs to its ordinary /ingest route, Scouting by declaring an rss
# source (tools/demo-up generates scouting.json from the manifest's origin), and Transit by
# the endpoint overrides its HAFAS client already reads.
#
# `store` is deliberately NOT here, though every capability below reads the shared database.
# That manifest exists to own a backup contract (kind = "data"), and this deployment's
# database is a scratch file deleted between runs — a backup surface for it would describe
# something nobody could restore. Single line, per the tools/lib/toml.sh contract.
capabilities = ["sjel-status", "calendar", "comms", "finance", "scouting", "transit", "trips"]

# No [[state_mount]] blocks. A state mount records where a tool on a real machine actually
# persists data; this deployment persists nothing that outlives the job that built it.

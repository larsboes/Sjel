# Canonical place registry, geocode cache, and map layer endpoints.
kind        = "process"
name        = "places"
command     = ["target/release/places-server"]
build       = ["cargo", "build", "--locked", "--release", "--bin", "places-server"]
port        = "8093"
links_to    = ["fin:tx", "ent"]
imports     = ["amex-csv", "google-takeout", "obsidian-markdown"]
exports     = ["geojson", "json"]
health_path = "/health"
ready_path  = "/ready"

# Online SQLite backup contract for the shared database file.
kind                 = "data"
name                 = "store"
backup_sqlite_online = "data/sjel/sjel.db"
backup_target        = "backup-target"
backup_retain        = "14"
backup_advise_days   = "1"
# The backup volume is attached periodically, so advise at 1d and call it stale only after a week.
backup_stale_days    = "7"

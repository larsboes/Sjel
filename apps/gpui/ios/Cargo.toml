[package]
name = "sjel-gpui-ios"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-only"
description = "The iOS GPUI app: GPUI content inside a UIKit host (host/)"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
sjel-gpui-core = { path = "../core" }
sjel-gpui-ui = { path = "../ui" }
gpui-kit = { version = "=0.7.3", default-features = false, features = ["component"] }
gpui = { package = "gpui-pre", version = "=0.3.9", default-features = false }
device-auth = { path = "../../../libs/device-auth" }
# `SJEL_DAY` names the calendar day a screenshot opens on (src/lib.rs, `launch_day`).
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }

[target.'cfg(target_os = "ios")'.dependencies]
# No release targets gpui-pre 0.3.9: crates.io 0.1.0 pins 0.3.5. This rev bumped to 0.3.9
# (upstream #36). camera and video_player work around src/ios/platform_view.rs:152 and :245
# at this rev, which use both modules without their feature gates.
gpui-mobile = { package = "gpui-pre-mobile", git = "https://github.com/longbridge/gpui-mobile", rev = "c24a1308e1", default-features = false, features = ["camera", "video_player"] }

[lints.rust]
unsafe_code = "deny"

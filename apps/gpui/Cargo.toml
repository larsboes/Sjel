[package]
name = "sjel-gpui"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-only"
description = "Sjel native GPUI desktop application"

# Keep this evaluation app outside Sjel's production workspace and lockfile. One lockfile for
# the Mac app, the shared core and the iOS app keeps them on one GPUI snapshot (ISA.md
# Decisions 2026-10-15, step 0).
[workspace]
members = ["core", "ios", "ui"]

[features]
native-maps = ["sjel-gpui-ui/native-maps"]

[dependencies]
sjel-gpui-core = { path = "core" }
sjel-gpui-ui = { path = "ui" }
gpui-kit = { version = "=0.7.3", default-features = false, features = ["component", "assets"] }
# Same crate gpui-kit resolves. `#[derive(gpui::Action)]` expands to `gpui::` paths.
gpui = { package = "gpui-pre", version = "=0.3.9", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time", "net"] }
libsql = { version = "0.10.0", default-features = false, features = ["core"] }
zeroize = "=1.9.1"
# CoreAudio on the Mac, ALSA on Linux, CoreAudio on iOS: the soundscape window synthesizes its
# own audio (`src/soundscape`), and Web Audio is not available outside a browser. cpal reaches
# the device without any C toolchain step -- on macOS it goes through objc2-audio-toolbox, not
# bindgen.
cpal = "0.16"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSBox", "NSColor", "NSGlassEffectView", "NSGraphics", "NSResponder", "NSView", "objc2-core-foundation"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSGeometry"] }
# PDF pages are drawn by Core Graphics, the renderer already on this machine and already trusted
# for scanned pages (`tools/visocr`). Features are named rather than defaulted: the default set
# pulls every Core Graphics surface this app never calls.
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std", "CFCGTypes", "CFData"] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["std", "CGAffineTransform", "CGBase", "CGBitmapContext", "CGColorSpace", "CGContext", "CGDataProvider", "CGGeometry", "CGImage", "CGPDFDocument", "CGPDFPage"] }
# `gpui`'s `RenderImage` takes `image::Frame`, so a drawn page needs the same crate `gpui` resolves.
image = { version = "=0.25.10", default-features = false }
raw-window-handle = "=0.6.2"

[dev-dependencies]
# Same crate gpui-kit resolves; the name `gpui` is what the #[gpui::test] macro expands to.
gpui = { package = "gpui-pre", version = "=0.3.9", features = ["test-support"] }
# `cfg(test)` marks only the crate that declares the test, so `core`'s local-database gate has to
# arrive as a feature: without it these window tests would read this machine's real axon.db.
sjel-gpui-core = { path = "core", features = ["test-support"] }

[lints.rust]
unsafe_code = "deny"


# The root workspace's debug-info trim (`Cargo.toml`, `[profile.dev]`, ratified 2026-10-11), which
# this separate workspace never inherited: every GPUI dependency was built with full debug info.
# A profile only applies in the workspace root, so it is repeated here rather than shared.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Media ledger reads and local attachment intake.
kind           = "process"
name           = "media"
command        = ["target/release/media", "serve"]
build          = ["cargo", "build", "--locked", "--release", "--bin", "media"]
port           = "8102"
health_path    = "/health"
proxy_api_only = "true"
backup_paths   = ["data/media/attachments"]
backup_exclude = [".upload-*"]
backup_target  = "backup-target"
backup_retain  = "14"
backup_advise_days = "1"
backup_stale_days  = "7"

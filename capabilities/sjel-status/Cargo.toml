[package]
name = "sjel-status"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Aggregates live health from Axon's own HTTP-surfaced capabilities (transit-server, scout-server) for dashboard. Not LifeOS Pulse -- see capabilities/sjel-status/README.md."
publish = false

[[bin]]
name = "sjel-status"
path = "src/main.rs"

[dependencies]
# The shared SQLite file, for one read: host-watch's findings. That capability is a
# scheduled job with no port of its own (the manifest schema refuses one), so the
# machine's always-on status surface publishes them — the same shape /backups already
# has with tools/backup.sh's receipts. Read-only: host-watch owns the table.
sjel-config = { path = "../../libs/sjel-config" }
sjel-store = { path = "../../libs/sjel-store" }
sjel-server = { path = "../../libs/sjel-server" }
# The device registry, for one call: the shell admits a paired device on its signature
# (src/device_gate.rs, PRD Q119). The protocol stays owned by capabilities/devices.
devices = { path = "../devices" }
# The backup tables, the runner and the timing policy. A library, not a process: this
# surface already lists backup age and already triggers one, so the capability owns the
# records and this file owns the surface -- the same split as `devices` above.
backup = { path = "../backup" }
route-manifest = { path = "../../libs/route-manifest" }
axum.workspace = true
# Not `full`: these are the drivers this crate reaches for, verified with a lone
# `cargo check -p <crate> --all-targets`, which is the only build where a missing
# tokio feature is visible (a workspace build unifies them away).
# `process` for the systemd/launchd probes in registry.rs and backup.rs, `time` for the
# poll interval. Rest: `#[tokio::main]` plus `spawn`/`spawn_blocking`.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "process", "time"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
reqwest = { workspace = true, features = ["json", "stream", "query", "form"] }
# The shell's front door (src/proxy.rs): ServeDir/ServeFile for the built bundle, and
# ServiceExt::oneshot to hand a request to them from inside a fallback handler rather than
# mounting them as the fallback outright -- the proxy has to get first refusal on the path.
tower = { version = "0.4", features = ["util"] }   # ServiceExt::oneshot
tower-http = { workspace = true, features = ["fs"] }

# Signs a request with a real Ed25519 key in src/device_gate.rs's test, the same algorithm
# capabilities/devices verifies with.
[dev-dependencies]
ring = "0.17"

[lints]
workspace = true

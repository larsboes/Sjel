id = "RUSTSEC-2026-0206"
ignoreUntil = 2026-12-01
reason = "Unmaintained rustybuzz 0.20.1, runtime, via usvg 0.46 <- gpui-pre 0.3.6 <- gpui-kit 0.6.0 <- apps/gpui-prototype. rustybuzz shapes only SVG <text> elements. The app renders gpui-kit-assets 0.6.6 icons through usvg, and none of its 1,830 SVG files has a <text> element (grep, 2026-10-15), so nothing reaches it. No affected functions, CVSS, or fixed version. The successor is harfrust. Revisit when gpui-pre moves usvg to it, or when the app renders an SVG it did not ship."


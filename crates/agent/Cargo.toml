[package]
name = "sjel-agent-capability"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A coding agent on this machine, for the app and for the phone: sessions that outlive a request, a resumable stream, and the owner's permission in front of every call that writes or runs."
publish = false

[[bin]]
name = "agent-server"
path = "src/main.rs"

[dependencies]
agent-api = { path = "../agent-api" }
axum.workspace = true
base64.workspace = true
futures = "0.3"
getrandom.workspace = true
portable-pty = "0.9"
# The shared database, opened read-only by the `sql` plugin.
rusqlite.workspace = true
route-manifest = { path = "../route-manifest" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sjel-agent = { path = "../sjel-agent" }
sjel-config = { path = "../sjel-config" }
sjel-inference = { path = "../inference" }
sjel-server = { path = "../sjel-server" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
toml.workspace = true

[lints]
workspace = true

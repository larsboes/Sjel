url = "https://github.com/pascalorg/editor"
# Dropped from adopt on 2026-08-30 (PRD D18) — same move [lifeos] made for the same reason, and
# for the same rule: a verdict describes a relationship, and this one ended when the consumer did.
verdict = "inspiration"
license = "MIT"
why = "nothing tracks this entry, deliberately, since 2026-08-30: no consumer means no staleness to track. It is the geometry engine behind the interior capability, read while it still lived in the private overlay (it moved here 2026-08-30, PRD Q59): rooms, walls, openings, levels and a browser view, driven over MCP. Adopted rather than rebuilt after it returned 22.700000000000003 m2 for a polygon measured on site at 22,7. What it does NOT provide is the reason the capability exists: its check_collisions is documented as an axis-aligned bounding-box overlap test between item footprints, and every clearance rule this capability enforces is about the space that stays EMPTY — room to walk, to reach, to open a door, to let light past. None of those can be written as an overlap test, so src/clearance.ts is ours and the engine underneath is theirs. CONSUMER LOST 2026-08-30, which is why the verdict is inspiration and not adopt. The TypeScript capability spawned @pascal-app/mcp via bunx and pinned the version in its package.json on purpose -- \"a floating range would let the geometry engine change under a verified room model\". The Rust rewrite links nothing and shells out to nothing: the whole engine is capabilities/interior/src/geometry.rs, an exact Felzenszwalb/Huttenlocher distance transform plus a maximum-bottleneck search, both ours. Nothing in Sjel installs this now. What survives is the shape of the read, not the code -- and the 22.700000000000003 above, which is still the reason to prefer integer centimetres to floats for a measured room"

[stooq]
url = "https://stooq.com/q/d/l/"
verdict = "reject"
license = "n/a -- not adopted"
why = "MEASURED and rejected 2026-09-05, as the first choice for end-of-day equity and fund prices. GET https://stooq.com/q/d/l/?s=spy.us&i=d answered HTTP 200 with a 796-byte HTML body carrying a crypto.subtle.digest(\"SHA-256\", ...) proof-of-work loop at difficulty 4 and a <noscript> line demanding JavaScript -- not CSV. The 200 is the reason this row exists rather than a code comment: a client that checks the status code parses HTML as CSV and writes garbage into an append-only price table nothing can correct. The measurement bought a rule that outlives it: every provider in capabilities/finance/src/price.rs validates the SHAPE of the response body and never its status code, and the recorded body is the unit test for that rule (a_proof_of_work_gate_is_not_a_csv). Re-adopting means a new measurement at that date; the shape check stays either way"

[tradegate]
url = "https://www.tradegate.de/refresh.php"
verdict = "reject"
license = "n/a -- not adopted"
why = "MEASURED and rejected on the night of 2026-09-03: refresh.php answered with an empty body. A German exchange quote endpoint considered as a European alternative to Yahoo for instruments a US source prices badly. Recorded so the next person to consider it reads a measurement instead of repeating one"

[yahoo-finance-chart]
url = "https://query1.finance.yahoo.com/v8/finance/chart/"
verdict = "adopt"
license = "No published licence for this endpoint. Yahoo's terms govern use and forbid redistribution, so rows stay in the private overlay and the shared database and are never republished -- the demo is seeded from synthetic data and carries no fetched quote"
why = "Daily adjusted close history per instrument, the only source in this build that can produce the 120 observations capabilities/finance/src/risk.rs needs before it will report a volatility. Unofficial and undocumented. MEASURED 2026-09-05 from a German residential connection: GET /v8/finance/chart/SPY?range=5d&interval=1d answered HTTP 200 with five daily closes and chart.error null, with NO cookie and NO crumb -- so the bare call is the primary path and it is verified live. The EU consent-plus-crumb handshake is implemented as the RETRY path and is unverified live: GET https://query1.finance.yahoo.com/v1/test/getcrumb answered HTTP 429 Too Many Requests both with and without the A3 consent cookie that GET https://fc.yahoo.com sets (that endpoint answers 404 and sets the cookie anyway). FLIP CONDITION, written here rather than remembered: retired the day two consecutive manual runs get a non-200 that a fresh consent-plus-crumb handshake does not fix, or the day Yahoo publishes terms forbidding this use. On retirement the broker provider still prices every holding and the feature degrades to no history rather than breaking. The response carries IEEE doubles, so an exact decimal is CHOSEN at the boundary at four decimal places rather than recovered. RE-MEASURED 2026-09-08 from the same connection, three days later, because a rate limit read once is a reading of the minute and generalising it into a property of the endpoint is the fifth silent failure this row already carries the scar of. Both endpoints answered the same as on 09-05 and neither reading moved: the bare chart GET (range=5d, no cookie, no crumb) answered HTTP 200 in 1,756 bytes with chart.error null and five SPY daily closes in USD, oldest 761.780029296875 and newest 767.219970703125 -- oldest-to-newest and NOT the range, which is a distinction a reader would otherwise have to guess: the highest of the five is 773.1699829101562. The newest bar is the session in progress and moves while it is open, so it dates the reading rather than describing the endpoint -- a verifier repeating the call the same evening read 767.260009765625 in that slot, with the four settled closes identical; GET /v1/test/getcrumb answered HTTP 429 with the 19-byte body 'Too Many Requests', with and without the A3 cookie; GET https://fc.yahoo.com still answers 404 and still sets A3 (Domain=.yahoo.com, Max-Age=31557600, Secure, HttpOnly). Nothing changed in the handshake on the strength of it. What the second reading buys is narrow and worth stating: the crumb 429 is no longer a measurement of one minute, and it is still not a property of the endpoint -- two readings three days apart from ONE network are two readings. The primary path is 200 for the second time, which is what keeps the handshake the retry path and keeps it marked unverified live"

[yfinance]
url = "https://github.com/ranaroussi/yfinance"
verdict = "inspiration"
license = "Apache-2.0"
why = "Read for one thing only: the sequence that obtains an EU consent cookie from fc.yahoo.com and then a crumb from /v1/test/getcrumb before calling the v8 chart endpoint. No code vendored, no dependency taken, no re-sync path -- the handshake is reimplemented in Rust against reqwest in capabilities/finance/src/price.rs. The row exists because reading an upstream's solution and reimplementing it is an adoption of its design, and this register is where an adopted design is recorded"

[ecb-data-portal]
url = "https://data.ecb.europa.eu/help/api/data"
verdict = "adopt"
license = "ECB reference rates are published for free reuse with attribution; the API output carries no separate licence and the series identifier is reproduced in each stored row"
why = "Daily euro foreign-exchange reference rates, read as CSV from the SDMX data endpoint into finance_fx_rates. MEASURED 2026-09-05: GET https://data-api.ecb.europa.eu/service/data/EXR/D.USD.EUR.SP00.A?format=csvdata&lastNObservations=2 answered HTTP 200 with a 31-column header and the rows TIME_PERIOD=2026-09-03 OBS_VALUE=1.1615 and TIME_PERIOD=2026-09-04 OBS_VALUE=1.1622. Read by COLUMN NAME so an inserted column does not shift the parse, and lastNObservations bounds the request. Rates are stored as published -- quote units per one base unit -- and never inverted at write time, because a division is where an exact decimal stops being exact. FX is runway rather than need today: every holding row carries one currency, so nothing reads these rows yet and the table exists so the first foreign holding does not need a migration this crate has no path for"

[frankfurter-api]
url = "https://frankfurter.dev"
verdict = "adopt"
license = "MIT for the server; the underlying data carries the ECB's own attribution"
why = "The FX fallback when the ECB Data Portal is unreachable, serving the same ECB reference rates over a simpler JSON shape. MEASURED 2026-09-05: GET https://api.frankfurter.dev/v1/latest?base=EUR answered HTTP 200 with date 2026-09-04 and thirty-odd rates. A second path to one fact rather than a second fact, so a row it produces still carries source='ecb' and the fetch row's detail names which door answered -- provenance stays visible without the reader having to reconcile two source names for one published rate. Latest only, never a history: this exists so a stale table gets one more chance to update, not so it becomes the primary series"

[pi-subagents]
url = "https://github.com/tintinweb/pi-subagents"
verdict = "adopt"
license = "MIT at the repository root; the notice is reproduced in Packs/harness/LICENSE"
why = "The pi extension that gives pi a subagent tool at all: an `Agent` call, custom agent types from ~/.pi/agent/agents/*.md carrying per-agent tools/model/thinking, and nested delegation. Without it Packs/deliberation's seven agent files are deployed, on disk, and read by nothing, and the three skills that dispatch them lose the tool-restricted members their contracts are written for -- so this is the precondition for a Pack that already exists, not a convenience. AUDITED AND VENDORED 2026-09-16 into Packs/harness/pi-packages/pi-subagents: src/, package.json, tsconfig.json and LICENSE, with test/, docs/, examples/, .github/, media/ and the upstream README and CHANGELOG deliberately NOT copied. VENDORED, NOT INSTALLED, and that reverses this register's own convention that a third-party tool is driven through its own install/update tooling and never vendored into Packs/ -- see tools/agent-integrations.sh, whose table this row deliberately does not join. That convention is right for anything Sjel merely consumes; it is wrong for the extension carrying the agent types of a Pack Sjel maintains, because `pi install` cannot keep a package inside a repository we edit: an npm source is opaque, and a git source is cloned to ~/.pi/agent/git and RESET AND CLEANED on reconcile (pi docs/packages.md), which destroys the customization that is the reason to own it. A local path is added to settings without copying, so tools/packs-pi registers it as a third artifact kind beside skills/ and extensions/ and the checkout stays in the Pack. Local deltas: one doc comment in src/output-file.ts, whose POSIX path example became a placeholder so it stops reading as a workstation path to tools/check-publication-hygiene.sh -- the only gate that objected to the vendored tree, caught by running the gate rather than by assuming it would pass. No behavioural change. Second local delta, 2026-09-27: upstream's biome.json joins the vendored set (formatter off, as upstream), and package.json's lint and check scripts drop test/ and the vitest run, because test/ is deliberately not vendored. The check CI runs had failed on the missing directory since the vendoring. tsconfig.json is upstream's, added to the vendored set so a customization can be typechecked before a restart. node_modules is installed in place with `bun install` and never committed -- the one prerequisite this row adds to a fresh machine, and the reason the vendored tree is ~1.0M of source rather than self-contained. Re-reading upstream is a manual act at the next audit: nothing updates a local-path package, so there is no drift to report and no staleness to track"

[accordion]
url = "https://github.com/a-Fig/Accordion"
verdict = "adopt"
license = "MIT at the repository root; the notice is reproduced in Packs/harness/LICENSE"
why = "A pi extension for context-window management: a Map of every block in the window, manual and automatic folding, and conductors that decide between turns what has gone cold. AUDITED AND VENDORED 2026-09-16 into Packs/harness/pi-packages/accordion, then DETACHED: no .git, no remote, no re-sync path, and upstream was read once at the revision the Pack LICENSE records. That detachment is deliberate and is the difference from [pi-subagents] -- there, upstream stays a source to re-read against; here Sjel owns the code and is expected to diverge. Vendored rather than installed because the two strongest conductors, thermocline and triptych, ship with the repository and are absent from the npm package by design (the upstream README says so at the conductors section), so `pi install` could never supply the part the project calls its proof. What was taken: extension/, core/, conductors/, plus exactly one module from app/ -- app/src/lib/live/registry.ts, the only file outside those trees the extension reaches, measured as an import closure over extension/accordion.ts and every non-test module under core/ and conductors/ (38 local modules total, 1 of them in app/). What was NOT taken: app/ (the SvelteKit and Tauri desktop application, 6.2M), brand/ (24M of PDFs, fonts and logo PNGs), docs/ (6.8M of demo media), .github/, and every generated artifact. NO BUILD OUTPUT IS COMMITTED AND NO BUILD STEP EXISTS: upstream builds accordion.js at prepack only because the npm tarball's `files` omits core/ and the shared app module, and both are vendored here, so a wrapper package.json beside the vendored trees points pi at extension/accordion.ts directly and the TypeScript loads as-is. Two deliberate deltas inside upstream's own files, both in extension/accordion.ts and both env-reversible rather than literal flips: folding is armed from ACCORDION_FOLDING_DEFAULT (default on) with a catalog-validated conductor attached from ACCORDION_CONDUCTOR_DEFAULT (default triptych), where upstream hardcodes setFolding(false) and makes folding opt-in per session; and session_before_compact cancels pi's native compaction only while a conductor is attached, where upstream cancels it whenever folding is armed. That second one matters because with folding on by default the upstream rule removes the session's overflow safety net in the window where nothing is folding yet -- no conductor attached, or one that crashed or was detached -- leaving pi's protection off with nothing replacing it. Both deltas and their reasoning are recorded in Packs/harness/README.md, and setting ACCORDION_FOLDING_DEFAULT=off restores upstream's behaviour exactly, suppression rule included. Everything else upstream is byte-identical. node_modules is installed in place with `bun install` in extension/ and never committed -- esbuild and jiti are needed only for the smoke scripts and build, ws is a genuine runtime dependency, and typebox plus @earendil-works/* are peer-provided by pi. Consequence worth stating plainly: this extension folds context between turns once registered, which changes every session rather than one skill, so the conductor picker's None setting and the detach control are the ways back to unmanaged context"

[pi-web-access]
url = "https://github.com/nicobailon/pi-web-access"
verdict = "adopt"
license = "MIT at the repository root; the notice is reproduced in Packs/harness/LICENSE"
why = "Web search, page fetch, PDF extraction and video analysis for pi, across roughly twenty provider adapters. AUDITED AND VENDORED 2026-09-16 into Packs/harness/pi-packages/pi-web-access, then DETACHED: no .git, no remote, no re-sync path. It was already in use as `npm:pi-web-access`, an opaque installed version, and the reason to take the source over is the one that applies to every vendored entry in this register: a provider that changes shape is a patch we can write, and an npm version is not. Taken: the root *.ts sources, package.json, tsconfig.json and LICENSE. Not taken: test/ (1.0M across 82 files), pi-web-fetch-demo.mp4, banner.png, CHANGELOG.md, README.md, SECURITY.md, and the upstream lockfile. NO BUILD STEP: upstream's own pi manifest already points at ./index.ts, so the TypeScript loads directly, verified by importing the vendored entry before registering it. Nine runtime dependencies (readability, defuddle, linkedom, p-limit, promise.try, turndown, typebox, unpdf, undici) install in place with `bun install` and are never committed. The npm package was removed from settings.json in the same operation, because two extensions registering the same web tools would both load and the failure would read as provider flakiness rather than as a duplicate. Note the overlap with Packs/knowledge's defuddle skill: that skill extracts a page to markdown through the Defuddle CLI, this extension bundles defuddle as a library for its own extract path, and neither knows about the other -- a real duplication, recorded here rather than resolved, because which one should own fetch-to-markdown is a decision about the knowledge Pack and not about this row"

[defuddle]
url = "https://github.com/kepano/defuddle"
verdict = "adopt"
license = "MIT; nothing is vendored, so no notice obligation falls on this repository -- Packs/knowledge/LICENSE covers kepano/obsidian-skills, a different repository by the same author"
why = "Reads a web page as clean markdown with navigation, ads and clutter removed. INSTALLED GLOBALLY, NOT VENDORED -- and this row has now been through both arrangements, which is the part worth keeping. It was vendored on 2026-09-16 into Packs/knowledge/vendor/defuddle and un-vendored the same day, because vendoring was solving the wrong problem. The defect it was meant to fix was real: the defuddle SKILL told the model to run a CLI that was not installed and offered `npm install -g defuddle` as the fix, so following the skill meant installing a global package to read one page while a native fetch_content tool did the same job. The first fix vendored the published dist so the fallback could not be a dead pointer -- but that put 2.0M of somebody else's build output in the tree, left the install unrecorded on every OTHER machine anyway, and made Sjel the maintainer of a package that publishes its own releases. What actually killed the dead pointer was the install, not the vendoring. So: installed through its own tooling with `npm install -g defuddle`, landing at $(npm prefix -g)/bin/defuddle (Homebrew's /opt/homebrew/bin on this machine, no sudo needed), version 0.19.3 at this audit -- the same version the vendored copy had pinned. The skill now states the install command and where it lands, so the requirement is documented rather than implied, which is what vendoring was standing in for. In pi the CLI is not used at all: the skill prefers fetch_content and keeps this as the fallback for a harness without a fetch tool. OWNERSHIP, set 2026-09-16: in pi, fetch_content owns fetch-to-markdown and the skill defers to it, so the CLI is not the pi path at all. What remains on disk is two INSTALLS IN TWO ROLES rather than two copies: the library pi-web-access imports from its own node_modules (a declared dependency, used as the primary extractor in its extract.ts, and gitignored -- not part of this repository), and this CLI, for a harness with no fetch tool. They are deliberately NOT collapsed into one, because they are not interchangeable: pi-web-access needs a library it can import, the skill needs a command on PATH, and pointing either at the other's location would be fragile in a different way (node_modules is wiped and reinstalled; a global binary is not). Both are pinned to the same version, 0.19.3, and that lockstep is the thing to preserve -- if they drift, one path silently reads a different renderer than the other, which is the failure this paragraph exists to prevent rather than a duplication to remove"

[tauri-plugin-notification]
url = "https://github.com/tauri-apps/plugins-workspace/tree/v2/plugins/notification"
verdict = "adopt"
license = "MIT OR Apache-2.0"
why = "Local notifications in the phone app for a new Sparpreis low (dashboard/src/lib/travel/fare-alerts.ts). The official Tauri plugin, so adopt rather than a hand-written UNUserNotificationCenter bridge. Crate pinned =2.4.0 in dashboard/src-tauri/Cargo.toml and the JS binding @tauri-apps/plugin-notification 2.4.0 in dashboard/package.json. Local only: no APNs entitlement and no push key, ruled 2026-09-25 over real push, which needs a paid developer team and a C3 key on the Mac. The cost of that choice is latency: an alert waits until the app is opened or foregrounded"

[rcgen]
url = "https://github.com/rustls/rcgen"
verdict = "adopt"
license = "MIT OR Apache-2.0"
why = "Makes the self-signed certificate for the local-network listener (libs/sjel-server/src/lan.rs, PRD Q119), once, on first start. Maintained by the rustls organisation, and used with rustls' own default provider (aws-lc-rs), which reqwest already puts in the tree, so it adds no second crypto library. No CA is involved: the phone pins the certificate's SHA-256, so what matters is the key, not the chain. Chosen over shelling out to openssl, whose macOS build is LibreSSL and whose flags differ by version, and over shipping a certificate, which would put one key on every deployment. Audited 2026-09-25"

[rustls]
url = "https://github.com/rustls/rustls"
verdict = "adopt"
license = "Apache-2.0 OR ISC OR MIT"
why = "Declared directly on 2026-09-25 for the local-network transport (PRD Q119): the Mac's LAN listener (libs/sjel-server/src/lan.rs, with tokio-rustls and hyper-util) and the phone's pinned-certificate client (dashboard/src-tauri/src/mac_bridge.rs). It was already in both trees through reqwest's default TLS. The phone's verifier accepts exactly one certificate, by SHA-256, and still checks the handshake signature with the provider's own functions, so pinning replaces the chain check and nothing else. The provider is named explicitly in both places, because ServerConfig::builder() panics when a tree enables two"

[tauri-plugin-barcode-scanner]
url = "https://github.com/tauri-apps/plugins-workspace/tree/v2/plugins/barcode-scanner"
verdict = "adopt"
license = "MIT OR Apache-2.0"
why = "The phone scans the Mac's pairing QR code (dashboard/src/lib/setup/SetupSjel.svelte), which carries the node's address, certificate fingerprint and a one-time code. The official Tauri plugin, so adopt rather than a hand-written AVCaptureMetadataOutput bridge. Mobile only; the app calls it through invoke('plugin:barcode-scanner|scan') and does not take the npm wrapper. Added 2026-09-27 at 2.4.6 (2026-08-31): 2.5.0 was under a day old. Read: ios/Sources/BarcodeScannerPlugin.swift returns the decoded string only. On iOS 14 and later `scan` does not ask for camera access; it rejects until `request_permissions` has been called, so the app calls that first (found on the phone 2026-09-27)."

[uqr]
url = "https://github.com/unjs/uqr"
verdict = "adopt"
license = "MIT"
why = "Draws the pairing QR code on the Mac as SVG (dashboard/src/lib/DeviceRegistry.svelte). No dependencies of its own, ESM, renders from the encoded modules only. Added 2026-09-27 at 0.1.3 (2026-04-03)."

[package]
name = "sjel-gpui"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-only"
description = "Sjel native GPUI desktop application"

[package.metadata.sjel]
minimum_macos = "27.0"

# Shared GPUI workspace for desktop, core, UI, and iOS.
[workspace]
members = ["core", "ios", "ui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
license = "AGPL-3.0-only"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.dependencies]
sjel-gpui-core = { path = "core" }
sjel-gpui-ui = { path = "ui" }
gpui-kit = { version = "=0.9.0", default-features = false, features = ["component"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1" }
libsql = { version = "0.10.0", default-features = false, features = ["core"] }
zeroize = "=1.9.1"

[features]
native-maps = ["sjel-gpui-ui/native-maps"]
default = ["gpui-fast"]
# Draws with GPUI Fast instead of the gpui-pre snapshot. The iOS app does not enable it.
gpui-fast = ["gpui-kit/gpui-fast"]
# The NSH trial (docs/plans/gpui.md §11): NSH screens inside the Mac app, drawn by GPUI Fast.
nsh-trial = ["gpui-fast", "sjel-gpui-ui/nsh", "dep:nsh-platform-gpui", "dep:nsh-base"]

[dependencies]
sjel-gpui-core.workspace = true
sjel-gpui-ui.workspace = true
gpui-kit = { workspace = true, features = ["assets"] }
chrono.workspace = true
futures.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "net"] }
# CoreAudio on the Mac, ALSA on Linux, CoreAudio on iOS: the soundscape window synthesizes its
# own audio (`src/soundscape`), and Web Audio is not available outside a browser. cpal reaches
# the device without any C toolchain step -- on macOS it goes through objc2-audio-toolbox, not
# bindgen.
cpal = "0.18"

[dependencies.nsh-platform-gpui]
git = "https://github.com/longbridge/nsh"
rev = "058a745ad2"
default-features = false
optional = true

[dependencies.nsh-base]
git = "https://github.com/longbridge/nsh"
rev = "058a745ad2"
optional = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSBox", "NSColor", "NSGlassEffectView", "NSGraphics", "NSPasteboard", "NSResponder", "NSView", "objc2-core-foundation"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSGeometry"] }
raw-window-handle = "=0.6.2"

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
# `cfg(test)` marks only the crate that declares the test, so `core`'s local-database gate has to
# arrive as a feature: without it these window tests would read this machine's real sjel.db.
sjel-gpui-core = { workspace = true, features = ["test-support"] }

[lints]
workspace = true


# Same as the root `Cargo.toml` profile; a profile applies only at its own workspace root.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

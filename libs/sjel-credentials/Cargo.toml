[package]
name = "sjel-credentials"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Provider-neutral credential references and secret operations for Sjel operator tools."
publish = false

[lib]
name = "sjel_credentials"
path = "src/lib.rs"

[dependencies]
base64.workspace = true
getrandom.workspace = true
reqwest = { workspace = true, features = ["blocking", "json", "form"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
sjel-config = { path = "../sjel-config" }
sjel-http = { path = "../sjel-http" }
thiserror.workspace = true
toml.workspace = true
zeroize.workspace = true

[lints]
workspace = true

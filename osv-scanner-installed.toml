id = "GHSA-2m5v-pch6-74hx"
ignoreUntil = 2027-01-01
reason = "undici 6.29.0, fixed in 6.29.1: TLS certificate validation can be bypassed when an Agent drops its tls options. Reach: npm@11.20.0 (Homebrew's bundled npm) > node-gyp > undici 6.28.0, which the advisory's range below 6.29.1 also covers, npm's own tree, used when node-gyp downloads Node headers for a native addon build. A MITM on that download is the exposure. Ends when npm ships node-gyp on undici >= 6.29.1."


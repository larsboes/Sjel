[package]
name = "places"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Canonical place registry, cached Nominatim geocoder, and the spend/travel/people map layers."
publish = false

[lib]
name = "places"
path = "src/lib.rs"

[[bin]]
name = "places-server"
path = "src/main.rs"

[dependencies]
# Howard Hinnant's civil-from-days pair, shared rather than copied. No
# dependencies of its own, which is why the four copies existed.
civil-date = { path = "../../libs/civil-date" }
# Outbound HTTP goes through one factory: the user-agent, the timeout and the
# connection pool are decided there, not at each call site (libs/sjel-http).
sjel-http = { path = "../../libs/sjel-http" }
sjel-config = { path = "../../libs/sjel-config" }
sjel-server = { path = "../../libs/sjel-server" }
sjel-store = { path = "../../libs/sjel-store" }
# The candidate identity, shared with capabilities/finance, which mints it.
# A lib rather than a dependency on finance: a capability does not link another
# capability's crate, and the shape belongs to neither of them alone.
candidate-fingerprint = { path = "../../libs/candidate-fingerprint" }
route-manifest = { path = "../../libs/route-manifest" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# The database, after PRD Q45 retired Postgres. Bundled so the deployment does not
# depend on whichever SQLite the host ships; upstreams.toml [rusqlite] has the
# measurement that settled it. Blocking, driven from spawn_blocking, same as every
# store-owning capability.
rusqlite.workspace = true
# Not `full`: these are the drivers this crate reaches for, verified with a lone
# `cargo check -p <crate> --all-targets`, which is the only build where a missing
# tokio feature is visible (a workspace build unifies them away).
# `rt-multi-thread` for the explicit `Runtime::new()` in main.rs as well as the tests,
# `net` for the `TcpListener` the server tests bind.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net"] }
axum.workspace = true
# Raw Amex export parsing for `backfill amex`; the same crate finance's import
# pipeline uses, so quoting and embedded newlines behave identically.
csv = "1.4"
# The geocode cache key and the stable place id. The candidate fingerprint used
# to be hashed here too; it moved to libs/candidate-fingerprint on 2026-08-28.
sha2.workspace = true
# Outbound HTTP to Nominatim and transit's suggest surface; the blocking client,
# matching capabilities/transit/src/hafas.rs.
reqwest = { workspace = true, features = ["blocking", "json", "query", "form"] }

[lints]
workspace = true

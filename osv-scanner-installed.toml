# Exceptions for `tools/audit`'s SECOND osv-scanner pass — the one over software installed
# outside this checkout. The repository scan, and CI's, read `osv-scanner.toml`, whose rule is
# that a known vulnerability stays blocking and only informational advisories are excepted.
#
# This file is different on purpose, and the difference is the only reason it exists. A finding
# in installed software frequently has no fix reachable from this machine:
#
#   * `cargo install --locked` resolves the Cargo.lock PUBLISHED inside the crate, so a
#     transitive crate cannot be moved without the maintainer republishing. That is also why the
#     audit's model of "installed" is accurate: it reads that same file.
#   * a global npm tree is resolved by whoever published the package. A version range is
#     re-resolved only by reinstalling the package that declares it, and an EXACT pin cannot be
#     re-resolved at all.
#   * a package installed here is not on any registry, so no install command can touch it.
#
# So an entry here accepts a known vulnerability, states the reach, and names what ends it. The
# date is when the acceptance stops, not when a fix is expected.
#
# The second pass runs at `--verbosity warn`, so `tools/audit` prints osv-scanner's "unused
# ignores" list for this file on every run. An entry named there no longer matches an installed
# package: delete it.
#
# Reviewed 2026-10-04: 36 findings became 22 when two global npm packages were reinstalled and
# their subtrees re-resolved (`@mariozechner/snap-happy`, `@modelcontextprotocol/server-github`,
# 14 findings including both 9.8 simple-git entries outside npm's own tree). The entries below
# are what no install command on this machine could move.
#
# Revised the same day, later: `@modelcontextprotocol/server-github` and
# `@modelcontextprotocol/server-filesystem` were REMOVED from the global tree outright. Neither
# was registered by any harness on this machine — `~/.pi/agent/mcp.json` holds only `sjel`, and
# `~/.claude.json` neither — so nothing depended on them. That ended the one entry below
# that no version could ever move, by removal rather than by a replacement: 23 entries became
# 22. The one remaining use of `@modelcontextprotocol/*` is the SDK as a LIBRARY inside
# `Packs/harness/pi-packages/pi-web-access` (`baizhi.ts`, `zai.ts`), which declares a range and
# resolves well past the vulnerable version.

# ── Inside npm's own dependency tree ─────────────────────────────────────────────
#
# `npm@12.2.0` is the latest release, and these are dependencies of npm itself —
# node-gyp, minimatch, make-fetch-happen, socks-proxy-agent. Nothing installs them
# separately, so no command moves them: a newer npm is the only route, and there is none.
# The reach is npm's own process. One of them has no fixed version at all.
# Refreshed 2026-10-24: npm moved to 12.2.1 and its node-gyp pin re-resolved undici to 6.29.0,
# which retired the three 6.28.0 entries that stood here (they had stopped applying, and this
# pass runs at `--verbosity error`, so nothing announced that). The two ids below are what 6.29.0
# actually trips. Reach is unchanged and was re-measured, not assumed:
# `npm@12.2.1 > node-gyp@13.0.0 > undici@6.29.0` in `npm ls -g --all`.
#
# Third swing, 2026-10-30, and the reason the three entries below are back. `npm` was an alias of
# the `node` formula, so every node revision bump restored the bundled npm into
# `/opt/homebrew/lib/node_modules/npm` and undici 6.28.0 returned with it. That happened on
# 2026-10-24 (the refresh above) and again on 2026-10-30 at 02:18 (`26.13.0` → `26.13.0_1`).
# A second npm at `~/.local` was tried and removed the same day: Homebrew's PATH comes first in
# `tools/host-patch.sh`, so the daily job and its audit still ran 11.20.0, `npm ls -g` never walked
# the `~/.local` copy, and nothing upgraded it. One binary has one owner (`tools/host-patch.sh`
# header), so npm is Homebrew's bundled copy, and the three entries below accept it as the copy
# that runs. They end when the node formula's bundled npm moves undici past 6.28.0.

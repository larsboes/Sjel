[package]
name = "sjel-web-links"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A local-first launcher for recurring web destinations."
publish = false

[lib]
name = "web_links"
path = "src/lib.rs"

[[bin]]
name = "links"
path = "src/main.rs"

[[bin]]
name = "web-links-server"
path = "src/server.rs"

[dependencies]
axum.workspace = true
route-manifest = { path = "../../libs/route-manifest" }
schemars = "1.2.2"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
sjel-config = { path = "../../libs/sjel-config" }
sjel-server = { path = "../../libs/sjel-server" }
sjel-store = { path = "../../libs/sjel-store" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net"] }
url = "2.5"
rusqlite = { workspace = true, features = ["backup"] }

[dev-dependencies]
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true

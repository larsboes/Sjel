# scouting — host process, not a container. Shape: schemas/service.toml.example.
kind        = "process"
name        = "scouting"
command     = ["target/release/scout-server"]
build       = ["cargo", "build", "--locked", "--release", "--bin", "scout-server"]
# 8084, not 8080: vaultwarden publishes 8080 on the host, and the runner bringing the
# whole enabled set up is what turned that latent clash into a bind error. The process
# reads this number back through SJEL_PORT, so this line is the only place it lives.
port        = "8084"
health_path = "/health"
ready_path  = "/ready"   # availability is judged on this, not on liveness (#126)

# scout-server serves /discover at the root; the dashboard has always called it there.
proxy_extra = ["/discover"]

# No `requires`: opportunities, links and the proposal inbox live in the shared
# SQLite file this process opens itself, so there is no database service to start
# first (PRD Q45).

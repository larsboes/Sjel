why = "Retired 2026-08-27 (PRD Q45) with the Postgres client: r2d2_sqlite is the manager now, and neither this crate nor the client appears in Cargo.lock. The judgement that survived is the pool itself -- checkout, return, health check, sizing and timeout have nothing to do with which database is on the other end."

[sha2]

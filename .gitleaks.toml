[extend]
useDefault = true

[[allowlists]]
description = "RFC 6455's published example WebSocket nonce is test data, not a credential."
paths = ['''Packs/harness/pi-packages/accordion/extension/smoke\.mjs$''']
regexTarget = "secret"
regexes = ['''dGhlIHNhbXBsZSBub25jZQ==''']

[[allowlists]]
description = "The Sjel Clipper manifest's `key` is the public half of a key pair; Chrome derives the extension id from it."
paths = ['''capabilities/comms/clipper/src/manifest\.chrome\.json$''']
regexTarget = "line"
regexes = ['''^\s*"key": "MII[A-Za-z0-9+/=]+",?$''']

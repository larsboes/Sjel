# bunfig.toml — the dashboard. Two settings, added 2026-09-22 (Q109), and why they are HERE
# rather than in the repository's root bunfig.toml is the first thing to know about this file.
#
# Bun reads bunfig.toml from the directory it runs in. It does NOT walk up to a parent: measured
# on Bun 1.4.2 on 2026-09-22, `bun install` run from dashboard/ ignores ../bunfig.toml entirely,
# and the same was measured from a subdirectory of a scratch tree with a pristine hold in its
# parent. Axon has no root package.json, so a hold written into the root file would guard a door
# that is already open -- CONTRIBUTING.md#patch-first's own words about Homebrew formulae and the bot
# that was never installed. The root bunfig.toml therefore still carries [test] and nothing else,
# and says so.
#
# CONSEQUENCE, stated because it is the reason tools/check-bun-install-policy.sh derives this set
# instead of listing it: every tree that resolves dependencies needs its own copy of both blocks.
# A capability that grows a UI enters both this requirement and CI's ui-check job by existing.
#
# ---- [install] minimumReleaseAge: the npm-only adoption hold ---------------------------------
#
# Q74 and Q77 (2026-09-02) deleted the adoption cooldown and every version pin, on the measured
# argument that a hold needing a human to end it ends late, and that Homebrew's delayed patches
# were the more expensive failure. That reasoning holds, and it is NOT reversed here. What it did
# was apply one policy across ecosystems whose threat models are not alike.
#
# A malicious Homebrew formula is close to unheard of. npm is the registries' opposite: it is the
# most actively wormed distribution channel in software, and the campaigns of the last year are
# all measured in hours from live to takedown -- chalk/debug (Sep 2025) about 2.5 hours,
# Shai-Hulud about 12, and Mini Shai-Hulud / TanStack (May 2026) about 3. A 24-hour hold catches
# all three with room to spare. It is also the ONLY control that addresses the class this
# repository's own README names as undetected: the advisory for a malicious release is written
# after somebody finds it, so no scanner and no audit can see it at the moment it is published.
# A cooldown is not an audit gate somebody has to end; it is a bet that other people's observation
# finishes before this install does.
#
# 24 hours, not the seven-to-fourteen days that were removed: the length matters, and the long
# hold's fault was that it ended late, not that it existed. The measured campaigns above are
# hours, and JavaScript security fixes essentially never need to land inside a day. The exception
# path exists for the one that does: minimumReleaseAgeExcludes, an array of package names. It is
# spelled with the trailing "s" -- `minimumReleaseAgeExclude` is accepted by Bun 1.4.2 and
# silently ignored, measured 2026-09-22, which is a way to write a control that reads as present
# and does nothing.
#
# SCOPE, and this is a non-obvious part of the shape: `bun install --frozen-lockfile` does NOT
# apply the hold. Measured 2026-09-22 with a 999999999-second hold and a committed lockfile -- the
# install succeeded and resolved from the lockfile. That is deliberate on Bun's part and it is what
# makes this safe to turn on: CI, pages.yml and the accordion's vendored tree all install frozen
# and are unaffected, and what the hold actually gates is fresh resolution -- `bun add`, a new
# dependency, and a lockfile regeneration. Those are the paths a poisoned publish would have to
# travel to reach this repository unattended.
#
# ---- [install.security] scanner: the detection half ------------------------------------------
#
# CONTRIBUTING.md#patch-first named "nothing detects a malicious release" as one of two gaps. The
# cooldown is a bet on someone else noticing; this is the noticing, read at install time. It is
# the Socket scanner (SocketDev, MIT, registered in upstreams.toml), which is the category that
# catches malware and typosquats -- tools/audit's osv-scanner already covers CVEs and cannot see
# this, so the two do not overlap.
#
# THREE MEASURED FACTS ABOUT IT, because each one changes what it is worth.
#
# 1. IT IS NETWORK-BACKED. The scanner's free mode calls Socket's public firewall API for each
#    package batch. The API is therefore an operational dependency of the check; a firewall,
#    proxy or outage can change the scan's availability independently of the lockfile. CI runs
#    `bun pm scan` and records its result, but this is not a claim that a third-party API can never
#    be unavailable.
# 2. IT MUST BE A REAL DEPENDENCY OF THIS TREE. Configured in bunfig and absent from node_modules,
#    `bun install` hard-fails with SecurityScannerNotInDependencies, measured 2026-09-22. That is
#    why it is a devDependency here and NOT in a global ~/.bunfig.toml: a global scanner block was
#    measured to break every unrelated project on the machine that does not install it itself. The
#    laptop-wide hold holds only the hold.
# 3. FREE MODE NEEDS NO SECRET. Without SOCKET_API_KEY it scans against Socket's public API and
#    prints a free-mode warning; a key adds this organization's policy and nothing else. No secret
#    is required for the CI job to run the public scan.
#
# Cost of the scan: the dashboard's real dependency set was scanned successfully on 2026-09-22
# with no advisories, and the first cold run took about 4.5 seconds. Configuring a scanner disables
# Bun's auto-install, which these trees never relied on -- every install here is explicit and
# frozen.
[install]
minimumReleaseAge = 86400

[install.security]
scanner = "@socketsecurity/bun-security-scanner"

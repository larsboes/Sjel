# sjel-status — host process, not a container. Shape: schemas/service.toml.example.
#
# autostart, because this is the piece that starts the others: the dashboard asks it
# to bring a capability up when you open that capability's surface. Something has to
# be listening for that ask, and it is deliberately the smallest process in the set.
kind        = "process"
name        = "sjel-status"
command     = ["target/release/sjel-status"]
# Signed after the build so the firewall grant for the Same Wi-Fi listener survives rebuilds
# (tools/codesign-binary.sh says why). A machine without an identity keeps the ad-hoc signature.
# No quotes inside the command: tools/lib/toml.sh keeps a backslash-escaped quote literally.
build       = ["sh", "-c", "cargo build --locked --release --bin sjel-status && tools/codesign-binary.sh ${CARGO_TARGET_DIR:-target}/release/sjel-status dev.sjel.sjel-status"]
port        = "8082"
health_path = "/health"
autostart   = "true"

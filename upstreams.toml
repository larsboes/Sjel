license = "Apache-2.0 from 0.9.25 on -- upstream relicensed there, keeping LICENSE-MIT and a NOTICE covering contributions made before it, so releases at or below 0.9.24 are MIT. The 2026-08-06 bump from 0.9.19 crossed that line deliberately; this field named MIT until then and the divergence was recorded in advance precisely so the crossing could not happen silently. Tracking latest since Q77 (2026-09-02) keeps it on the Apache-2.0 side, and a further relicence upstream would land here unannounced -- the licence of a running dependency is now something to re-read, not something a version literal freezes. Neither license raises a compatibility question here -- graphify runs as a separate process under `uv tool run` and is never vendored, so Sjel's own MIT licensing is untouched either way"
why = "code-dependency-graph extraction for tools/graphify.sh, and the source of the agent integrations tools/agent-integrations.sh installs. Consumed via `uv tool run --from graphifyy` (CONTRIBUTING.md#language-tooling), which resolves the LATEST release on every run since Q77 (2026-09-02) -- still deliberately NOT the bare `graphify` on PATH, which is a separate global install the interactive graphify skill upgrades for its own purposes and would drag Sjel onto whatever that happens to be; `--from` keeps Sjel's runs in their own ephemeral environment. This row said 'version selection is never just use latest' until Q77, and the measurement below is exactly the cost now accepted: a single-maintainer, fast-moving project (200 PyPI releases; 0.8.44 in June, 0.9.19 in July, 0.9.32 by August) can ship a release that breaks `update <path>` on this repo's mixed code+doc corpus, and nothing holds it back any more. What confirmed 0.9.31 by hand on 2026-08-06 is left below as the record of what that class of defect looks like. On a synthetic two-file corpus 0.9.19 failed deterministically (invalid JSON, 0 non-AST elements, twice) while 0.9.31 and 0.9.34 both produced a clean semantic graph -- a real upstream bug, fixed somewhere in the nine intervening releases. On a real mixed code+doc sample from capabilities/knowledge-graph, 0.9.19 and 0.9.31 were IDENTICAL (19 nodes, 25 edges, 8 non-AST each), so the bug is content-dependent and the bump is a bugfix with no measured regression, not a fix for the corpus-wide zero. What emptied the full graph is a separate open question: a code-only run would produce the same zero, and the wrapper falls back to code-only whenever the backend is unreachable"


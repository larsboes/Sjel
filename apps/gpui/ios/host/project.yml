# XcodeGen spec for the UIKit host. `ios/run-sim` generates the project and passes RUST_LIB,
# the static library cargo built for the simulator. `tools/distribution/ios-archive` generates it
# too, for the signed device archive TestFlight takes.
name: SjelIOS
options:
  bundleIdPrefix: dev.sjel
  deploymentTarget:
    iOS: "17.0"
targets:
  SjelIOS:
    type: application
    platform: iOS
    sources:
      - path: App.swift
      - path: Audio.swift
      - path: DeviceIdentity.swift
      - path: Discovery.swift
      - path: Notifications.swift
      - path: PairScanner.swift
      - path: RoomCapture.swift
      - path: Assets.xcassets
      - path: PrivacyInfo.xcprivacy
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Sjel
        # What TestFlight and the App Store show as the build's version.
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: "1"
        # Nothing here encrypts more than TLS, which is the exempt case. Without this key the
        # upload asks the question on every build and waits for an answer.
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        # Bonjour names (`<mac>.local`) on the local network: the LAN listener's address.
        NSLocalNetworkUsageDescription: Sjel talks to your Mac on this network.
        # The service type the Mac advertises and Discovery.swift browses.
        NSBonjourServices:
          - _sjel._tcp
        # The camera scans a pairing code and captures room layouts with RoomPlan.
        NSCameraUsageDescription: Sjel scans pairing codes and captures room layouts.
        # Face ID confirms the person before a terminal on the Mac opens.
        NSFaceIDUsageDescription: Sjel confirms it is you before it opens a terminal on your Mac.
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sjel.ios
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: Embedding.h
        # A device build signs for the App Store: `ios-archive --team <TEAM_ID>` passes the team
        # and -allowProvisioningUpdates on the command line, so no account identifier lives in
        # this file. The Simulator keeps the ad-hoc identity Xcode uses there: an unsigned app
        # has no application identifier, and the Keychain refuses it the key.
        CODE_SIGN_STYLE: Automatic
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
        # The Rust library links statically; Xcode's debug dylib loader does not apply.
        ENABLE_DEBUG_DYLIB: NO
        ARCHS: arm64
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_LDFLAGS:
          - "-force_load"
          - "$(RUST_LIB)"
          - "-lc++"
          - "-ObjC"
          - "-framework Metal"
          - "-framework QuartzCore"
          - "-framework CoreText"
          - "-framework Security"
          - "-framework SystemConfiguration"
          - "-framework AVFoundation"
          - "-framework CoreMedia"
          - "-framework WebKit"
          - "-framework RoomPlan"
          - "-framework QuickLook"
          - "-framework RealityKit"
  # A touch check, not a feature test: GPUI paints every pixel, so only a real tap proves that
  # UIKit's touch reaches the view (`UITests/JoinTap.swift`). ios/run-sim --tap runs it.
  SjelIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: SjelIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sjel.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SjelIOS
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        SWIFT_VERSION: "5.0"
        ARCHS: arm64
schemes:
  SjelIOS:
    build:
      targets:
        SjelIOS: all
    test:
      targets:
        - SjelIOSUITests
